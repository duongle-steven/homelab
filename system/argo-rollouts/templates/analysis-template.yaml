# Judges a canary from the Istio Gateways' request metrics (system/istio-system's PodMonitor "gateways"): its share of
# 5xx and its p95 latency through the Gateway, each minute. No traffic is no evidence against it, so it passes
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: gateway-success-rate
spec:
  args:
    - name: service
    - name: namespace
    - name: max-error-ratio
      value: "0.05"
    - name: max-p95-ms
      value: "1000"
  metrics:
    - name: error-ratio
      interval: 30s
      count: 2
      failureLimit: 1
      successCondition: len(result) == 0 || isNaN(result[0]) || result[0] <= {{ "{{args.max-error-ratio}}" }}
      provider:
        prometheus:
          address: http://monitoring-system-kube-pro-prometheus.monitoring-system:9090
          query: |
            sum(rate(istio_requests_total{destination_service_name="{{ "{{args.service}}" }}", destination_service_namespace="{{ "{{args.namespace}}" }}", response_code=~"5.."}[1m]))
            /
            sum(rate(istio_requests_total{destination_service_name="{{ "{{args.service}}" }}", destination_service_namespace="{{ "{{args.namespace}}" }}"}[1m]))
    - name: p95-latency
      interval: 30s
      count: 2
      failureLimit: 1
      successCondition: len(result) == 0 || isNaN(result[0]) || result[0] <= {{ "{{args.max-p95-ms}}" }}
      provider:
        prometheus:
          address: http://monitoring-system-kube-pro-prometheus.monitoring-system:9090
          query: |
            histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{destination_service_name="{{ "{{args.service}}" }}", destination_service_namespace="{{ "{{args.namespace}}" }}"}[1m])))
