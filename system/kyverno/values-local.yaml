# Small nodes share everything with Kyverno and the tests: its first full scan, with the suite running, slowed the API
# server until k3s lost its own leader lease and restarted (the sandbox 2026-10-27; on staging, the top API client while
# k3s restarted six times in 40 minutes, 2026-11-01). Less work here:
kyverno:
  # No cleanup policy
  cleanupController:
    enabled: false
  features:
    # One worker, every six hours (TestPolicy reads the reports of what it creates, written at admission)
    backgroundScan:
      backgroundScanWorkers: 1
      backgroundScanInterval: 6h
    # Only validating policies
    reporting:
      mutate: false
      mutateExisting: false
      # TestSupplyChain reads its image policy's results
      imageVerify: true
      generate: false
  # Trust the local CA (staging and the sandbox) for zot, whose signatures TestSupplyChain verifies
  # (allowInsecureRegistry only allows plain HTTP)
  admissionController:
    container:
      extraEnvVars:
        - name: SSL_CERT_DIR
          value: /etc/ssl/certs:/etc/homelab-dev-ca
    extraVolumes:
      - name: dev-ca
        configMap:
          name: homelab-dev-ca
          optional: true
    extraVolumeMounts:
      - name: dev-ca
        mountPath: /etc/homelab-dev-ca
        readOnly: true
  # It verifies images too (background scan of new pods), with the local CA as above; two aggregation workers (ten by
  # default)
  reportsController:
    extraArgs:
      aggregationWorkers: 2
    extraEnvVars:
      - name: SSL_CERT_DIR
        value: /etc/ssl/certs:/etc/homelab-dev-ca
    extraVolumes:
      - name: dev-ca
        configMap:
          name: homelab-dev-ca
          optional: true
    extraVolumeMounts:
      - name: dev-ca
        mountPath: /etc/homelab-dev-ca
        readOnly: true

# Staging and the sandbox run lab's image built from the checkout (scripts/build-lab-image), unsigned: TestSupplyChain
# proves Kyverno's verification with its own signed image instead
labImagePolicy:
  enabled: false
