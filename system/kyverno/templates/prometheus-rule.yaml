# A new fail or error in Kyverno's reports reaches a person while the policies only audit, and after Enforce too: a pod
# admitted while Kyverno was down, or a new policy judging what already runs (G1,
# docs/superpowers/specs/2026-11-27-policy-report-alert-design.md). kube-state-metrics exports each result
# (system/monitoring-system); each alert is one namespace, top owner, policy, rule and result, never a pod's or
# ReplicaSet's name, so a rollout or a CronJob's next run is not a new failure and a silence keeps holding.
# test/offline/fixtures/policy-report-rule-tests.yaml runs it with promtool
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kyverno-policy-reports
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: kyverno-policy-reports
      rules:
        # A pod's report goes to its controller; a pod with no owner (or one not exported yet) stays itself
        - record: kyverno:policy_result:subject
          expr: |
            max by (namespace, kind, name, policy, rule, result) (kyverno_policyreport_result{kind!="Pod"})
            or max by (namespace, kind, name, policy, rule, result) (
              label_replace(label_replace(
                label_replace(kyverno_policyreport_result{kind="Pod"}, "pod", "$1", "name", "(.*)")
                * on(namespace, pod) group_left(owner_kind, owner_name) max by (namespace, pod, owner_kind, owner_name) (kube_pod_owner{owner_kind!="<none>", owner_is_controller="true"}),
              "kind", "$1", "owner_kind", "(.*)"), "name", "$1", "owner_name", "(.*)")
            )
            or max by (namespace, kind, name, policy, rule, result) (
              label_replace(kyverno_policyreport_result{kind="Pod"}, "pod", "$1", "name", "(.*)")
              unless on(namespace, pod) kube_pod_owner{owner_kind!="<none>", owner_is_controller="true"}
            )
        # Then to the top: a ReplicaSet's Deployment, a Job's CronJob; a Workflow without its name (a new one every
        # run of the golden path)
        - record: kyverno:policy_result:owner
          expr: |
            max by (namespace, owner_kind, owner_name, policy, rule, result) (
              label_replace(label_replace(kyverno:policy_result:subject{kind!~"ReplicaSet|Job|Workflow"},
              "owner_kind", "$1", "kind", "(.*)"), "owner_name", "$1", "name", "(.*)")
            )
            or max by (namespace, owner_kind, owner_name, policy, rule, result) (
              label_replace(kyverno:policy_result:subject{kind="ReplicaSet"}, "replicaset", "$1", "name", "(.*)")
              * on(namespace, replicaset) group_left(owner_kind, owner_name) max by (namespace, replicaset, owner_kind, owner_name) (kube_replicaset_owner{owner_kind="Deployment"})
            )
            or max by (namespace, owner_kind, owner_name, policy, rule, result) (
              label_replace(label_replace(
                label_replace(kyverno:policy_result:subject{kind="ReplicaSet"}, "replicaset", "$1", "name", "(.*)")
                unless on(namespace, replicaset) kube_replicaset_owner{owner_kind="Deployment"},
              "owner_kind", "$1", "kind", "(.*)"), "owner_name", "$1", "name", "(.*)")
            )
            or max by (namespace, owner_kind, owner_name, policy, rule, result) (
              label_replace(kyverno:policy_result:subject{kind="Job"}, "job_name", "$1", "name", "(.*)")
              * on(namespace, job_name) group_left(owner_kind, owner_name) max by (namespace, job_name, owner_kind, owner_name) (kube_job_owner{owner_kind="CronJob"})
            )
            or max by (namespace, owner_kind, owner_name, policy, rule, result) (
              label_replace(label_replace(
                label_replace(kyverno:policy_result:subject{kind="Job"}, "job_name", "$1", "name", "(.*)")
                unless on(namespace, job_name) kube_job_owner{owner_kind="CronJob"},
              "owner_kind", "$1", "kind", "(.*)"), "owner_name", "$1", "name", "(.*)")
            )
            or max by (namespace, owner_kind, policy, rule, result) (
              label_replace(kyverno:policy_result:subject{kind="Workflow"}, "owner_kind", "$1", "kind", "(.*)")
            )
        # No for: a short-lived pod's report goes with it, so one scrape is enough, and it keeps firing long enough for
        # Alertmanager to send it. PolicyExceptions apply before their workloads (scripts/check-policy), so a deploy
        # raises no false failure
        - alert: PolicyReportFail
          expr: |
            kyverno:policy_result:owner{result=~"fail|error"}
            or max by (owner_kind, owner_name, policy, rule, result) (
              label_replace(label_replace(kyverno_clusterpolicyreport_result{result=~"fail|error"},
              "owner_kind", "$1", "kind", "(.*)"), "owner_name", "$1", "name", "(.*)")
            )
          keep_firing_for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{`{{ $labels.owner_kind }}{{ with $labels.owner_name }} {{ . }}{{ end }}{{ with $labels.namespace }} in {{ . }}{{ end }} breaks {{ $labels.policy }}{{ with $labels.rule }} ({{ . }}){{ end }}`}}
            description: >-
              {{`Kyverno reports a {{ $labels.result }} for {{ $labels.owner_kind }}{{ with $labels.owner_name }} {{ . }}{{ end }}{{ with $labels.namespace }} in {{ . }}{{ end }} under {{ $labels.policy }}{{ with $labels.rule }}, rule {{ . }}{{ end }}.`}}
              Fix the workload, or add a PolicyException beside it with its homelab/reason and a sync wave before it
              (docs/how-to-guides/policy.md).
              {{`{{ if $labels.namespace }}kubectl get policyreports -n {{ $labels.namespace }} -o yaml{{ else }}kubectl get clusterpolicyreports -o yaml{{ end }}`}}
