{{- if .Values.labImagePolicy.enabled }}
# lab's image (platform/secrets-rotation) is signed keyless by .github/workflows/lab-image.yaml on master, with its
# SBOM attested (SPDX): a pod running it must carry both, from that workflow on master only (no regex: a branch's run
# would pass). Audit, like every policy until step 15b-2 (docs/how-to-guides/supply-chain.md)
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-lab-image
spec:
  validationActions: [Audit]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: {{ .Values.labImagePolicy.image | quote }}
  # Judge only: the image is pinned by digest already (platform/secrets-rotation/values.yaml)
  validationConfigurations:
    mutateDigest: false
    verifyDigest: true
    required: true
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/duongle-steven/homelab/.github/workflows/lab-image.yaml@refs/heads/master
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: sbom
      intoto:
        type: https://spdx.dev/Document
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.github])).all(e, e > 0)
      message: lab's image is not signed by lab-image.yaml on master
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.github])).all(e, e > 0)
      message: lab's image has no SBOM attested by lab-image.yaml on master
{{- end }}
