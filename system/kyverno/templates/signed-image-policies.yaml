{{- if .Values.signedImages.enabled }}
{{- range $name, $i := .Values.signedImages.images }}
# {{ $i.what }} is signed keyless by .github/workflows/{{ $i.workflow }} on master, with its SBOM attested (SPDX): a pod
# running it must carry both, from that workflow on master only (no regex: a branch's run would pass). Audit, like every
# policy until step 15b-2 (docs/how-to-guides/supply-chain.md)
---
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-{{ $name }}-image
spec:
  validationActions: [Audit]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: {{ $i.image | quote }}
  # Judge only: the image is pinned by digest already (its chart's production values)
  validationConfigurations:
    mutateDigest: false
    verifyDigest: true
    required: true
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/duongle-steven/homelab/.github/workflows/{{ $i.workflow }}@refs/heads/master
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: sbom
      intoto:
        type: https://spdx.dev/Document
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.github])).all(e, e > 0)
      message: {{ $i.what }} is not signed by {{ $i.workflow }} on master
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.github])).all(e, e > 0)
      message: {{ $i.what }} has no SBOM attested by {{ $i.workflow }} on master
{{- end }}
{{- end }}
