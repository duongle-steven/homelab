# Under the mesh-wide deny-all (system/istio-system): who may call into this namespace. The API server calls the
# admission and cleanup controllers' webhooks, which are outside the mesh (values.yaml); the other controllers take
# no calls
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow
  namespace: {{ .Release.Namespace }}
  # Its CRD comes from istio-system, which holds PolicyExceptions whose CRD comes from here: a cycle on a fresh
  # cluster. Argo CD refuses a sync with a PolicyException whose CRD is missing even with SkipDryRunOnMissingResource,
  # so the cycle breaks here: Kyverno installs its CRDs, istio-system follows, and this is applied at the next retry
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["{{ .Release.Namespace }}"]
