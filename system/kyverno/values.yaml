# Kyverno (docs/superpowers/specs/2026-10-27-policy-design.md): Pod Security restricted, pinned images and allowed
# registries, in Audit (step 15b-1; Enforce is 15b-2). scripts/check-policy runs the same policies in CI. A workload
# that must break one has a PolicyException in its own chart or app file, with its reason.
kyverno:
  # The same images from ghcr.io: reg.kyverno.io fronts it, and the sandbox's pull-through cache cannot follow that
  global:
    image:
      registry: ghcr.io
  features:
    # Audit: an unreachable Kyverno never blocks a deploy
    forceFailurePolicyIgnore:
      enabled: true
    # Each exception lives beside what it excuses, in that component's namespace. Whoever can create one there skips
    # the policies it names: restrict that before Enforce (15b-2)
    policyExceptions:
      enabled: true
      namespace: "*"
  # The API server calls these webhooks: outside the mesh (CLAUDE.md, mesh)
  # Outside the mesh, each opens only its webhook port (templates/network-policy.yaml: the chart's own opens every
  # port to everyone)
  admissionController:
    podLabels:
      istio.io/dataplane-mode: none
    container:
      extraArgs:
        allowedResults: fail,error,warn
  cleanupController:
    podLabels:
      istio.io/dataplane-mode: none
  # Only validating policies here: no generate or mutate-existing policy for it to run
  backgroundController:
    enabled: false
  # Reports hold only what needs attention (a result per policy and workload otherwise: mostly pass). The reports
  # controller renews its leader Lease through the same rate-limited client that its background scan uses, and the
  # scan re-reads API discovery over and over (about 64 requests at once, every few seconds: 25/s on the sandbox).
  # At 50/s with a burst of 100 the Lease renewal waited behind them, the controller lost its lease, restarted and
  # scanned again: 64 restarts in 8 hours (the sandbox, 2026-10-29; at the defaults, 20/s and 50, on 2026-10-28). The
  # burst holds several discovery rounds; discovery is served from the API server's memory.
  reportsController:
    extraArgs:
      allowedResults: fail,error,warn
      clientRateLimitQPS: 100
      clientRateLimitBurst: 300
kyverno-policies:
  podSecurityStandard: restricted
  validationFailureAction: Audit
  failurePolicy: Ignore
  # Woodpecker's step pods run in user namespaces (hostUsers: false)
  podSecurityUserNamespaces: true
# Registries images may come from (templates/images.yaml); zot (registry.<domain>) is added there
registries: [docker.io, ghcr.io, quay.io, registry.k8s.io, gcr.io, code.forgejo.org, public.ecr.aws, lscr.io]
