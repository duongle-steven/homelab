# Kyverno (docs/superpowers/specs/2026-10-27-policy-design.md): Pod Security restricted, pinned images and allowed
# registries, in Audit (step 15b-1; Enforce is 15b-2). scripts/check-policy runs the same policies in CI. A workload
# that must break one has a PolicyException in its own chart or app file, with its reason.
kyverno:
  # The same images from ghcr.io: reg.kyverno.io fronts it, and the sandbox's pull-through cache cannot follow that
  global:
    image:
      registry: ghcr.io
  features:
    # Audit: an unreachable Kyverno never blocks a deploy
    forceFailurePolicyIgnore:
      enabled: true
    # Each exception lives beside what it excuses, in that component's namespace. Whoever can create one there skips
    # the policies it names: restrict that before Enforce (15b-2)
    policyExceptions:
      enabled: true
      namespace: "*"
  # The API server calls these webhooks: outside the mesh (CLAUDE.md, mesh)
  # Outside the mesh, each opens only its webhook port (templates/network-policy.yaml: the chart's own opens every
  # port to everyone)
  admissionController:
    podLabels:
      istio.io/dataplane-mode: none
    container:
      extraArgs:
        allowedResults: fail,error,warn
  cleanupController:
    podLabels:
      istio.io/dataplane-mode: none
  # Only validating policies here: no generate or mutate-existing policy for it to run
  backgroundController:
    enabled: false
  # Reports hold only what needs attention (a result per policy and workload otherwise: mostly pass). At the defaults
  # the reports controller, aggregating them under its client rate limit (20/s, burst 50), could not renew its
  # leader Lease in time and restarted, again and again (the sandbox, 2026-10-28)
  reportsController:
    extraArgs:
      allowedResults: fail,error,warn
      clientRateLimitQPS: 50
      clientRateLimitBurst: 100
    # Its working set reaches about 125Mi (the sandbox, 2026-10-29). At the chart's 128Mi limit the kernel kept
    # reclaiming its memory, the process stalled, its Lease renewal missed the deadline and it exited: 64 restarts in
    # 8 hours, reports late or missing
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
  crds:
    install: false
kyverno-policies:
  podSecurityStandard: restricted
  validationFailureAction: Audit
  failurePolicy: Ignore
  # The golden path's build pods run in user namespaces (hostUsers: false, platform/ci)
  podSecurityUserNamespaces: true
# Registries images may come from (templates/images.yaml); zot (registry.<domain>) is added there
registries: [docker.io, ghcr.io, quay.io, registry.k8s.io, gcr.io, code.forgejo.org, public.ecr.aws, lscr.io]
# Images GitHub Actions signs keyless on master with their SBOM (templates/signed-image-policies.yaml): production only
signedImages:
  enabled: true
  images:
    lab:
      what: lab's image (platform/secrets-rotation)
      image: ghcr.io/duongle-steven/homelab-lab*
      workflow: lab-image.yaml
    backstage:
      what: Backstage's image (platform/backstage)
      image: ghcr.io/duongle-steven/homelab-backstage*
      workflow: backstage-image.yaml
# k3s's own workloads in kube-system (templates/kube-system-exceptions.yaml): they break restricted, and k3s rewrites
# their manifests at every start, so they are excused here rather than fixed (G1,
# docs/superpowers/specs/2026-11-27-policy-report-alert-design.md). Each matches the names starting with its key (or
# prefix)
kubeSystemExceptions:
  coredns:
    reason: "k3s's packaged CoreDNS adds NET_BIND_SERVICE and states no runAsNonRoot or seccomp profile (the nodes' seccomp-default gives it RuntimeDefault)"
    policies: [disallow-capabilities-strict, require-run-as-nonroot, restrict-seccomp-strict]
  metrics-server:
    reason: "k3s's packaged metrics-server states no seccomp profile (the nodes' seccomp-default gives it RuntimeDefault)"
    policies: [restrict-seccomp-strict]
  kube-vip:
    reason: "kube-vip (infra/_modules/metal) announces the VIPs on the host network as root with NET_ADMIN and NET_RAW, and states no seccomp profile or allowPrivilegeEscalation: revisit (a change rolls the nodes). Listed from its manifest: no Kyverno has judged it yet"
    policies: [disallow-capabilities, disallow-capabilities-strict, disallow-host-namespaces, disallow-privilege-escalation, require-run-as-nonroot, restrict-seccomp-strict]
