# The Tunnel's credentials (infra/production/cloudflare, through platform/infra-secrets)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: cloudflared-credentials
  data:
    - secretKey: credentials.json
      remoteRef:
        key: cloudflared/cloudflare
        property: credentials.json
