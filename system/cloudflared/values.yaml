app-template:
  # Pod Security restricted (system/kyverno): the image's user 65532
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
  controllers:
    cloudflared:
      defaultContainerOptionsStrategy: merge
      defaultContainerOptions:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
      containers:
        app:
          image:
            repository: docker.io/cloudflare/cloudflared
            tag: 2026.10.0
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - run
  configMaps:
    config:
      enabled: true
      data:
        config.yaml: |
          tunnel: homelab
          credentials-file: /etc/cloudflared/credentials.json
          metrics: 0.0.0.0:2000
          no-autoupdate: true
          ingress:
            # Only the public Gateway: apps on the LAN Gateway stay off the internet
            - hostname: '*.{{ .Values.global.baseDomain }}'
              service: https://public-istio.istio-system
              originRequest:
                noTLSVerify: true
                # The Gateway's listener needs the requested host as SNI
                matchSNItoHost: true
            - service: http_status:404
  persistence:
    config:
      enabled: true
      type: configMap
      identifier: config
      globalMounts:
        - path: /etc/cloudflared/config.yaml
          subPath: config.yaml
    credentials:
      enabled: true
      type: secret
      # credentials.json from OpenBao (templates/credentials-secret.yaml)
      name: cloudflared-credentials
      globalMounts:
        - path: /etc/cloudflared/credentials.json
          subPath: credentials.json
