# Pod Security restricted (system/kyverno) does not hold here: each exception says why in homelab/reason
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: node-exporter
  namespace: {{ .Release.Namespace }}
  annotations:
    homelab/reason: "node-exporter reads its node's metrics: host network and PID, the host's / and /proc read-only"
spec:
  policyRefs:
    - {name: disallow-host-namespaces, kind: ValidatingPolicy}
    - {name: disallow-host-path, kind: ValidatingPolicy}
    - {name: disallow-privilege-escalation, kind: ValidatingPolicy}
    - {name: restrict-seccomp-strict, kind: ValidatingPolicy}
    - {name: restrict-volume-types, kind: ValidatingPolicy}
  matchConditions:
    - name: node-exporter
      expression: "object.metadata.name.startsWith('monitoring-system-prometheus-node-exporter')"
