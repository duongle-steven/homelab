# Alertmanager's ntfy token (user alerts, write-only on topic alerts; apps/ntfy.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: ntfy
    template:
      engineVersion: v2
      data:
        token: "{{ `tk_{{ .token }}` }}"
  data:
    - secretKey: token
      remoteRef:
        key: monitoring-system/generated/ntfy
        property: token
