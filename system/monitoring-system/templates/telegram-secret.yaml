{{- if .Values.telegram }}
# Alertmanager's Telegram bot token and chat id (docs/how-to-guides/alerts.md): written to OpenBao by a person, never
# in git (the chat id names a person's chat); lab secrets rotate telegram.bot-token guides a new token
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telegram
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: telegram
  data:
    - secretKey: bot-token
      remoteRef:
        key: monitoring-system/telegram
        property: bot_token
    - secretKey: chat-id
      remoteRef:
        key: monitoring-system/telegram
        property: chat_id
{{- end }}
