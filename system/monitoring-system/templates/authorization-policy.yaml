# Under the mesh-wide deny-all (system/istio-system): who may call into this namespace
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow
  namespace: {{ .Release.Namespace }}
  # Its CRD comes from another component that needs this one first (cert-manager, istio-system and
  # monitoring-system wait for each other's CRDs): apply the rest of the sync and retry this
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  action: ALLOW
  rules:
    # Pods in this namespace call each other freely
    - from:
        - source:
            namespaces: ["{{ .Release.Namespace }}"]
    # Grafana's Prometheus data source
    - from:
        - source:
            principals: ["cluster.local/ns/grafana/sa/grafana"]
      to:
        - operation:
            ports: ["9090"]
    # Kiali's graph and metrics (system/kiali)
    - from:
        - source:
            principals: ["cluster.local/ns/kiali/sa/kiali"]
      to:
        - operation:
            ports: ["9090"]
    # Grafana's Alertmanager data source
    - from:
        - source:
            principals: ["cluster.local/ns/grafana/sa/grafana"]
      to:
        - operation:
            ports: ["9093"]
    # Loki's ruler: the alerts from the audit logs (system/loki)
    - from:
        - source:
            principals: ["cluster.local/ns/loki/sa/loki"]
      to:
        - operation:
            ports: ["9093"]
