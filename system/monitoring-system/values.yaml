kube-prometheus-stack:
  prometheusOperator:
    # The API server (outside the mesh) calls its admission webhook
    podLabels:
      istio.io/dataplane-mode: none
  # templates/control-plane-scrape.yaml scrapes these by node discovery; the chart's address-list scrape (Service
  # and ServiceMonitor) is off, its rules and dashboards stay
  kubeControllerManager: &scrapedElsewhere
    service:
      enabled: false
    serviceMonitor:
      enabled: false
  kubeScheduler: *scrapedElsewhere
  kubeEtcd: *scrapedElsewhere
  kubeProxy: *scrapedElsewhere
  grafana:
    enabled: false
    forceDeployDatasources: true
    forceDeployDashboards: true
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.loki:3100
  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
  alertmanager:
    alertmanagerSpec:
      # templates/ntfy-secret.yaml, mounted at /etc/alertmanager/secrets/ntfy/
      secrets: [ntfy]
    config:
      route:
        receiver: ntfy
        group_by:
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # A heartbeat every minute that replaces one delayed message (sequence watchdog): if heartbeats stop, the
          # last one is delivered 15 minutes later
          - receiver: ntfy-watchdog
            matchers:
              - alertname = "Watchdog"
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 1m
          # ntfy's highest priority, so they stand out on phones (the alertmanager template sends the default)
          - receiver: ntfy-critical
            matchers:
              - severity = "critical"
      receivers:
        - name: ntfy
          webhook_configs:
            - url: http://ntfy.ntfy/alerts?template=alertmanager
              send_resolved: true
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/ntfy/token
        - name: ntfy-critical
          webhook_configs:
            - url: http://ntfy.ntfy/alerts?template=alertmanager&priority=5
              send_resolved: true
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/ntfy/token
        - name: ntfy-watchdog
          webhook_configs:
            - url: http://ntfy.ntfy/
              send_resolved: false
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/ntfy/token
              payload:
                topic: alerts
                title: Monitoring heartbeat missing
                message: Watchdog heartbeats stopped
                delay: 15m
                sequence_id: watchdog
