kube-prometheus-stack:
  kube-state-metrics:
    # The chart's list without secrets: nothing here reads kube_secret_*, and listing them is reading every Secret. A copy
    # of the chart's defaults: compare it with the chart's at each bump, or a new collector stays off
    collectors:
      - certificatesigningrequests
      - configmaps
      - cronjobs
      - daemonsets
      - deployments
      - endpointslices
      - horizontalpodautoscalers
      - ingresses
      - jobs
      - leases
      - limitranges
      - mutatingwebhookconfigurations
      - namespaces
      - networkpolicies
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - poddisruptionbudgets
      - pods
      - replicasets
      - replicationcontrollers
      - resourcequotas
      - services
      - statefulsets
      - storageclasses
      - validatingwebhookconfigurations
      - volumeattachments
    # Kargo's Promotions by phase (KargoPromotionFailed, platform/kargo): Kargo's own metrics count reconcile errors,
    # and a promotion whose step fails ends Failed or Errored without one
    customResourceState:
      enabled: true
      config:
        spec:
          resources:
            - groupVersionKind:
                group: kargo.akuity.io
                version: v1alpha1
                kind: Promotion
              metricNamePrefix: kargo_promotion
              labelsFromPath:
                name: [metadata, name]
                namespace: [metadata, namespace]
                stage: [spec, stage]
              metrics:
                - name: phase
                  help: The Promotion's phase (1 for its current one)
                  each:
                    type: StateSet
                    stateSet:
                      labelName: phase
                      path: [status, phase]
                      list: [Pending, Running, Succeeded, Failed, Errored, Aborted]
            # Kyverno's reports, one series per result (Kyverno keeps fail, error and warn only): PolicyReportFail
            # (system/kyverno) alerts on a new failure (G1, docs/superpowers/specs/2026-11-27-policy-report-alert-design.md)
            - groupVersionKind: &policyReport
                group: wgpolicyk8s.io
                version: v1alpha2
                kind: PolicyReport
              metricNamePrefix: kyverno_policyreport
              labelsFromPath:
                namespace: [metadata, namespace]
                kind: [scope, kind]
                name: [scope, name]
              metrics: &policyResults
                - name: result
                  help: A result of a Kyverno policy on the report's resource
                  each:
                    type: Info
                    info:
                      path: [results]
                      labelsFromPath:
                        policy: [policy]
                        rule: [rule]
                        result: [result]
            - groupVersionKind:
                <<: *policyReport
                kind: ClusterPolicyReport
              metricNamePrefix: kyverno_clusterpolicyreport
              labelsFromPath:
                kind: [scope, kind]
                name: [scope, name]
              metrics: *policyResults
    rbac:
      extraRules:
        - apiGroups: [kargo.akuity.io]
          resources: [promotions]
          verbs: [list, watch]
        - apiGroups: [wgpolicyk8s.io]
          resources: [policyreports, clusterpolicyreports]
          verbs: [list, watch]
  prometheusOperator:
    # The operator starts a controller only for the CRDs it finds at its start: it comes after them (wave 0, healthy
    # once established), and Prometheus and Alertmanager after it (TestOperatorAfterItsCRDs)
    annotations:
      argocd.argoproj.io/sync-wave: "1"
    # The API server (outside the mesh) calls its admission webhook
    podLabels:
      istio.io/dataplane-mode: none
  # templates/control-plane-scrape.yaml scrapes these by node discovery; the chart's address-list scrape (Service
  # and ServiceMonitor) is off, its rules and dashboards stay
  kubeControllerManager: &scrapedElsewhere
    service:
      enabled: false
    serviceMonitor:
      enabled: false
  kubeScheduler: *scrapedElsewhere
  kubeEtcd: *scrapedElsewhere
  kubeProxy: *scrapedElsewhere
  kubelet:
    serviceMonitor:
      # k3s's kubelet port serves the whole process's metrics: the API server's and etcd's (jobs apiserver and
      # kube-etcd keep them), the controllers' workqueues and the scheduler's. They were about 120k of the sandbox's
      # 140k kubelet series; no rule or dashboard reads them from this job (TestKubeletJobOwnMetricsOnly)
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: (apiserver|etcd|workqueue|scheduler)_.+
        # The chart's default, restated: Helm replaces lists
        - action: drop
          sourceLabels: [__name__, le]
          regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
  grafana:
    enabled: false
    forceDeployDatasources: true
    forceDeployDashboards: true
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.loki:3100
        jsonData:
          # A log line's trace (the Istio Gateways' access logs carry it: system/istio-system's Telemetry) opens in Tempo
          derivedFields:
            - name: trace_id
              matcherRegex: '"trace_id":"(\w+)"'
              url: "$${__value.raw}"
              datasourceUid: tempo
      # Traces (system/tempo), linked back to the logs of the same trace
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.tempo:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
  prometheus:
    # After the operator (prometheusOperator.annotations)
    annotations: &afterOperator
      argocd.argoproj.io/sync-wave: "2"
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
  alertmanager:
    annotations: *afterOperator
    # config below reads global.timezone
    tplConfig: true
    alertmanagerSpec:
      # templates/ntfy-secret.yaml, mounted at /etc/alertmanager/secrets/ntfy/
      secrets: [ntfy]
      # templates/telegram-secret.yaml, optional: until a person writes the bot to OpenBao, Alertmanager runs and its
      # Telegram notifications fail (AlertmanagerFailedToSendAlerts says so)
      volumes:
        - name: telegram
          secret: {secretName: telegram, optional: true}
      volumeMounts:
        - {name: telegram, mountPath: /etc/alertmanager/secrets/telegram, readOnly: true}
    config:
      route:
        receiver: ntfy
        group_by:
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # A heartbeat every minute that replaces one delayed message (sequence watchdog): if heartbeats stop, the
          # last one is delivered 15 minutes later
          - receiver: ntfy-watchdog
            matchers:
              - alertname = "Watchdog"
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 1m
          # Alerts from the audit logs (system/loki): one notification per alert and user, so a tool run with the admin
          # kubeconfig that execs and reads Secrets many times notifies once
          - receiver: ntfy
            matchers:
              - source="audit"
            group_by:
              - alertname
              - user
          # Runtime detection: a process doing this at night is worth waking for, whatever its severity
          - receiver: ntfy
            matchers:
              - source="falco"
          # One person is on call around the clock: anything below critical waits for the morning (a muted alert still
          # firing is sent when the night ends; one that resolved during it is not). Critical always rings (ntfy's
          # priority 5), and so do the security alerts above
          - receiver: ntfy
            matchers:
              - severity!="critical"
            mute_time_intervals:
              - night
      # The time zone is the environment's (global.timezone): tplConfig passes this config through Helm's templating
      time_intervals:
        - name: night
          time_intervals:
            - times:
                - start_time: "22:00"
                  end_time: "24:00"
                - start_time: "00:00"
                  end_time: "07:00"
              location: '{{ .Values.global.timezone }}'
      receivers:
        - name: ntfy
          webhook_configs:
            # apps/ntfy.yaml's template alerts: priority from the severity
            - url: http://ntfy.ntfy/alerts?template=alerts
              send_resolved: true
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/ntfy/token
          # The second path, for when ntfy is down and the cluster is up: the bot token and the chat id from
          # OpenBao (docs/how-to-guides/alerts.md), read at every notification
          telegram_configs:
            - bot_token_file: /etc/alertmanager/secrets/telegram/bot-token
              chat_id_file: /etc/alertmanager/secrets/telegram/chat-id
              send_resolved: true
        - name: ntfy-watchdog
          webhook_configs:
            - url: http://ntfy.ntfy/
              send_resolved: false
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/ntfy/token
              payload:
                topic: alerts
                title: Monitoring heartbeat missing
                message: Watchdog heartbeats stopped
                delay: 15m
                sequence_id: watchdog
  crds:
    enabled: false
  prometheus-node-exporter:
    # The nodes' metric files (G11: the age of their nixpkgs, their weekly store check; infra/_modules/metal's
    # node-patches profile) under the host's root. The chart's own two arguments restated: Helm replaces the list
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
      - --collector.textfile.directory=/host/root/var/lib/node-exporter
# The nodes' packages and store check (templates/node-patches-rule.yaml): NixOS nodes only, so off in the sandbox
nodeAlerts: true
# Telegram, the second path for every alert (templates/telegram-secret.yaml): off in the sandbox, which has no bot
telegram: true
