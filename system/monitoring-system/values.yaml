kube-prometheus-stack:
  prometheusOperator:
    # The API server (outside the mesh) calls its admission webhook
    podLabels:
      istio.io/dataplane-mode: none
  # k3s runs the control plane and kube-proxy inside its own process, so the chart's pod selectors find
  # nothing: scrape the nodes instead (keep in sync with metal/inventories/prod.yml)
  kubeControllerManager:
    endpoints: &controlPlane [192.168.1.110, 192.168.1.111, 192.168.1.112]
    serviceMonitor: &oneComponent
      # Every port of the k3s process serves all components' metrics: keep only this component's
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: (apiserver|etcd|kubelet|container)_.+
  kubeScheduler:
    endpoints: *controlPlane
    serviceMonitor: *oneComponent
  kubeEtcd:
    endpoints: *controlPlane
  kubeProxy:
    endpoints: [192.168.1.110, 192.168.1.111, 192.168.1.112, 192.168.1.113]
    serviceMonitor: *oneComponent
  grafana:
    enabled: false
    forceDeployDatasources: true
    forceDeployDashboards: true
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.loki:3100
  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
  alertmanager:
    alertmanagerSpec:
      containers:
        - name: ntfy-relay
          image: ghcr.io/khuedoan/webhook-transformer:v0.0.3
          args:
            - --port=8081
            - --config=/config/alertmanager-to-ntfy.jsonnet
            - --upstream-host=https://ntfy.sh
          envFrom:
            - secretRef:
                name: webhook-transformer
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: webhook-transformer
    config:
      route:
        receiver: ntfy
        group_by:
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          - receiver: ntfy
            matchers:
              - alertname = "Watchdog"
      receivers:
        - name: ntfy
          webhook_configs:
            - url: http://localhost:8081
              send_resolved: true
