kube-prometheus-stack:
  prometheusOperator:
    # The API server (outside the mesh) calls its admission webhook
    podLabels:
      istio.io/dataplane-mode: none
  # templates/control-plane-scrape.yaml scrapes these by node discovery; the chart's address-list scrape (Service
  # and ServiceMonitor) is off, its rules and dashboards stay
  kubeControllerManager: &scrapedElsewhere
    service:
      enabled: false
    serviceMonitor:
      enabled: false
  kubeScheduler: *scrapedElsewhere
  kubeEtcd: *scrapedElsewhere
  kubeProxy: *scrapedElsewhere
  grafana:
    enabled: false
    forceDeployDatasources: true
    forceDeployDashboards: true
    additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.loki:3100
  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
  alertmanager:
    alertmanagerSpec:
      # templates/ntfy-secret.yaml, mounted at /etc/alertmanager/secrets/ntfy/
      secrets: [ntfy]
      # templates/telegram-secret.yaml, optional: until a person writes the bot to OpenBao, Alertmanager runs and its
      # Telegram notifications fail (AlertmanagerFailedToSendAlerts says so)
      volumes:
        - name: telegram
          secret: {secretName: telegram, optional: true}
      volumeMounts:
        - {name: telegram, mountPath: /etc/alertmanager/secrets/telegram, readOnly: true}
    config:
      route:
        receiver: ntfy
        group_by:
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # A heartbeat every minute that replaces one delayed message (sequence watchdog): if heartbeats stop, the
          # last one is delivered 15 minutes later
          - receiver: ntfy-watchdog
            matchers:
              - alertname = "Watchdog"
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 1m
      receivers:
        - name: ntfy
          webhook_configs:
            # apps/ntfy.yaml's template alerts: priority from the severity
            - url: http://ntfy.ntfy/alerts?template=alerts
              send_resolved: true
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/ntfy/token
          # The second path, for when ntfy is down and the cluster is up: the bot token and the chat id from
          # OpenBao (docs/how-to-guides/alerts.md), read at every notification
          telegram_configs:
            - bot_token_file: /etc/alertmanager/secrets/telegram/bot-token
              chat_id_file: /etc/alertmanager/secrets/telegram/chat-id
              send_resolved: true
        - name: ntfy-watchdog
          webhook_configs:
            - url: http://ntfy.ntfy/
              send_resolved: false
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/ntfy/token
              payload:
                topic: alerts
                title: Monitoring heartbeat missing
                message: Watchdog heartbeats stopped
                delay: 15m
                sequence_id: watchdog
# Telegram, the second path for every alert (templates/telegram-secret.yaml): off in the sandbox, which has no bot
telegram: true
