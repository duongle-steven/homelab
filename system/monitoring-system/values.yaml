kube-prometheus-stack:
  prometheusOperator:
    # The API server (outside the mesh) calls its admission webhook
    podLabels:
      istio.io/dataplane-mode: none
  # templates/control-plane-scrape.yaml scrapes these by node discovery; the chart's address-list scrape (Service
  # and ServiceMonitor) is off, its rules and dashboards stay
  kubeControllerManager: &scrapedElsewhere
    service:
      enabled: false
    serviceMonitor:
      enabled: false
  kubeScheduler: *scrapedElsewhere
  kubeEtcd: *scrapedElsewhere
  kubeProxy: *scrapedElsewhere
  grafana:
    enabled: false
    forceDeployDatasources: true
    forceDeployDashboards: true
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.loki:3100
  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
  alertmanager:
    alertmanagerSpec:
      containers:
        - name: ntfy-relay
          image: ghcr.io/khuedoan/webhook-transformer:v0.0.3
          args:
            - --port=8081
            - --config=/config/alertmanager-to-ntfy.jsonnet
            - --upstream-host=https://ntfy.sh
          envFrom:
            - secretRef:
                name: webhook-transformer
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: webhook-transformer
    config:
      route:
        receiver: ntfy
        group_by:
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          - receiver: ntfy
            matchers:
              - alertname = "Watchdog"
      receivers:
        - name: ntfy
          webhook_configs:
            - url: http://localhost:8081
              send_resolved: true
