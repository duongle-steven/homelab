# Testbed and the sandbox have no Telegram bot: no volume, and the receivers restated without telegram_configs (Helm
# replaces lists: keep them in step with values.yaml)
kube-prometheus-stack:
  alertmanager:
    alertmanagerSpec:
      volumes: []
      volumeMounts: []
    config:
      # Nobody is on call here, and the suite posts warnings at any hour: the night never comes (31 February), with
      # production's hours and time zone so Alertmanager still parses them (TestAlertmanagerQuietHours)
      time_intervals:
        - name: night
          time_intervals:
            - times:
                - start_time: "22:00"
                  end_time: "24:00"
                - start_time: "00:00"
                  end_time: "07:00"
              months: ["february"]
              days_of_month: ["31"]
              location: '{{ .Values.global.timezone }}'
      receivers:
        - name: ntfy
          webhook_configs:
            # apps/ntfy.yaml's template alerts: priority from the severity
            - url: http://ntfy.ntfy/alerts?template=alerts
              send_resolved: true
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/ntfy/token
        - name: ntfy-watchdog
          webhook_configs:
            - url: http://ntfy.ntfy/
              send_resolved: false
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/ntfy/token
              payload:
                topic: alerts
                title: Monitoring heartbeat missing
                message: Watchdog heartbeats stopped
                delay: 15m
                sequence_id: watchdog
telegram: false
