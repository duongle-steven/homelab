# The sandbox has no Telegram bot: no volume, and the receivers restated without telegram_configs (Helm replaces
# lists: keep them in step with values.yaml)
kube-prometheus-stack:
  # The sandbox's largest component (1.5 GB): one day is enough for the tests, which read recent series
  # (docs/superpowers/specs/2026-10-28-sandbox-optional-apps-design.md)
  prometheus:
    prometheusSpec:
      retention: 1d
  alertmanager:
    alertmanagerSpec:
      volumes: []
      volumeMounts: []
    config:
      receivers:
        - name: ntfy
          webhook_configs:
            # apps/ntfy.yaml's template alerts: priority from the severity
            - url: http://ntfy.ntfy/alerts?template=alerts
              send_resolved: true
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/ntfy/token
        - name: ntfy-watchdog
          webhook_configs:
            - url: http://ntfy.ntfy/
              send_resolved: false
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/ntfy/token
              payload:
                topic: alerts
                title: Monitoring heartbeat missing
                message: Watchdog heartbeats stopped
                delay: 15m
                sequence_id: watchdog
telegram: false
