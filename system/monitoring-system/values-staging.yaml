# Staging's fallback (docs/superpowers/specs/2026-11-01-staging-platform-design.md): the operator and its CRDs, which other
# charts' monitors need, without Prometheus, Alertmanager or their exporters: staging does not prove them
kube-prometheus-stack:
  prometheus:
    enabled: false
  alertmanager:
    enabled: false
  defaultRules:
    create: false
  kubelet:
    enabled: false
  kubeApiServer:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false
  coreDns:
    enabled: false
  kubeStateMetrics:
    enabled: false
  nodeExporter:
    enabled: false
