# Testbed: three 3.5 GB VMs (docs/installation/testbed.md). Ceph keeps production's layout
# (three mons, an OSD on each node's rook-data partition, two replicas) with less memory: one mgr, an OSD memory
# limit of 1.25 GiB (Rook sets osd_memory_target from it, about 1 GiB). No CephFS (its MDS pair needs more than
# testbed has; production keeps it). No monitoring: the testbed runs no Prometheus
# No Kyverno on the testbed: its PolicyException kind does not exist
policyExceptions: false
rook-ceph:
  monitoring:
    enabled: false
rook-ceph-cluster:
  # Lighter than production where nothing on the testbed reads it (2026-11-26, docs/installation/testbed.md): settled,
  # Ceph took 0.9 of a core across the VMs. No dashboard, no device health (SMART on virtual disks), and the daemons'
  # liveness probes (each a Python ceph call, 0.1-0.3 s of CPU) every 30 s instead of 10. The metrics stay: the chart
  # does not render monitoring.metricsDisabled (docs/superpowers/deferred-minors.md)
  monitoring:
    enabled: false
    createPrometheusRules: false
  cephClusterSpec:
    dashboard:
      enabled: false
    cephConfig:
      mgr:
        mgr/devicehealth/enable_monitoring: "false"
    healthCheck:
      livenessProbe:
        mon:
          probe:
            periodSeconds: 30
        mgr:
          probe:
            periodSeconds: 30
        osd:
          probe:
            periodSeconds: 30
    mgr:
      count: 1
    resources:
      osd:
        limits:
          memory: "1280Mi"
        requests:
          cpu: "100m"
          memory: "512Mi"
  cephFileSystems: []
  cephFileSystemVolumeSnapshotClass:
    enabled: false
ceph-csi-drivers:
  drivers:
    cephfs:
      enabled: false
