# Testbed: three 3.5 GB VMs (docs/superpowers/specs/2026-10-31-testbed-design.md). Ceph keeps production's layout
# (three mons, an OSD on each node's rook-data partition, two replicas) with less memory: one mgr, an OSD memory
# limit of 1.25 GiB (Rook sets osd_memory_target from it, about 1 GiB). No CephFS (its MDS pair needs more than
# testbed has; production keeps it). No monitoring until Prometheus runs on testbed (step 12a-2)
rook-ceph:
  monitoring:
    enabled: false
rook-ceph-cluster:
  monitoring:
    enabled: false
    createPrometheusRules: false
  cephClusterSpec:
    mgr:
      count: 1
    resources:
      osd:
        limits:
          memory: "1280Mi"
        requests:
          cpu: "100m"
          memory: "512Mi"
  cephFileSystems: []
  cephFileSystemVolumeSnapshotClass:
    enabled: false
ceph-csi-drivers:
  drivers:
    cephfs:
      enabled: false
