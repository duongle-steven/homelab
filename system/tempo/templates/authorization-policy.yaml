# Under the mesh-wide deny-all (system/istio-system): who may call into this namespace
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow
  namespace: {{ .Release.Namespace }}
spec:
  action: ALLOW
  rules:
    # The gateway Collector's traces (OTLP gRPC)
    - from:
        - source:
            principals: ["cluster.local/ns/opentelemetry/sa/gateway-collector"]
      to:
        - operation:
            ports: ["4317"]
    # Grafana's Tempo data source
    - from:
        - source:
            principals: ["cluster.local/ns/grafana/sa/grafana"]
      to:
        - operation:
            ports: ["3200"]
    # Prometheus: Tempo's metrics
    - from:
        - source:
            principals: ["cluster.local/ns/monitoring-system/sa/monitoring-system-kube-pro-prometheus"]
      to:
        - operation:
            ports: ["3200"]
