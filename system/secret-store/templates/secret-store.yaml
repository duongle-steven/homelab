{{- /* Rendered whatever the cluster has: depending on External Secrets' CRDs (.Capabilities) left eight namespaces of
GitHub Actions' fresh sandboxes without one, never rendered again (PR #104) */}}
{{- if not (has .Release.Namespace .Values.exclude) }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    vault:
      server: {{ .Values.server }}
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: apps
          # OpenBao's roles accept only this audience
          serviceAccountRef:
            name: default
            audiences: [openbao]
{{- end }}
