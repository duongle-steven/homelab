# Under the mesh-wide deny-all (system/istio-system): who may call into this namespace
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow
  namespace: {{ .Release.Namespace }}
spec:
  action: ALLOW
  rules:
    # Pods in this namespace call each other freely (the data mover's pods and the sandbox's S3 server)
    - from:
        - source:
            namespaces: ["{{ .Release.Namespace }}"]
    # Prometheus: Velero's and the node agent's metrics
    - from:
        - source:
            principals: ["cluster.local/ns/monitoring-system/sa/monitoring-system-kube-pro-prometheus"]
      to:
        - operation:
            ports: ["8085"]
