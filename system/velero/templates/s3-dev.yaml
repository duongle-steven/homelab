{{- with .Values.devS3 }}
{{- if .enabled }}
# The sandbox's stand-in for R2: versitygw's posix backend, bucket velero a directory on its volume
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3
  namespace: {{ $.Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    template:
      data:
        ROOT_ACCESS_KEY: {{ .accessKey }}
        ROOT_SECRET_KEY: '{{ "{{ .secret }}" }}'
  data:
    - secretKey: secret
      remoteRef:
        key: {{ .secret.key }}
        property: {{ .secret.property }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3
  namespace: {{ $.Release.Namespace }}
  labels:
    # The backups themselves (docs/how-to-guides/backup-and-restore.md)
    homelab/backup: none
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bucket
          image: {{ .image }}
          command: [mkdir, -p, /data/velero]
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: s3
          image: {{ .image }}
          args: [--port, ":7070", posix, /data]
          envFrom:
            - secretRef:
                name: s3
          ports:
            - name: s3
              containerPort: 7070
          securityContext: *securityContext
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: s3
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: s3
  ports:
    - name: s3
      port: 7070
      targetPort: s3
{{- end }}
{{- end }}
