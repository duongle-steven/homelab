# The credentials file (with R2's endpoint, endpoint_url) and Kopia's repository password, from OpenTofu
# (infra/<env>/backup through infra-secrets); the sandbox's come from its generated S3 password (values-dev.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  {{- if .Values.devS3.enabled }}
  target:
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id = {{ .Values.devS3.accessKey }}
          aws_secret_access_key = {{ "{{ .secret }}" }}
          endpoint_url = http://s3.{{ .Release.Namespace }}:7070
  data:
    - secretKey: secret
      remoteRef:
        key: {{ .Values.devS3.secret.key }}
        property: {{ .Values.devS3.secret.property }}
  {{- else }}
  data:
    - secretKey: cloud
      remoteRef:
        key: {{ .Values.credentials.cloud.key }}
        property: {{ .Values.credentials.cloud.property }}
  {{- end }}
---
# Velero creates this Secret with a default password when it is missing: its pod mounts it (values.yaml) and waits
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  data:
    - secretKey: repository-password
      remoteRef:
        key: {{ .Values.credentials.password.key }}
        property: {{ .Values.credentials.password.property }}
