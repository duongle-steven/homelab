# Hourly local snapshots of the volumes labelled daily or manual, kept snapshotHours (files/snapshots.sh)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapshots
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero-snapshots
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero-snapshots
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velero-snapshots
subjects:
  - kind: ServiceAccount
    name: snapshots
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: snapshots
  namespace: {{ .Release.Namespace }}
data:
  snapshots.sh: |
{{ .Files.Get "files/snapshots.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: snapshots
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "0 * * * *"
  timeZone: {{ .Values.global.timezone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: snapshots
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshots
              image: {{ .Values.kubectlImage }}
              command: [sh, /scripts/snapshots.sh]
              env:
                - name: SNAPSHOT_HOURS
                  value: {{ .Values.snapshotHours | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: snapshots
