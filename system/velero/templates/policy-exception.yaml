# Pod Security restricted (system/kyverno) does not hold here: each exception says why in homelab/reason
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: node-agent
  namespace: {{ .Release.Namespace }}
  annotations:
    # Its CRD comes from system/kyverno, which may sync later (a fresh cluster): apply the rest and retry this
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    homelab/reason: "Velero's node agent reads every pod's volumes on its node as root"
spec:
  policyRefs:
    - {name: require-run-as-nonroot, kind: ValidatingPolicy}
    - {name: require-run-as-non-root-user, kind: ValidatingPolicy}
  matchConditions:
    - name: node-agent
      expression: "object.metadata.namespace == '{{ .Release.Namespace }}' && (object.metadata.name.startsWith('node-agent'))"
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: velero
  namespace: {{ .Release.Namespace }}
  annotations:
    # Its CRD comes from system/kyverno, which may sync later (a fresh cluster): apply the rest and retry this
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    homelab/reason: "velero's image runs as the non-numeric user cnb, so runAsNonRoot cannot be stated without guessing its uid: revisit; so do the Kopia repository maintenance Jobs Velero creates from it (<repository>-default-kopia-maintain-job-<n>)"
spec:
  policyRefs:
    - {name: require-run-as-nonroot, kind: ValidatingPolicy}
  matchConditions:
    - name: velero
      expression: "object.metadata.namespace == '{{ .Release.Namespace }}' && (object.metadata.name.startsWith('velero') || object.metadata.name.contains('-kopia-maintain-job-'))"
