cert-manager:
  crds:
    enabled: true
  webhook:
    # The API server (outside the mesh) calls it: keep it out of the mesh's strict mTLS
    podLabels:
      istio.io/dataplane-mode: none
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
issuer:
  # Sandbox only: issue certificates from a local CA instead of Let's Encrypt
  dev: false
trust-manager:
  enabled: false
  app:
    # The API server (outside the mesh) calls its webhook
    podLabels:
      istio.io/dataplane-mode: none
