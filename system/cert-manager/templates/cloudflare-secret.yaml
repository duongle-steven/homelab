{{- if not .Values.issuer.dev }}
# DNS-01 token for the production issuer (infra/production/cloudflare, through platform/infra-secrets)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: cloudflare-api-token
  data:
    - secretKey: api-token
      remoteRef:
        key: cert-manager/cloudflare
        property: api_token
{{- end }}
