apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  # Its CRD comes from another component that needs this one first (cert-manager, istio-system and
  # monitoring-system wait for each other's CRDs): apply the rest of the sync and retry this
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: wildcard-tls
  dnsNames:
    - "*.{{ .Values.domain }}"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
