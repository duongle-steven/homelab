apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-cni-watchdog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: istio-cni-watchdog
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: istio-cni-watchdog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: istio-cni-watchdog
subjects:
  - kind: ServiceAccount
    name: istio-cni-watchdog
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-cni-watchdog
data:
  cni-watchdog.sh: |
{{ .Files.Get "files/cni-watchdog.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: istio-cni-watchdog
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 50
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 50
      backoffLimit: 0
      ttlSecondsAfterFinished: 300
      template:
        spec:
          serviceAccountName: istio-cni-watchdog
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              image: {{ .Values.cniWatchdog.image }}
              command: [sh, /scripts/cni-watchdog.sh]
              env:
                - name: NOT_READY_SECONDS
                  value: {{ .Values.cniWatchdog.notReadySeconds | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: istio-cni-watchdog
