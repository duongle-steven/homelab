domain: khuedoan.com
gateway:
  # kube-vip serves the LAN Gateway's Service on its own VIP (metal/roles/k3s): Forgejo SSH keeps port 22
  # (node sshd owns it on the node IPs) and the address moves to another node when one fails
  loadBalancer:
    class: kube-vip.io/kube-vip-class
    ip: 192.168.1.224
# Sandbox only: pods resolve sandbox hostnames to the Gateway instead of their own loopback
corednsRewrite: false
istiod:
  pilot:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
