external-dns:
  provider:
    name: cloudflare
  # Routes attached to a Gateway; the DNS target comes from the Gateway (gateway: its kube-vip address,
  # public: the Cloudflare Tunnel)
  sources:
    - gateway-httproute
  # Never delete records (the previous chart default; the chart now requires it)
  policy: upsert-only
  txtOwnerId: homelab
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: value
  extraArgs:
    - --annotation-filter=external-dns.kubernetes.io/exclude notin (true)
  interval: 5m
  triggerLoopOnEvent: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
