# DNS token (infra/production/cloudflare, through platform/infra-secrets)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: cloudflare-api-token
  data:
    - secretKey: value
      remoteRef:
        key: external-dns/cloudflare
        property: api_token
