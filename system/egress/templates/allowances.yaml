{{- if not (has .Release.Namespace .Values.exclude) }}
{{- with index .Values.internet .Release.Namespace }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $.Values.private | nindent 14 }}
      ports:
        {{- include "egress.ports" . | indent 8 }}
{{- end }}
{{- with index .Values.nodes .Release.Namespace }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nodes
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ include "egress.nodeNetwork" $ }}
      ports:
        {{- include "egress.ports" . | indent 8 }}
{{- end }}
{{- end }}
