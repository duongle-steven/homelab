# The 12GB sandbox runs the suite beside the scans: one scan Job at a time, with limits
trivy-operator:
  # The limits below change Trivy's ConfigMap, so its hash too (values.yaml)
  podAnnotations:
    homelab/trivy-config: 7bc588f40af825e3
  operator:
    scanJobsConcurrentLimit: 1
  trivy:
    resources:
      requests:
        cpu: 100m
        memory: 200M
      limits:
        cpu: 500m
        memory: 750M
    server:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
