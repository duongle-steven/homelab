# The sandbox (more memory than a testbed VM): two scan Jobs at a time. One at a time scanned about 60 workloads in 90
# minutes, so the suite's TrivyOperator often waited past its window for a workload at the end of the queue (12b-2)
trivy-operator:
  # nodeImportedNamespaces, joined
  excludeNamespaces: backstage
  operator:
    scanJobsConcurrentLimit: 2

# Backstage runs homelab-backstage:dev, built by just dev and imported on the node (production pulls ghcr by digest)
nodeImportedNamespaces:
  - backstage
