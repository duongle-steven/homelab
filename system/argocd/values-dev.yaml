# Sandbox: sync an allowlist from GitHub instead of in-cluster Gitea.
# Helm replaces lists and anchors do not cross files, so generator and source are restated in full.
argo-cd:
  global:
    domain: argocd.127-0-0-1.nip.io
  configs:
    cm:
      oidc.config: |
        name: Kanidm
        issuer: https://dex.127-0-0-1.nip.io
        clientID: argocd
        clientSecret: $argocd-oidc:clientSecret
        requestedScopes:
          - openid
          - profile
          - email
          - groups
  server:
    httproute:
      hostnames:
        - argocd.127-0-0-1.nip.io
    # Trust the sandbox CA for calls to Dex
    env:
      - name: SSL_CERT_DIR
        value: /etc/ssl/certs:/etc/homelab-dev-ca
    volumes:
      - name: dev-ca
        configMap:
          name: homelab-dev-ca
          optional: true
    volumeMounts:
      - name: dev-ca
        mountPath: /etc/homelab-dev-ca
        readOnly: true
argocd-apps:
  applicationsets:
    root:
      generators:
        - git:
            repoURL: &repoURL https://github.com/duongle-steven/homelab
            revision: &revision dev
            directories:
              - path: system/argocd
              - path: system/gateway
              - path: system/cert-manager
              - path: system/monitoring-system
              - path: apps/excalidraw
              - path: apps/actualbudget
              - path: apps/homepage
              - path: apps/pairdrop
              - path: apps/speedtest
              - path: platform/external-secrets
              - path: platform/global-secrets
              - path: platform/kanidm
              - path: platform/dex
              - path: platform/grafana
              - path: platform/zot
              - path: platform/gitea
      template:
        spec:
          source:
            repoURL: *repoURL
            targetRevision: *revision
            helm:
              valueFiles:
                - values.yaml
                - values-dev.yaml
              ignoreMissingValueFiles: true
