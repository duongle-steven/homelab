# Sandbox: sync an allowlist from GitHub (the cluster Secret's repository and branch sandbox) instead of in-cluster Forgejo.
# Helm replaces lists and anchors do not cross files, so generator and source are restated in full.
argo-cd:
  server:
    # Trust the sandbox CA for calls to Kanidm
    env:
      - name: SSL_CERT_DIR
        value: /etc/ssl/certs:/etc/homelab-dev-ca
    volumes:
      - name: dev-ca
        configMap:
          name: homelab-dev-ca
          optional: true
    volumeMounts:
      - name: dev-ca
        mountPath: /etc/homelab-dev-ca
        readOnly: true
argocd-apps:
  applicationsets:
    root:
      generators:
        # The cluster Secret (system/argocd/values.yaml): just dev force-pushes the current commit to branch sandbox, so
        # a branch is tested before its merge; just dev --revision pins one commit there
        - matrix:
            generators:
              - clusters: &cluster
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: &repoURL '{{ .metadata.annotations.repository }}'
                        revision: &revision '{{ .metadata.annotations.revision }}'
                        directories:
                          - path: system/argocd-config
                          - path: system/istio-system
                          - path: system/cert-manager
                          - path: system/csi-hostpath
                          - path: platform/external-secrets
                          - path: platform/openbao
                          - path: platform/generated-secrets
                          - path: platform/infra-secrets
                          - path: platform/kanidm
                    - git: &config
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: infra/sandbox/cluster/config.json
                        pathParamPrefix: config
        # One generator per group of test/scopes.yaml (deployGroups), deployed when the cluster Secret carries
        # homelab/group-<name>, which the bootstrap writes for the groups just dev chose (lab test scope --groups);
        # the sandbox is always at stage all (system/argocd/values.yaml)
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-backstage: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        directories:
                          - path: platform/backstage
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-backup: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        directories:
                          - path: system/velero
                          - path: platform/secrets-rotation
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-ci: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        directories:
                          - path: platform/zot
                          - path: platform/argo-workflows
                          - path: platform/argo-events
                          - path: platform/ci
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-delivery: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        directories:
                          - path: system/argo-rollouts
                          - path: platform/kargo
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-git: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        directories:
                          - path: platform/cloudnative-pg
                          - path: platform/forgejo
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-metrics: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        directories:
                          - path: system/monitoring-system
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-observability: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        directories:
                          - path: system/loki
                          - path: system/tempo
                          - path: system/opentelemetry
                          - path: system/kiali
                          - path: platform/grafana
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-policy: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        directories:
                          - path: system/kyverno
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-security: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        directories:
                          - path: system/trivy-operator
                          - path: system/falco
                          - path: system/public-scan
                    - git: *config
      template:
        spec:
          # A fresh sandbox syncs while the CRDs and webhooks its apps wait for appear: retry soon, so an app follows
          # within 4 minutes of what it waited for (production's 16-minute backoff idled a fresh build for minutes);
          # 18 tries span about an hour, longer than a build on a slow link (merged into values.yaml's syncPolicy)
          syncPolicy: &retry
            retry:
              limit: 18
              backoff:
                duration: 30s
                factor: 2
                maxDuration: 4m
          sources:
            - repoURL: *repoURL
              path: '{{ .path.path }}'
              targetRevision: *revision
              helm:
                # CRDs come from system/crds, applied by the bootstrap first (scripts/vendor-crds)
                skipCrds: true
                # values-local.yaml: what testbed and the sandbox share (the local CA, the tests' fixtures)
                valueFiles:
                  - values.yaml
                  - values-local.yaml
                  - values-dev.yaml
                ignoreMissingValueFiles: true
                valuesObject: &values
                  global:
                    baseDomain: '{{ .domain }}'
                    timezone: '{{ .timezone }}'
                    seedRepository: '{{ .seed_repository }}'
                    # Empty in the sandbox: Velero's location keeps values-dev.yaml's endpoint
                    backupS3Url: '{{ .metadata.annotations.backupS3Url }}'
                    # The repository and revision this Application syncs (the cluster Secret's): what Backstage's catalog reads (not
                    # global.repository: external-secrets' chart reads that as its image registry)
                    gitRepository: '{{ .metadata.annotations.repository }}'
                    gitRevision: '{{ .metadata.annotations.revision }}'
                    addresses: &addresses
                      apiVIP: '{{ .vip }}'
                      router: '{{ .network.gateway }}'
                      prefixLength: '{{ .network.prefix_length }}'
                      gatewayVIP: '{{ .service_vips.gateway }}'
                      wireguardVIP: '{{ .service_vips.wireguard }}'
            # Default-deny egress for the Application's namespace
            - &egress
              repoURL: *repoURL
              path: system/egress
              targetRevision: *revision
              helm:
                valuesObject: *values
            # The namespace's SecretStore openbao (its branch of OpenBao)
            - &secretStore
              repoURL: *repoURL
              path: system/secret-store
              targetRevision: *revision
              helm:
                valuesObject: *values
    apps:
      generators:
        # The core's app (test/scopes.yaml core): the specs' sample workload, at stage all like every app
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: apps/excalidraw.yaml
                    - git: *config
        # Every other app is a group's (test/scopes.yaml deployGroups): deployed when the cluster Secret carries its label
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-actualbudget: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: apps/actualbudget.yaml
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-delivery: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: test/fixtures/apps/delivery-test.yaml
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-blog: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: apps/blog.yaml
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-homepage: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: apps/homepage.yaml
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-matrix: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: apps/matrix.yaml
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-ntfy: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: apps/ntfy.yaml
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-opencloud: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: apps/opencloud.yaml
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-pairdrop: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: apps/pairdrop.yaml
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-paperless: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: apps/paperless.yaml
                    - git: *config
        - matrix:
            generators:
              - clusters:
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
                      homelab/group-speedtest: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: apps/speedtest.yaml
                    - git: *config
      template:
        spec:
          syncPolicy: *retry
          sources:
            - repoURL: https://bjw-s-labs.github.io/helm-charts
              chart: app-template
              targetRevision: 5.3.0
              helm:
                releaseName: '{{ .path.filename | trimSuffix ".yaml" }}'
                valueFiles:
                  - '$values/{{ .path.path }}/{{ .path.filename }}'
                  # Our apps on the app road: the version Kargo promoted (docs/how-to-guides/app-delivery.md); missing
                  # before the first promotion, and for every other app (its releases source is this repository)
                  - '$releases/{{ .path.filename }}'
                ignoreMissingValueFiles: true
                parameters:
                  # No Cloudflare Tunnel in the sandbox: public apps use the LAN Gateway
                  - name: global.publicGateway
                    value: gateway
                  # App files trust the sandbox CA ConfigMap homelab-dev-ca when set
                  - name: global.devCA
                    value: "true"
                valuesObject:
                  global:
                    baseDomain: '{{ .domain }}'
                    timezone: '{{ .timezone }}'
                    seedRepository: '{{ .seed_repository }}'
                    addresses: *addresses
            - repoURL: *repoURL
              targetRevision: *revision
              ref: values
            # ops/releases on Forgejo for the apps in the list (the templatePatch's too), this repository for the rest
            - repoURL: '{{ if has (.path.filename | trimSuffix ".yaml") (list "blog" "delivery-test") }}http://forgejo-http.forgejo:3000/ops/releases{{ else }}{{ .metadata.annotations.repository }}{{ end }}'
              targetRevision: '{{ if has (.path.filename | trimSuffix ".yaml") (list "blog" "delivery-test") }}main{{ else }}{{ .metadata.annotations.revision }}{{ end }}'
              ref: releases
            - *egress
            - *secretStore
