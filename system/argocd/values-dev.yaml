# Sandbox: sync an allowlist from GitHub instead of in-cluster Forgejo.
# Helm replaces lists and anchors do not cross files, so generator and source are restated in full.
argo-cd:
  server:
    # Trust the sandbox CA for calls to Kanidm
    env:
      - name: SSL_CERT_DIR
        value: /etc/ssl/certs:/etc/homelab-dev-ca
    volumes:
      - name: dev-ca
        configMap:
          name: homelab-dev-ca
          optional: true
    volumeMounts:
      - name: dev-ca
        mountPath: /etc/homelab-dev-ca
        readOnly: true
argocd-apps:
  applicationsets:
    root:
      generators:
        - matrix:
            generators:
              - git:
                  repoURL: &repoURL https://github.com/duongle-steven/homelab
                  # make dev force-pushes the current commit here, so a branch is tested before its merge
                  revision: &revision sandbox
                  directories:
                    - path: system/argocd-config
                    - path: system/istio-system
                    - path: system/csi-hostpath
                    - path: system/velero
                    - path: system/cert-manager
                    - path: system/monitoring-system
                    - path: system/loki
                    - path: system/kiali
                    - path: system/kyverno
                    - path: system/trivy-operator
                    - path: platform/external-secrets
                    - path: platform/openbao
                    - path: platform/generated-secrets
                    - path: platform/infra-secrets
                    - path: platform/kanidm
                    - path: platform/grafana
                    - path: platform/zot
                    - path: platform/cloudnative-pg
                    - path: platform/forgejo
                    - path: platform/woodpecker
                    - path: platform/secrets-rotation
              - git: &config
                  repoURL: *repoURL
                  revision: *revision
                  files:
                    - path: infra/sandbox/cluster/config.json
                  pathParamPrefix: config
      template:
        spec:
          # A fresh sandbox syncs while the CRDs and webhooks its apps wait for appear: retry soon, so an app follows
          # within 4 minutes of what it waited for (production's 16-minute backoff idled a fresh build for minutes);
          # 18 tries span about an hour, longer than a build on a slow link (merged into values.yaml's syncPolicy)
          syncPolicy: &retry
            retry:
              limit: 18
              backoff:
                duration: 30s
                factor: 2
                maxDuration: 4m
          sources:
            - repoURL: *repoURL
              path: '{{ .path.path }}'
              targetRevision: *revision
              helm:
                valueFiles:
                  - values.yaml
                  - values-dev.yaml
                ignoreMissingValueFiles: true
                valuesObject: &values
                  global:
                    baseDomain: '{{ .domain }}'
                    timezone: '{{ .timezone }}'
                    seedRepository: '{{ .seed_repository }}'
                    addresses: &addresses
                      apiVIP: '{{ .vip }}'
                      router: '{{ .network.gateway }}'
                      prefixLength: '{{ .network.prefix_length }}'
                      gatewayVIP: '{{ .service_vips.gateway }}'
                      wireguardVIP: '{{ .service_vips.wireguard }}'
            # Default-deny egress for the Application's namespace
            - &egress
              repoURL: *repoURL
              path: system/egress
              targetRevision: *revision
              helm:
                valuesObject: *values
            # The namespace's SecretStore openbao (its branch of OpenBao)
            - &secretStore
              repoURL: *repoURL
              path: system/secret-store
              targetRevision: *revision
              helm:
                valuesObject: *values
    apps:
      generators:
        - matrix:
            generators:
              - git:
                  repoURL: *repoURL
                  revision: *revision
                  files:
                    - path: apps/actualbudget.yaml
                    - path: apps/excalidraw.yaml
                    - path: apps/homepage.yaml
                    - path: apps/ntfy.yaml
                    # paperless and opencloud are optional here: added by the bootstrap when make dev asks
                    # (infra/_modules/argocd/set-sandbox-apps.sh)
                    - path: apps/pairdrop.yaml
                    - path: apps/speedtest.yaml
              - git: *config
      template:
        spec:
          syncPolicy: *retry
          sources:
            - repoURL: https://bjw-s-labs.github.io/helm-charts
              chart: app-template
              targetRevision: 5.3.0
              helm:
                releaseName: '{{ .path.filename | trimSuffix ".yaml" }}'
                valueFiles:
                  - '$values/apps/{{ .path.filename }}'
                parameters:
                  # No Cloudflare Tunnel in the sandbox: public apps use the LAN Gateway
                  - name: global.publicGateway
                    value: gateway
                  # App files trust the sandbox CA ConfigMap homelab-dev-ca when set
                  - name: global.devCA
                    value: "true"
                valuesObject:
                  global:
                    baseDomain: '{{ .domain }}'
                    timezone: '{{ .timezone }}'
                    seedRepository: '{{ .seed_repository }}'
                    addresses: *addresses
            - repoURL: *repoURL
              targetRevision: *revision
              ref: values
            - *egress
            - *secretStore
