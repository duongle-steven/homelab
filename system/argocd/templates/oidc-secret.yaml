# Argo CD replaces $argocd-oidc:<key> in oidc.config (values.yaml) with this Secret's values; it reads only Secrets
# labelled part-of argocd. The chart does not template argocd-cm, so the issuer's host comes from here.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-oidc
  labels:
    app.kubernetes.io/part-of: argocd
stringData:
  issuer: https://auth.{{ .Values.global.baseDomain }}/oauth2/openid/argocd
