argo-cd:
  configs:
    params:
      server.insecure: true
      controller.diff.server.side: true
    cm:
      resource.ignoreResourceUpdatesEnabled: true
      resource.customizations.ignoreResourceUpdates.all: |
        jsonPointers:
          - /status
      # istiod patches its validating webhooks (CA bundle, failure policy once it is ready)
      resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
        jqPathExpressions:
          - .webhooks[]?.clientConfig.caBundle
          - .webhooks[]?.failurePolicy
      # Needed for the editor role; also lets admins open a terminal in the UI
      exec.enabled: "true"
      # The chart templates url (only): from global.baseDomain
      url: https://argocd.{{ .Values.global.baseDomain }}
      # $argocd-oidc:issuer comes from templates/oidc-secret.yaml (the chart does not template this)
      oidc.config: |
        name: Kanidm
        issuer: $argocd-oidc:issuer
        clientID: argocd
        clientSecret: $argocd-kanidm-oauth2-credentials:CLIENT_SECRET
        enablePKCEAuthentication: true
        requestedScopes:
          - openid
          - profile
          - email
          - groups
    rbac:
      # No access unless a group grants it
      policy.default: ''
      scopes: '[homelab_groups]'
      policy.csv: |
        p, role:editor, applications, get, */*, allow
        p, role:editor, applications, sync, */*, allow
        p, role:editor, applications, action/*, */*, allow
        p, role:editor, logs, get, */*, allow
        # Exec only into workloads under apps/: platform pods hold cluster-wide credentials
        p, role:editor, exec, create, default/actualbudget, allow
        p, role:editor, exec, create, default/blog, allow
        p, role:editor, exec, create, default/excalidraw, allow
        p, role:editor, exec, create, default/homepage, allow
        p, role:editor, exec, create, default/jellyfin, allow
        p, role:editor, exec, create, default/matrix, allow
        p, role:editor, exec, create, default/ntfy, allow
        p, role:editor, exec, create, default/opencloud, allow
        p, role:editor, exec, create, default/pairdrop, allow
        p, role:editor, exec, create, default/paperless, allow
        p, role:editor, exec, create, default/speedtest, allow
        p, role:editor, exec, create, default/tailscale, allow
        p, role:editor, exec, create, default/wireguard, allow
        p, role:editor, projects, get, *, allow
        p, role:editor, clusters, get, *, allow
        p, role:editor, repositories, get, *, allow
        g, homelab-admins, role:admin
        g, homelab-editors, role:editor
        g, homelab-users, role:readonly
  server:
    # templates/httproute.yaml: the chart's route does not template its host names
    httproute:
      enabled: false
    # The metrics Services; their ServiceMonitors are in system/argocd-config (the bootstrap renders this chart before
    # monitoring's CRDs exist, so the chart's own would never be applied)
    metrics: &metrics
      enabled: true
      serviceMonitor:
        enabled: false
  dex:
    enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    metrics: *metrics
    # Docker Hub instead of the chart's ecr-public.aws.com mirror, which GitHub Actions runners failed to pull from
    # (twice, a whole run each); the tag is the one argo-cd 10.10.3 ships and tests
    image:
      repository: docker.io/library/redis
      tag: 8.6.4-alpine
    # The metrics Service and ServiceMonitor scrape this sidecar (without it the target has no endpoints)
    exporter:
      enabled: true
      image:
        repository: ghcr.io/oliver006/redis_exporter
        tag: v1.94.0
argocd-apps:
  applicationsets:
    root:
      namespace: argocd
      # lab backup restore pauses one Application's automated sync while it replaces a volume: without this the
      # ApplicationSet puts it back within seconds
      ignoreApplicationDifferences:
        - jsonPointers: [/spec/syncPolicy/automated]
      # A directory leaving root deletes its Application but keeps its resources (delete them by hand): when Argo CD
      # stopped managing itself (step 10b), root dropped Application argocd before the bootstrap could release its
      # resources finalizer, and Argo CD deleted part of itself
      syncPolicy:
        preserveResourcesOnDeletion: true
      goTemplate: true
      goTemplateOptions:
        - missingkey=error
      generators:
        # The cluster Secret the bootstrap writes (infra/_modules/argocd/cluster-secret.sh: the repository, the
        # revision, the backup endpoint), crossed with every component and the environment's addresses
        # (infra/<env>/cluster/config.json, upstream's format; OpenTofu reads the same file in step 7). Its annotations
        # are read with dot access: with missingkey=error a missing one fails instead of rendering empty. An
        # ApplicationSet whose generator matches nothing deletes every Application: rename the label in three releases
        # (infra/_modules/argocd/bootstrap.sh)
        - matrix:
            generators:
              - clusters: &cluster
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
              - matrix:
                  generators:
                    - git:
                        repoURL: &repoURL '{{ .metadata.annotations.repository }}'
                        revision: &revision '{{ .metadata.annotations.revision }}'
                        directories:
                          - path: system/*
                          # Applied by infra/_modules/argocd: Argo CD does not manage itself
                          - path: system/argocd
                            exclude: true
                          # Rendered into every namespace by each Application (template below), not on its own
                          - path: system/egress
                            exclude: true
                          - path: system/secret-store
                            exclude: true
                          # The sandbox's storage (Ceph in production)
                          - path: system/csi-hostpath
                            exclude: true
                          - path: platform/*
                          # Behind the stage (the generator below)
                          - path: system/public-scan
                            exclude: true
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: infra/production/cluster/config.json
                        # Its own .path would replace the directory's
                        pathParamPrefix: config
        # The public scan, whose targets are apps, only at stage all (the cluster Secret's homelab/stage, step 12b-2): a new
        # cluster's first deploy may stop at the platform. The apps themselves come from the apps ApplicationSet, gated the
        # same way; no app is a chart any more, so root lists no apps/* directory
        - matrix:
            generators:
              - clusters: &appsCluster
                  selector:
                    matchLabels:
                      homelab/bootstrap: "true"
                      homelab/stage: all
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        directories:
                          - path: system/public-scan
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: infra/production/cluster/config.json
                        pathParamPrefix: config
      template:
        metadata:
          name: '{{ .path.basename }}'
        spec:
          destination:
            name: in-cluster
            namespace: '{{ .path.basename }}'
          project: default  # TODO
          sources:
            - repoURL: *repoURL
              path: '{{ .path.path }}'
              targetRevision: *revision
              helm:
                # scripts/env-values resolves these offline for scripts/render-chart
                valuesObject: &values
                  global:
                    baseDomain: '{{ .domain }}'
                    timezone: '{{ .timezone }}'
                    seedRepository: '{{ .seed_repository }}'
                    # Production's R2 endpoint, which holds the account id (never in git); empty elsewhere
                    backupS3Url: '{{ .metadata.annotations.backupS3Url }}'
                    addresses: &addresses
                      apiVIP: '{{ .vip }}'
                      router: '{{ .network.gateway }}'
                      prefixLength: '{{ .network.prefix_length }}'
                      gatewayVIP: '{{ .service_vips.gateway }}'
                      wireguardVIP: '{{ .service_vips.wireguard }}'
            # Default-deny egress for the Application's namespace
            - &egress
              repoURL: *repoURL
              path: system/egress
              targetRevision: *revision
              helm:
                valuesObject: *values
            # The namespace's SecretStore openbao (its branch of OpenBao)
            - &secretStore
              repoURL: *repoURL
              path: system/secret-store
              targetRevision: *revision
              helm:
                valuesObject: *values
          syncPolicy: &syncPolicy
            automated:
              prune: true
              selfHeal: true
            retry:
              limit: 10
              backoff:
                duration: 1m
                factor: 2
                maxDuration: 16m
            syncOptions:
              - CreateNamespace=true
              - ApplyOutOfSyncOnly=true
              - ServerSideApply=true
              # Keep the ignored webhook fields when a sync applies the rest
              - RespectIgnoreDifferences=true
            managedNamespaceMetadata:
              labels:
                # Every namespace joins Istio's ambient mesh (system/istio-system); exceptions: templatePatch below
                istio.io/dataplane-mode: ambient
                # Pod Security Admission, the second layer under Kyverno (system/kyverno): baseline everywhere; the
                # namespaces whose pods need the node (PolicyExceptions there) are privileged: templatePatch below
                pod-security.kubernetes.io/enforce: baseline
      # The mesh itself and Ceph (some host-network pods, its own encryption) stay out of the mesh; keep in step with
      # OUTSIDE in scripts/check-mesh-policies and test/mesh_test.go
      # Privileged under Pod Security Admission: the mesh's CNI and ztunnel, Ceph's OSDs, Alloy, node-exporter, Falco
      # and the sandbox's CSI driver (their PolicyExceptions say why); keep in step with test/policy_test.go
      templatePatch: |
        {{- if has .path.basename (list "istio-system" "rook-ceph") }}
        spec:
          syncPolicy:
            managedNamespaceMetadata:
              labels:
                istio.io/dataplane-mode: none
                pod-security.kubernetes.io/enforce: privileged
        {{- else if has .path.basename (list "loki" "monitoring-system" "csi-hostpath" "falco") }}
        spec:
          syncPolicy:
            managedNamespaceMetadata:
              labels:
                istio.io/dataplane-mode: ambient
                pod-security.kubernetes.io/enforce: privileged
        {{- else if eq .path.basename "velero" }}
        # Every new cluster starts read-only and paused (system/velero); lab backup enable switches these two fields,
        # which syncs then keep
        spec:
          ignoreDifferences:
            - group: velero.io
              kind: BackupStorageLocation
              jsonPointers: [/spec/accessMode]
            - group: velero.io
              kind: Schedule
              jsonPointers: [/spec/paused]
        {{- else if eq .path.basename "ci" }}
        # Argo Workflows' minified CRDs leave a WorkflowTemplate's .spec untyped, so server-side apply owns it whole:
        # the server-side diff then saw no change to the golden path's template and nothing was applied (the sandbox);
        # the client-side diff sees it, and the sync's forced apply replaces .spec
        metadata:
          annotations:
            argocd.argoproj.io/compare-options: ServerSideDiff=false
        {{- else if eq .path.basename "argocd-config" }}
        # Argo CD's own resources (its Kanidm client, its repository credential) live in its namespace
        spec:
          destination:
            namespace: argocd
        {{- end }}
    # One Application per app-template values file apps/<name>.yaml
    apps:
      namespace: argocd
      # The VPN routers need NET_ADMIN: privileged under Pod Security Admission (their PolicyExceptions say why)
      templatePatch: |
        {{- if has (.path.filename | trimSuffix ".yaml") (list "tailscale" "wireguard") }}
        spec:
          syncPolicy:
            managedNamespaceMetadata:
              labels:
                istio.io/dataplane-mode: ambient
                pod-security.kubernetes.io/enforce: privileged
        {{- end }}
      # lab backup restore pauses one Application's automated sync while it replaces a volume: without this the
      # ApplicationSet puts it back within seconds
      ignoreApplicationDifferences:
        - jsonPointers: [/spec/syncPolicy/automated]
      goTemplate: true
      goTemplateOptions:
        - missingkey=error
      generators:
        - matrix:
            generators:
              - clusters: *appsCluster
              - matrix:
                  generators:
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: apps/*.yaml
                    - git:
                        repoURL: *repoURL
                        revision: *revision
                        files:
                          - path: infra/production/cluster/config.json
                        pathParamPrefix: config
      template:
        metadata:
          name: '{{ .path.filename | trimSuffix ".yaml" }}'
        spec:
          destination:
            name: in-cluster
            namespace: '{{ .path.filename | trimSuffix ".yaml" }}'
          project: default  # TODO
          sources:
            - repoURL: https://bjw-s-labs.github.io/helm-charts
              chart: app-template
              targetRevision: 5.3.0
              helm:
                releaseName: '{{ .path.filename | trimSuffix ".yaml" }}'
                valueFiles:
                  - '$values/apps/{{ .path.filename }}'
                # App files template hosts as <app>.{{ .Values.global.baseDomain }}; public apps attach to
                # the Gateway named by global.publicGateway
                parameters:
                  - name: global.publicGateway
                    value: public
                  - name: global.devCA
                    value: ""
                valuesObject:
                  global:
                    baseDomain: '{{ .domain }}'
                    timezone: '{{ .timezone }}'
                    seedRepository: '{{ .seed_repository }}'
                    addresses: *addresses
            - repoURL: *repoURL
              targetRevision: *revision
              ref: values
            - *egress
            - *secretStore
          syncPolicy: *syncPolicy
