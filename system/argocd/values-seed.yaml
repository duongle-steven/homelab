# Production's first install, until Argo CD reads ops/homelab on Forgejo (infra/_modules/argocd/choose-values.sh): no
# Prometheus CRDs yet, so no metrics or ServiceMonitors. The repository comes from the cluster Secret, as in values.yaml.
argo-cd:
  server:
    metrics: &metrics
      enabled: false
      serviceMonitor:
        enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    metrics: *metrics
