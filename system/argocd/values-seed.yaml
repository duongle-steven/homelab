argo-cd:
  server:
    metrics: &metrics
      enabled: false
      serviceMonitor:
        enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    metrics: *metrics
argocd-apps:
  applicationsets:
    root:
      # Helm replaces lists: the matrix with the environment's addresses is restated (system/argocd/values.yaml)
      generators:
        - matrix:
            generators:
              - git:
                  # The seed repository (config.json's seed_repository): infra/_modules/argocd replaces this placeholder when it
                  # renders the seed, and fails if any is left
                  repoURL: &repoURL https://seed-repository.invalid
                  revision: &revision master
                  directories:
                    - path: system/*
                    - path: system/egress
                      exclude: true
                    # Rendered into every namespace by each Application (template below), not on its own
                    - path: system/secret-store
                      exclude: true
                    - path: platform/*
                    - path: apps/*
              - git: &config
                  repoURL: *repoURL
                  revision: *revision
                  files:
                    - path: infra/production/cluster/config.json
                  pathParamPrefix: config
      template:
        spec:
          sources:
            - repoURL: *repoURL
              path: '{{ .path.path }}'
              targetRevision: *revision
              helm:
                valuesObject: &values
                  global:
                    baseDomain: '{{ .domain }}'
                    timezone: '{{ .timezone }}'
                    seedRepository: '{{ .seed_repository }}'
                    addresses: &addresses
                      apiVIP: '{{ .vip }}'
                      router: '{{ .network.gateway }}'
                      prefixLength: '{{ .network.prefix_length }}'
                      gatewayVIP: '{{ .service_vips.gateway }}'
                      wireguardVIP: '{{ .service_vips.wireguard }}'
            - &egress
              repoURL: *repoURL
              path: system/egress
              targetRevision: *revision
              helm:
                valuesObject: *values
            # The namespace's SecretStore openbao (its branch of OpenBao)
            - &secretStore
              repoURL: *repoURL
              path: system/secret-store
              targetRevision: *revision
              helm:
                valuesObject: *values
    apps:
      generators:
        - matrix:
            generators:
              - git:
                  repoURL: *repoURL
                  revision: *revision
                  files:
                    - path: apps/*.yaml
              - git: *config
      template:
        spec:
          sources:
            - repoURL: https://bjw-s-labs.github.io/helm-charts
              chart: app-template
              targetRevision: 5.3.0
              helm:
                releaseName: '{{ .path.filename | trimSuffix ".yaml" }}'
                valueFiles:
                  - '$values/apps/{{ .path.filename }}'
                parameters:
                  - name: global.publicGateway
                    value: public
                  - name: global.devCA
                    value: ""
                valuesObject:
                  global:
                    baseDomain: '{{ .domain }}'
                    timezone: '{{ .timezone }}'
                    seedRepository: '{{ .seed_repository }}'
                    addresses: *addresses
            - repoURL: *repoURL
              targetRevision: *revision
              ref: values
            - *egress
            - *secretStore
