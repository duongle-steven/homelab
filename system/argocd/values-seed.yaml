argo-cd:
  server:
    metrics: &metrics
      enabled: false
      serviceMonitor:
        enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    metrics: *metrics
argocd-apps:
  applicationsets:
    root:
      generators:
        - git:
            repoURL: &repoURL https://github.com/khuedoan/homelab
            revision: &revision master
            directories:
              - path: system/*
              - path: platform/*
              - path: apps/*
      template:
        spec:
          source:
            repoURL: *repoURL
            targetRevision: *revision
    apps:
      generators:
        - git:
            repoURL: *repoURL
            revision: *revision
            files:
              - path: apps/*.yaml
      template:
        spec:
          sources:
            - repoURL: https://bjw-s-labs.github.io/helm-charts
              chart: app-template
              targetRevision: 5.3.0
              helm:
                releaseName: '{{ .path.filename | trimSuffix ".yaml" }}'
                valueFiles:
                  - '$values/apps/{{ .path.filename }}'
                parameters:
                  - name: global.domain
                    value: khuedoan.com
                  - name: global.publicGateway
                    value: homelab-public
                  - name: global.devCA
                    value: ""
            - repoURL: *repoURL
              targetRevision: *revision
              ref: values
