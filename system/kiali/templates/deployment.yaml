apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiali
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kiali
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kiali
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiali
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: kiali
      containers:
        - name: kiali
          image: {{ .Values.image }}
          command: [/opt/kiali/kiali, -config, /kiali-configuration/config.yaml]
          {{- if .Values.devCA }}
          env:
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/homelab-dev-ca
          {{- end }}
          ports:
            - name: http
              containerPort: 20001
            - name: http-metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /kiali/healthz
              port: http
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /kiali/healthz
              port: http
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /kiali/healthz
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /kiali-configuration
            # oidc-secret: kaniop's alias of the client secret (templates/kanidm-client.yaml)
            - name: client
              mountPath: /kiali-secret
            - name: signing-key
              mountPath: /kiali-override-secrets/login-token-signing-key
              readOnly: true
            {{- if .Values.devCA }}
            - name: dev-ca
              mountPath: /etc/homelab-dev-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: kiali
        - name: client
          secret:
            secretName: kiali-kanidm-oauth2-credentials
            items:
              - key: oidc-secret
                path: oidc-secret
        - name: signing-key
          secret:
            secretName: kiali-signing-key
            items:
              - key: key
                path: value.txt
        {{- if .Values.devCA }}
        # Not optional: the pod waits until trust-manager has copied the CA here
        - name: dev-ca
          configMap:
            name: homelab-dev-ca
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kiali
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kiali
spec:
  selector:
    app.kubernetes.io/name: kiali
  ports:
    - name: http
      port: 20001
      targetPort: http
    - name: http-metrics
      port: 9090
      targetPort: http-metrics
