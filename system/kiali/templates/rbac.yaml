# Read-only (kiali-server 2.33.0's viewer role without OpenShift's rules, port-forwards only in istio-system): view_only_mode, and no role that writes
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiali
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kiali-viewer
rules:
  - apiGroups: [""]
    resources: [configmaps, namespaces, pods, pods/log, replicationcontrollers, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.istio.io, security.istio.io, extensions.istio.io, telemetry.istio.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, grpcroutes, httproutes, referencegrants, tcproutes, tlsroutes, udproutes]
    verbs: [get, list, watch]
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiali-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kiali-viewer
subjects:
  - kind: ServiceAccount
    name: kiali
    namespace: {{ .Release.Namespace }}
---
# Envoy's and ztunnel's config dumps, read through a port-forward: only in istio-system (the Gateways, ztunnel), since
# a port-forward reaches a pod past every AuthorizationPolicy and NetworkPolicy
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kiali-portforward
  namespace: istio-system
rules:
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kiali-portforward
  namespace: istio-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kiali-portforward
subjects:
  - kind: ServiceAccount
    name: kiali
    namespace: {{ .Release.Namespace }}
