apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
spec:
  gatewayClassName: cilium
  {{- with .Values.addresses.homelab }}
  addresses:
    - type: IPAddress
      value: {{ . }}
  {{- end }}
  listeners:
    # Only the HTTPS redirect (templates/https-redirect.yaml)
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.{{ .Values.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: homelab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    # Forgejo SSH
    - name: ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
        kinds:
          - kind: TCPRoute
---
# Published through the Cloudflare Tunnel: external-dns points public hosts at the tunnel,
# and cloudflared forwards to this Gateway only
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-public
  annotations:
    external-dns.kubernetes.io/target: homelab-tunnel.{{ .Values.domain }}
spec:
  gatewayClassName: cilium
  {{- with index .Values.addresses "homelab-public" }}
  addresses:
    - type: IPAddress
      value: {{ . }}
  {{- end }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.{{ .Values.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: homelab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
