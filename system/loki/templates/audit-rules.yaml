# Loki's alert rules (files/*-rules.yaml), mounted for tenant fake (auth_enabled false) at /etc/loki/rules/fake
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-audit-rules
  namespace: {{ .Release.Namespace }}
data:
  audit-rules.yaml: |
{{ .Files.Get "files/audit-rules.yaml" | indent 4 }}
  public-scan-rules.yaml: |
{{ .Files.Get "files/public-scan-rules.yaml" | indent 4 }}
