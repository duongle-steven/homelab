# Logs: Loki stores them (single binary, filesystem on its PVC, 30 days); Alloy (DaemonSet) reads every pod's log on its
# node and the cluster's events. Grafana's data source: http://loki.loki:3100
loki:
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2026-10-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 720h
      # The audit logs (job audit/k3s and audit/openbao: docs/how-to-guides/security-logs.md) are kept 60 days: 90 would
      # not fit the 10Gi volume. The sandbox idling (2026-10-29): about 520MiB a day of audit lines, 370MiB of the rest,
      # compressed at least 5.7 times (measured), so about 5.4GiB for 60 days of audit and 1.9GiB for 30 days of the
      # rest on one node: 7.3GiB of 10Gi.
      # If they outgrow the volume, shorten this (45, then 30 days), never the volume
      # (docs/superpowers/specs/2026-10-28-security-logs-design.md)
      retention_stream:
        - selector: '{job=~"audit/.*"}'
          priority: 1
          period: 1440h
      # A query may span everything kept: the default 721h would refuse a search of the audit logs' 60 days
      max_query_length: 1441h
    # Alerts from the audit logs (templates/audit-rules.yaml), sent to Alertmanager
    rulerConfig:
      storage:
        type: local
        local:
          directory: /etc/loki/rules
      rule_path: /var/loki/rules-temp
      alertmanager_url: http://monitoring-system-kube-pro-alertmanager.monitoring-system:9093
      enable_api: true
      wal:
        dir: /var/loki/ruler-wal
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
  singleBinary:
    replicas: 1
    extraVolumes:
      - name: audit-rules
        configMap:
          name: loki-audit-rules
    extraVolumeMounts:
      - name: audit-rules
        mountPath: /etc/loki/rules/fake
        readOnly: true
    persistence:
      size: 10Gi
      # Not backed up: logs are not worth their space off-site (docs/how-to-guides/backup-and-restore.md)
      labels:
        homelab/backup: none
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  # Built for large clusters: an nginx in front of the components, synthetic log checks, memcached caches (gigabytes of
  # memory), bundled object storage, a helm test pod
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  minio:
    enabled: false
  test:
    enabled: false
  # Loads rules from ConfigMaps and Secrets of every namespace: no ruler here
  sidecar:
    rules:
      enabled: false
  monitoring:
    serviceMonitor:
      enabled: true
alloy:
  # The chart's PodLogs CRD is for a mode not used here
  crds:
    create: false
  controller:
    type: daemonset
    volumes:
      extra:
        # Every container's log on this node (containerd; /var/log/containers only links here)
        - name: pod-logs
          hostPath:
            path: /var/log/pods
        # The API server's audit log on server nodes (metal/roles/k3s/files/audit-policy.yaml); agents have none
        - name: audit-logs
          hostPath:
            path: /var/log/kubernetes/audit
            type: DirectoryOrCreate
        # Positions and the write-ahead log (loki.write's wal) survive a restart of the pod
        - name: storage
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
  alloy:
    enableReporting: false
    # loki.write's write-ahead log is experimental in Alloy v1.20
    stabilityLevel: experimental
    storagePath: /var/lib/alloy
    clustering:
      enabled: true
    # The log files belong to root; the mount is read-only
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
    mounts:
      extra:
        - name: pod-logs
          mountPath: /var/log/pods
          readOnly: true
        - name: audit-logs
          mountPath: /var/log/kubernetes/audit
          readOnly: true
        - name: storage
          mountPath: /var/lib/alloy
    configMap:
      content: |
        // This node's pods (K8S_NODE_NAME, set by the chart), one target per container
        discovery.kubernetes "pods" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
          }
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          // app.kubernetes.io/name, else app
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
            separator     = ";"
            regex         = "^;*([^;]+).*$"
            target_label  = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
          rule {
            replacement  = "pods"
            target_label = "job"
          }
          // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            replacement   = "/var/log/pods/*$1/*.log"
            target_label  = "__path__"
          }
        }

        local.file_match "pods" {
          path_targets = discovery.relabel.pods.output
        }

        loki.source.file "pods" {
          targets    = local.file_match.pods.targets
          forward_to = [loki.process.pods.receiver]
        }

        // containerd's CRI format: time, stream, flags, line
        loki.process "pods" {
          stage.cri {}
          // OpenBao's audit device (platform/openbao) writes JSON requests and responses to its stdout
          stage.match {
            selector = "{namespace=\"openbao\", container=\"openbao\"} |~ \"^\\\\{.*\\\"type\\\":\\\"(request|response)\\\"\""
            stage.static_labels {
              values = {job = "audit/openbao"}
            }
          }
          forward_to = [loki.write.loki.receiver]
        }

        // The API server's audit log (JSON lines, one event each), rotated by the server: followed by name
        local.file_match "audit" {
          path_targets = [{
            "__path__" = "/var/log/kubernetes/audit/audit.log",
            "job"      = "audit/k3s",
            "node"     = sys.env("K8S_NODE_NAME"),
          }]
        }

        loki.source.file "audit" {
          targets    = local.file_match.audit.targets
          forward_to = [loki.write.loki.receiver]
        }

        // Every namespace's events, from one Alloy instance of the cluster (clustering)
        loki.source.kubernetes_events "events" {
          job_name   = "kubernetes-events"
          log_format = "logfmt"
          clustering {
            enabled = true
          }
          forward_to = [loki.write.loki.receiver]
        }

        // Lines go to the write-ahead log on the host first, so a Loki outage or an Alloy restart loses none
        // (segments older than a day are dropped)
        loki.write "loki" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
          wal {
            enabled         = true
            max_segment_age = "24h"
          }
        }
  # Read only what the config uses (the chart's default also reads every Secret)
  rbac:
    rules:
      - apiGroups: [""]
        resources: ["pods", "namespaces"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["get", "list", "watch"]
    clusterRules:
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["get", "list", "watch"]
  serviceMonitor:
    enabled: true
