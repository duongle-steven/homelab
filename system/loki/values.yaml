# Logs: Loki stores them (single binary, filesystem on its PVC, 30 days); the OpenTelemetry Collectors
# (system/opentelemetry) send every pod's log, the audit logs and the cluster's events over OTLP. Grafana's data source:
# http://loki.loki:3100
loki:
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2026-10-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 720h
      # The OpenTelemetry agent's catch-up after a restart or an outage (requests of 1000 lines, about 1.6MB): Loki's
      # defaults (4MB/s, bursts of 6MB) refused it and its backlog grew (the sandbox, 2026-11-15)
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      # The audit logs (service_name k3s-audit and openbao-audit: docs/how-to-guides/security-logs.md) are kept 60 days: 90 would
      # not fit the 10Gi volume. The sandbox idling (2026-10-29): about 520MiB a day of audit lines, 370MiB of the rest,
      # compressed at least 5.7 times (measured), so about 5.4GiB for 60 days of audit and 1.9GiB for 30 days of the
      # rest on one node: 7.3GiB of 10Gi.
      # If they outgrow the volume, shorten this (45, then 30 days), never the volume
      # (docs/superpowers/specs/2026-10-28-security-logs-design.md)
      retention_stream:
        - selector: '{service_name=~"k3s-audit|openbao-audit"}'
          priority: 1
          period: 1440h
      # Logs arrive over OTLP from the OpenTelemetry Collectors (system/opentelemetry): Loki's default resource
      # attributes become the index labels (service.name, k8s.namespace.name, k8s.pod.name, k8s.container.name, the
      # workload's name, ...), every other attribute structured metadata
      otlp_config:
        resource_attributes:
          ignore_defaults: false
      # A query may span everything kept: the default 721h would refuse a search of the audit logs' 60 days
      max_query_length: 1441h
    # Alerts from the audit logs (templates/audit-rules.yaml), sent to Alertmanager
    rulerConfig:
      storage:
        type: local
        local:
          directory: /etc/loki/rules
      rule_path: /var/loki/rules-temp
      alertmanager_url: http://monitoring-system-kube-pro-alertmanager.monitoring-system:9093
      enable_api: true
      wal:
        dir: /var/loki/ruler-wal
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
  singleBinary:
    replicas: 1
    extraVolumes:
      - name: audit-rules
        configMap:
          name: loki-audit-rules
    extraVolumeMounts:
      - name: audit-rules
        mountPath: /etc/loki/rules/fake
        readOnly: true
    persistence:
      size: 10Gi
      # Not backed up: logs are not worth their space off-site (docs/how-to-guides/backup-and-restore.md)
      labels:
        homelab/backup: none
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  # Built for large clusters: an nginx in front of the components, synthetic log checks, memcached caches (gigabytes of
  # memory), bundled object storage, a helm test pod
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  minio:
    enabled: false
  test:
    enabled: false
  # Loads rules from ConfigMaps and Secrets of every namespace: no ruler here
  sidecar:
    rules:
      enabled: false
  monitoring:
    serviceMonitor:
      enabled: true
