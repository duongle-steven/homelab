# Logs: Loki stores them (single binary, filesystem on its PVC, 30 days); Alloy (DaemonSet) reads every pod's log on its
# node and the cluster's events. Grafana's data source: http://loki.loki:3100
loki:
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2026-10-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 720h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
  singleBinary:
    replicas: 1
    persistence:
      size: 10Gi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  # Built for large clusters: an nginx in front of the components, synthetic log checks, memcached caches (gigabytes of
  # memory), bundled object storage, a helm test pod
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  minio:
    enabled: false
  test:
    enabled: false
  # Loads rules from ConfigMaps and Secrets of every namespace: no ruler here
  sidecar:
    rules:
      enabled: false
  monitoring:
    serviceMonitor:
      enabled: true
