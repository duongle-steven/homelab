{{- if .Values.policyExceptions }}
# Pod Security restricted (system/kyverno) does not hold here: each exception says why in homelab/reason
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: falco
  namespace: {{ .Release.Namespace }}
  annotations:
    # Its CRD comes from system/kyverno, which may sync later (a fresh cluster): apply the rest and retry this
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    homelab/reason: "Falco loads its eBPF probe into the node's kernel and reads every process through the host's /proc, /sys, /etc and the container runtime's sockets (hostPath): a privileged container as root"
spec:
  policyRefs:
    - {name: disallow-privileged-containers, kind: ValidatingPolicy}
    - {name: disallow-host-path, kind: ValidatingPolicy}
    - {name: disallow-privilege-escalation, kind: ValidatingPolicy}
    - {name: require-run-as-nonroot, kind: ValidatingPolicy}
    - {name: restrict-seccomp-strict, kind: ValidatingPolicy}
    - {name: restrict-volume-types, kind: ValidatingPolicy}
  matchConditions:
    - name: falco
      expression: "object.metadata.namespace == '{{ .Release.Namespace }}' && (object.metadata.name == 'falco' || object.metadata.name.startsWith('falco-'))"
{{- end }}
