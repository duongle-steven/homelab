# Argo CD's local account backstage (system/argocd's accounts.backstage: login, role readonly): its password from
# OpenBao, bcrypted into argocd-secret, which the bootstrap creates (Merge adds the key, leaving the rest to it).
# Backstage's Argo CD plugin signs in with the same password (platform/generated-secrets' argocd.backstage-password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-backstage-account
  namespace: argocd
  annotations:
    # A fresh install may sync this before its CRD exists: Argo CD applies the rest and retries this
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # bcrypt salts each run anew: write only when this changes (lab secrets rotate annotates it), not every refresh
  refreshPolicy: OnChange
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        accounts.backstage.password: {{` "{{ .password | bcrypt }}" `}}
  data:
    - secretKey: password
      remoteRef:
        key: argocd/generated/backstage-password
        property: password
