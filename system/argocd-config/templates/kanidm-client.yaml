{{- /* Rendered whatever the cluster has: depending on the CRD (.Capabilities) left a fresh install's argocd-config
empty yet Synced, never rendered again (#104's GitHub Actions sandboxes: no Kanidm client for Argo CD) */}}
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: argocd
  # Argo CD's namespace (the root ApplicationSet deploys this chart there too)
  namespace: argocd
  annotations:
    # A fresh install may sync this before its CRD exists: Argo CD applies the rest and retries this
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  displayname: Argo CD
  origin: https://argocd.{{ .Values.global.baseDomain }}
  redirectUrl:
    - https://argocd.{{ .Values.global.baseDomain }}/auth/callback
  disableConsentPrompt: true
  preferShortUsername: true
  strictRedirectUrl: true
  # Short, domain-free group names for the RBAC policy
  claimMap:
    - name: homelab_groups
      joinStrategy: array
      valuesMap:
        {{- range list "homelab-admins" "homelab-editors" "homelab-users" }}
        - group: {{ . }}
          values:
            - {{ . }}
        {{- end }}
  scopeMap:
    {{- range list "homelab-admins" "homelab-editors" "homelab-users" }}
    - group: {{ . }}
      scopes: [openid, profile, email, groups]
    {{- end }}
  secretTemplate:
    labels:
      # Argo CD only resolves $secret:key references in Secrets with this label
      app.kubernetes.io/part-of: argocd
