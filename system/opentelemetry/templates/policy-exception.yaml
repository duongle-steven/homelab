# Pod Security restricted (system/kyverno) does not hold here: each exception says why in homelab/reason
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: agent
  namespace: {{ .Release.Namespace }}
  annotations:
    homelab/reason: "The agent reads every pod's log files and the API server's audit log on its node (/var/log/pods, /var/log/kubernetes/audit: hostPath), which root owns, and keeps its positions and queue in /var/lib/otelcol (hostPath); every capability dropped"
spec:
  policyRefs:
    - {name: disallow-host-path, kind: ValidatingPolicy}
    - {name: require-run-as-nonroot, kind: ValidatingPolicy}
    - {name: require-run-as-non-root-user, kind: ValidatingPolicy}
    - {name: restrict-volume-types, kind: ValidatingPolicy}
  matchConditions:
    - name: agent
      expression: "object.metadata.namespace == '{{ .Release.Namespace }}' && object.metadata.name.startsWith('agent-collector')"
