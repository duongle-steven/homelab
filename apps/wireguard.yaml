controllers:
  wireguard:
    # A router: ambient would send the VPN clients' forwarded TCP to ztunnel, and strict mTLS refuses it
    pod:
      labels:
        istio.io/dataplane-mode: none
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/wireguard
          tag: 1.0.20260223
        env:
          LOG_CONFS: false
          USE_COREDNS: true
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
service:
  wireguard:
    controller: wireguard
    type: LoadBalancer
    # Its own kube-vip address (metal/inventories/prod.yml), like the LAN Gateway
    loadBalancerClass: kube-vip.io/kube-vip-class
    annotations:
      kube-vip.io/loadbalancerIPs: 192.168.1.225
    ports:
      http:
        port: 51820
        protocol: UDP
persistence:
  config:
    type: secret
    name: "{{ .Release.Name }}-secret"
    globalMounts:
      - path: /config/wg_confs
externalSecrets:
  secret:
    forceRename: wireguard-secret
    secretStoreRef:
      kind: ClusterSecretStore
      name: global-secrets
    data:
      - secretKey: WIREGUARD_PRIVATE_KEY
        remoteRef:
          key: external
          property: wireguard-private-key
    target:
      deletionPolicy: Retain
      template:
        data:
          wg0.conf: |
            [Interface]
            Address = 172.16.0.1/32
            ListenPort = 51820
            PrivateKey = {{ .WIREGUARD_PRIVATE_KEY }}
            PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth+ -j MASQUERADE
            PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth+ -j MASQUERADE

            # Note that WireGuard will ignore a peer whose public key matches
            # the interface's private key. So you can distribute a single
            # list of peers everywhere.
            # https://lists.zx2c4.com/pipermail/wireguard/2018-December/003703.html

            # Servers

            [Peer]
            # homelab
            PublicKey = sSAZS1Z3vB7Wx8e2yVqXfeHjgWTa80wnSYoma3mZkiU=
            AllowedIPs = 172.16.0.1/32, 192.168.1.100/32, 192.168.1.224/27

            [Peer]
            # horus
            PublicKey = zVwYqwvGn/IL7o6CD84y4/Y/OnRAUl/jw6T7DtNqWGM=
            Endpoint = horus.khuedoan.com:51820
            PersistentKeepalive = 25
            AllowedIPs = 172.16.0.2/32

            # Clients

            [Peer]
            # khuedoan-ryzentower
            PublicKey = qnDY23ZWUOlCRUmB8anpXH1uzX0A17F1YtQJmVi7GWM=
            AllowedIPs = 172.16.0.10/32

            [Peer]
            # khuedoan-thinkpadz13
            PublicKey = hSVWn2lBasJeueHApQYmYR0s2zNpXrqZX6F8gyEqpy0=
            AllowedIPs = 172.16.0.11/32

            [Peer]
            # khuedoan-phone
            PublicKey = nITHFdgTkNZOTWeSWqnGXjgwlCJMKRCnnUsjMx2yp2U=
            AllowedIPs = 172.16.0.12/32
rawResources:
  # Outside the mesh (a router): only its tunnel port
  network-policy:
    forceRename: wireguard
    manifest:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: wireguard
        policyTypes:
          - Ingress
        ingress:
          - ports:
              - protocol: UDP
                port: 51820
