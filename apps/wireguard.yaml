controllers:
  wireguard:
    # A router: ambient would send the VPN clients' forwarded TCP to ztunnel, and strict mTLS refuses it
    pod:
      labels:
        istio.io/dataplane-mode: none
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/wireguard
          tag: 1.0.20260223
        env:
          LOG_CONFS: false
          USE_COREDNS: true
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
service:
  wireguard:
    controller: wireguard
    type: LoadBalancer
    # Its own kube-vip address (global.addresses.wireguardVIP, from infra/<env>/cluster/config.json), like the LAN Gateway
    loadBalancerClass: kube-vip.io/kube-vip-class
    annotations:
      kube-vip.io/loadbalancerIPs: '{{ with .Values.global.addresses.wireguardVIP }}{{ . }}{{ end }}'
    ports:
      http:
        port: 51820
        protocol: UDP
persistence:
  config:
    type: secret
    name: "{{ .Release.Name }}-secret"
    globalMounts:
      - path: /config/wg_confs
externalSecrets:
  secret:
    forceRename: wireguard-secret
    # secret/wireguard/private-key in OpenBao (property private-key), written by OpenTofu (infra/<env>/secrets, through platform/infra-secrets)
    secretStoreRef:
      kind: SecretStore
      name: openbao
    data:
      - secretKey: WIREGUARD_PRIVATE_KEY
        remoteRef:
          key: wireguard/private-key
          property: private-key
    target:
      deletionPolicy: Retain
      template:
        data:
          wg0.conf: |
            [Interface]
            Address = 172.16.0.1/32
            ListenPort = 51820
            PrivateKey = {{ .WIREGUARD_PRIVATE_KEY }}
            PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth+ -j MASQUERADE
            PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth+ -j MASQUERADE

            # Note that WireGuard will ignore a peer whose public key matches
            # the interface's private key. So you can distribute a single
            # list of peers everywhere.
            # https://lists.zx2c4.com/pipermail/wireguard/2018-December/003703.html

            # Servers

            # PLACEHOLDER keys (random, nobody holds their private key): replace each PublicKey before the first
            # deploy. The server's: `terragrunt output -raw wireguard_public_key` in infra/production/secrets;
            # a device's: `wg genkey | tee private.key | wg pubkey` on that device. Keep the tunnel addresses.
            # Clients add the API and Gateway VIPs (infra/<env>/cluster/config.json) to this peer's AllowedIPs
            # themselves (docs/getting-started/vpn-setup.md); this template cannot read Helm values
            [Peer]
            # homelab (this server)
            PublicKey = qVzEirdt8tkK9vdXGAJDtJ+iAu6mwhhrCH+DiKvM9G0=
            AllowedIPs = 172.16.0.1/32

            # Clients

            [Peer]
            # PLACEHOLDER: desktop
            PublicKey = pnAcvrnzkrKymV/1uXZs1+JN8BYKVSiQ2X/X6G39fGE=
            AllowedIPs = 172.16.0.10/32

            [Peer]
            # PLACEHOLDER: laptop
            PublicKey = ntH7MHBvBJn7+Zfk35FPw5rhiubhzI0VPu0XM/ZveSI=
            AllowedIPs = 172.16.0.11/32

            [Peer]
            # PLACEHOLDER: phone
            PublicKey = 5LG5Tp5CCSyi9/3IlRuQaH61SOrVnWbWHABDsCenpDk=
            AllowedIPs = 172.16.0.12/32
rawResources:
  # Outside the mesh (a router): only its tunnel port
  network-policy:
    forceRename: wireguard
    manifest:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: wireguard
        policyTypes:
          - Ingress
        ingress:
          - ports:
              - protocol: UDP
                port: 51820
