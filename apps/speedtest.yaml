controllers:
  main:
    containers:
      main:
        image:
          repository: docker.io/openspeedtest/latest
          tag: v2.0.6
service:
  main:
    ports:
      http:
        port: 3000
        protocol: HTTP
route:
  main:
    hostnames:
      - speedtest.{{ .Values.global.domain }}
    parentRefs:
      - name: gateway
        namespace: istio-system
        sectionName: https
rawResources:
  # Under the mesh-wide deny-all (system/istio-system): who may call into this namespace
  authorization-policy:
    forceRename: allow
    manifest:
      apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      spec:
        action: ALLOW
        rules:
          # Pods in this namespace call each other freely
          - from:
              - source:
                  namespaces: ['{{ .Release.Namespace }}']
          # the LAN Gateway
          - from:
              - source:
                  principals: ['cluster.local/ns/istio-system/sa/gateway-istio']
            to:
              - operation:
                  ports: ["3000"]
