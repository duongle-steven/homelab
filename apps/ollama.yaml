controllers:
  main:
    containers:
      main:
        image:
          repository: docker.io/ollama/ollama
          tag: 0.40.3
  ui:
    containers:
      main:
        image:
          repository: ghcr.io/open-webui/open-webui
          tag: v0.12.0
        env:
          OLLAMA_BASE_URL: http://ollama:11434
service:
  main:
    # Two controllers: name the one this Service selects
    controller: main
    # The UI calls http://ollama:11434
    forceRename: ollama
    ports:
      http:
        port: 11434
        protocol: HTTP
  ui:
    controller: ui
    ports:
      http:
        port: 8080
        protocol: HTTP
route:
  main:
    hostnames:
      - ollama.{{ .Values.global.domain }}
    parentRefs: &parentRefs
      - name: gateway
        namespace: istio-system
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: http
  ai:
    hostnames:
      - ai.{{ .Values.global.domain }}
    parentRefs: *parentRefs
    rules:
      - backendRefs:
          - identifier: ui
            port: http
persistence:
  data:
    # Keep the PVC name ollama-data
    suffix: data
    accessMode: ReadWriteOnce
    size: 10Gi
    advancedMounts:
      main:
        main:
          - path: /root/.ollama
rawResources:
  # Under the mesh-wide deny-all (system/istio-system): who may call into this namespace
  authorization-policy:
    forceRename: allow
    manifest:
      apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      spec:
        action: ALLOW
        rules:
          # Pods in this namespace call each other freely
          - from:
              - source:
                  namespaces: ['{{ .Release.Namespace }}']
          # the LAN Gateway
          - from:
              - source:
                  principals: ['cluster.local/ns/istio-system/sa/gateway-istio']
            to:
              - operation:
                  ports: ["11434", "8080"]
