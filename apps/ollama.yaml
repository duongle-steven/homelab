# Pod Security restricted (system/kyverno): RuntimeDefault seccomp, no privilege escalation
defaultPodOptions:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
controllers:
  main:
    defaultContainerOptionsStrategy: merge
    defaultContainerOptions:
      securityContext:
        allowPrivilegeEscalation: false
    containers:
      main:
        image:
          repository: docker.io/ollama/ollama
          tag: 0.40.3
  ui:
    defaultContainerOptionsStrategy: merge
    defaultContainerOptions:
      securityContext:
        allowPrivilegeEscalation: false
    containers:
      main:
        image:
          repository: ghcr.io/open-webui/open-webui
          tag: v0.12.0
        env:
          OLLAMA_BASE_URL: http://ollama:11434
service:
  main:
    # Two controllers: name the one this Service selects
    controller: main
    # The UI calls http://ollama:11434
    forceRename: ollama
    ports:
      http:
        port: 11434
        protocol: HTTP
  ui:
    controller: ui
    ports:
      http:
        port: 8080
        protocol: HTTP
route:
  main:
    hostnames:
      - ollama.{{ .Values.global.baseDomain }}
    parentRefs: &parentRefs
      - name: gateway
        namespace: istio-system
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: http
  ai:
    hostnames:
      - ai.{{ .Values.global.baseDomain }}
    parentRefs: *parentRefs
    rules:
      - backendRefs:
          - identifier: ui
            port: http
persistence:
  data:
    # Not backed up: models are downloaded again (docs/how-to-guides/backup-and-restore.md)
    labels:
      homelab/backup: none
    # Keep the PVC name ollama-data
    suffix: data
    accessMode: ReadWriteOnce
    size: 10Gi
    advancedMounts:
      main:
        main:
          - path: /root/.ollama
rawResources:
  # Under the mesh-wide deny-all (system/istio-system): who may call into this namespace
  authorization-policy:
    forceRename: allow
    manifest:
      apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      spec:
        action: ALLOW
        rules:
          # Pods in this namespace call each other freely
          - from:
              - source:
                  namespaces: ['{{ .Release.Namespace }}']
          # the LAN Gateway
          - from:
              - source:
                  principals: ['cluster.local/ns/istio-system/sa/gateway-istio']
            to:
              - operation:
                  ports: ["11434", "8080"]
  # Pod Security restricted (system/kyverno) does not hold for this image: why, in homelab/reason
  policy-exception:
    forceRename: pod-security
    manifest:
      apiVersion: policies.kyverno.io/v1
      kind: PolicyException
      metadata:
        annotations:
          homelab/reason: "ollama and open-webui run as root (open-webui's USER 0:0); production only: revisit in 12b"
      spec:
        policyRefs:
          - {name: require-run-as-nonroot, kind: ValidatingPolicy}
        matchConditions:
          - name: ollama
            expression: "object.metadata.name.startsWith('ollama')"
