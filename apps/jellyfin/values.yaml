app-template:
  defaultPodOptions:
    securityContext:
      fsGroup: 1000
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/jellyfin/jellyfin
            tag: 10.11.11
        transmission:
          image:
            repository: lscr.io/linuxserver/transmission
            tag: 4.1.3
        prowlarr:
          image:
            repository: lscr.io/linuxserver/prowlarr
            tag: 2.6.5.5623-ls163
        radarr:
          image:
            repository: lscr.io/linuxserver/radarr
            tag: 6.4.4.10685-ls320
        sonarr:
          image:
            repository: lscr.io/linuxserver/sonarr
            tag: 4.0.20.3014-ls328
        # Seerr, the successor of Jellyseerr
        jellyseerr:
          image:
            repository: ghcr.io/seerr-team/seerr
            tag: v3.5.0
  service:
    main:
      ports:
        http:
          port: 8096
          protocol: HTTP
        transmission:
          port: 9091
          protocol: HTTP
        prowlarr:
          port: 9696
          protocol: HTTP
        radarr:
          port: 7878
          protocol: HTTP
        sonarr:
          port: 8989
          protocol: HTTP
        jellyseerr:
          port: 5055
          protocol: HTTP
  # One route per host: a route's hostnames apply to all its rules
  route:
    main:
      hostnames:
        - jellyfin.khuedoan.com
      parentRefs: &parentRefs
        - name: homelab
          namespace: gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: main
              port: http
    transmission:
      hostnames:
        - transmission.khuedoan.com
      parentRefs: *parentRefs
      rules:
        - backendRefs:
            - identifier: main
              port: transmission
    prowlarr:
      hostnames:
        - prowlarr.khuedoan.com
      parentRefs: *parentRefs
      rules:
        - backendRefs:
            - identifier: main
              port: prowlarr
    radarr:
      hostnames:
        - radarr.khuedoan.com
      parentRefs: *parentRefs
      rules:
        - backendRefs:
            - identifier: main
              port: radarr
    sonarr:
      hostnames:
        - sonarr.khuedoan.com
      parentRefs: *parentRefs
      rules:
        - backendRefs:
            - identifier: main
              port: sonarr
    jellyseerr:
      hostnames:
        - jellyseerr.khuedoan.com
      parentRefs: *parentRefs
      rules:
        - backendRefs:
            - identifier: main
              port: jellyseerr
  persistence:
    data:
      # Keep the PVC name jellyfin-data
      suffix: data
      accessMode: ReadWriteOnce
      size: 50Gi
      advancedMounts:
        main:
          main:
            - path: /config
              subPath: jellyfin/config
            - path: /media/movies
              subPath: movies
            - path: /media/shows
              subPath: shows
          transmission:
            - path: /config
              subPath: transmission/config
            - path: /downloads
              subPath: transmission/downloads
          prowlarr:
            - path: /config
              subPath: prowlarr/config
          radarr:
            - path: /config
              subPath: radarr/config
            - path: /downloads/complete
              subPath: transmission/downloads/complete
            - path: /movies
              subPath: movies
          sonarr:
            - path: /config
              subPath: sonarr/config
            - path: /downloads/complete
              subPath: transmission/downloads/complete
            - path: /shows
              subPath: shows
          jellyseerr:
            - path: /app/config
              subPath: jellyseerr/config
