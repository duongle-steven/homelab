controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/paperless-ngx/paperless-ngx
          tag: 3.3.1
        env:
          PAPERLESS_PORT: 8000
          PAPERLESS_ADMIN_USER: admin
          PAPERLESS_URL: https://paperless.{{ .Values.global.domain }}
          # Kanidm login; the provider id kanidm sets the callback path
          PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
          # Expanded into PAPERLESS_SOCIALACCOUNT_PROVIDERS (env renders alphabetically, so it comes first)
          CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: paperless-kanidm-oauth2-credentials
                key: CLIENT_SECRET
          PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
            {"openid_connect": {"OAUTH_PKCE_ENABLED": true, "SCOPE": ["openid", "profile", "email", "groups"],
            "APPS": [{"provider_id": "kanidm", "name": "Kanidm", "client_id": "paperless",
            "secret": "$(CLIENT_SECRET)",
            "settings": {"server_url": "https://auth.{{ .Values.global.domain }}/oauth2/openid/paperless"}}]}}
          # Members of homelab-documents get an account on first login; homelab-admins become superusers
          PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
          PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
          PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS_CLAIM: homelab_groups
          PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP: homelab-admins
          # The sandbox CA (global.devCA); empty in production
          REQUESTS_CA_BUNDLE: '{{ if .Values.global.devCA }}/etc/homelab-dev-ca/ca.crt{{ end }}'
        envFrom:
          - secret: "{{ .Release.Name }}-secret"
      redis:
        image:
          repository: docker.io/library/redis
          tag: 8.10.2
service:
  main:
    ports:
      http:
        port: 8000
        protocol: HTTP
route:
  main:
    hostnames:
      - paperless.{{ .Values.global.domain }}
    parentRefs:
      - name: homelab
        namespace: gateway
        sectionName: https
persistence:
  data:
    # Keep the PVC name paperless-data
    suffix: data
    accessMode: ReadWriteOnce
    size: 10Gi
    advancedMounts:
      main:
        main:
          - path: /usr/src/paperless/data
            subPath: data
          - path: /usr/src/paperless/media
            subPath: media
  dev-ca:
    # The sandbox CA from trust-manager; absent in production, so the volume is optional
    type: custom
    volumeSpec:
      configMap:
        name: homelab-dev-ca
        optional: true
    advancedMounts:
      main:
        main:
          - path: /etc/homelab-dev-ca
            readOnly: true
externalSecrets:
  secret:
    forceRename: paperless-secret
    secretStoreRef:
      kind: ClusterSecretStore
      name: global-secrets
    dataFrom:
      - extract:
          key: paperless.admin
    target:
      deletionPolicy: Retain
rawResources:
  kanidm-client:
    forceRename: paperless
    manifest:
      apiVersion: kaniop.rs/v1beta1
      kind: KanidmOAuth2Client
      spec:
        kanidmRef:
          name: kanidm
          namespace: kanidm
        displayname: Paperless
        origin: 'https://paperless.{{ .Values.global.domain }}'
        redirectUrl:
          - 'https://paperless.{{ .Values.global.domain }}/accounts/oidc/kanidm/login/callback/'
        disableConsentPrompt: true
        preferShortUsername: true
        strictRedirectUrl: true
        claimMap:
          - name: homelab_groups
            joinStrategy: array
            valuesMap:
              - group: homelab-admins
                values: [homelab-admins]
              - group: homelab-documents
                values: [homelab-documents]
        scopeMap:
          - group: homelab-documents
            scopes: [openid, profile, email, groups]
