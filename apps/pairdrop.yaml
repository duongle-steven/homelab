# Pod Security restricted (system/kyverno): RuntimeDefault seccomp, no privilege escalation
defaultPodOptions:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
controllers:
  main:
    defaultContainerOptionsStrategy: merge
    defaultContainerOptions:
      securityContext:
        allowPrivilegeEscalation: false
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/pairdrop
          tag: 1.11.2
service:
  main:
    ports:
      http:
        port: 3000
        protocol: HTTP
route:
  main:
    hostnames:
      - drop.{{ .Values.global.baseDomain }}
    parentRefs:
      - name: gateway
        namespace: istio-system
        sectionName: https
rawResources:
  # Under the mesh-wide deny-all (system/istio-system): who may call into this namespace
  authorization-policy:
    forceRename: allow
    manifest:
      apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      spec:
        action: ALLOW
        rules:
          # Pods in this namespace call each other freely
          - from:
              - source:
                  namespaces: ['{{ .Release.Namespace }}']
          # the LAN Gateway
          - from:
              - source:
                  principals: ['cluster.local/ns/istio-system/sa/gateway-istio']
            to:
              - operation:
                  ports: ["3000"]
  # Pod Security restricted (system/kyverno) does not hold for this image: why, in homelab/reason
  policy-exception:
    forceRename: pod-security
    manifest:
      apiVersion: policies.kyverno.io/v1
      kind: PolicyException
      metadata:
        annotations:
          homelab/reason: "linuxserver's pairdrop runs as root (s6-overlay drops to PUID); production only: revisit in 12b"
      spec:
        policyRefs:
          - {name: require-run-as-nonroot, kind: ValidatingPolicy}
        matchConditions:
          - name: pairdrop
            expression: "object.metadata.name.startsWith('pairdrop')"
