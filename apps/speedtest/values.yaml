app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/openspeedtest/latest
            tag: latest
  service:
    main:
      ports:
        http:
          port: 3000
          protocol: HTTP
  route:
    main:
      hostnames:
        - speedtest.khuedoan.com
      parentRefs:
        - name: homelab
          namespace: gateway
          sectionName: https
