# Pod Security restricted (system/kyverno): RuntimeDefault seccomp, no privilege escalation
defaultPodOptions:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
controllers:
  main:
    defaultContainerOptionsStrategy: merge
    defaultContainerOptions:
      securityContext:
        allowPrivilegeEscalation: false
    containers:
      main:
        image:
          repository: registry.{{ .Values.global.baseDomain }}/blog
          tag: latest
service:
  main:
    ports:
      http:
        port: 3000
        protocol: HTTP
route:
  main:
    annotations:
      external-dns.kubernetes.io/cloudflare-proxied: "true"
    hostnames:
      - www.{{ .Values.global.baseDomain }}
    parentRefs:
      - name: '{{ .Values.global.publicGateway }}'
        namespace: istio-system
        sectionName: https
rawResources:
  # Under the mesh-wide deny-all (system/istio-system): who may call into this namespace
  authorization-policy:
    forceRename: allow
    manifest:
      apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      spec:
        action: ALLOW
        rules:
          # Pods in this namespace call each other freely
          - from:
              - source:
                  namespaces: ['{{ .Release.Namespace }}']
          # the Gateway named by global.publicGateway (public in production, gateway in the sandbox)
          - from:
              - source:
                  principals: ['cluster.local/ns/istio-system/sa/{{ .Values.global.publicGateway }}-istio']
            to:
              - operation:
                  ports: ["3000"]
  # Pod Security restricted (system/kyverno) does not hold for this image: why, in homelab/reason
  policy-exception:
    forceRename: pod-security
    manifest:
      apiVersion: policies.kyverno.io/v1
      kind: PolicyException
      metadata:
        annotations:
          # Its CRD comes from system/kyverno, which may sync later (a fresh cluster): apply the rest and retry this
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
          homelab/reason: "the blog's image is built as root by its own pipeline, which is not written yet; its tag is latest until that pipeline tags releases"
      spec:
        policyRefs:
          - {name: require-run-as-nonroot, kind: ValidatingPolicy}
          - {name: require-pinned-images, kind: ValidatingPolicy}
        matchConditions:
          - name: blog
            expression: "object.metadata.namespace == 'blog' && object.metadata.name.startsWith('blog')"
