controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/gethomepage/homepage
          tag: v2.5.0
        env:
          # Required since v1: requests for other hosts are refused
          HOMEPAGE_ALLOWED_HOSTS: home.{{ .Values.global.domain }}
service:
  main:
    ports:
      http:
        port: 3000
        protocol: HTTP
route:
  main:
    hostnames:
      - home.{{ .Values.global.domain }}
    parentRefs:
      - name: gateway
        namespace: istio-system
        sectionName: https
persistence:
  config:
    enabled: true
    type: configMap
    identifier: config
    globalMounts:
      - path: /app/config/settings.yaml
        subPath: settings.yaml
      - path: /app/config/widgets.yaml
        subPath: widgets.yaml
      - path: /app/config/services.yaml
        subPath: services.yaml
      - path: /app/config/bookmarks.yaml
        subPath: bookmarks.yaml
configMaps:
  config:
    enabled: true
    data:
      settings.yaml: |
        background: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
        cardBlur: md
        theme: dark
        headerStyle: boxed
        hideVersion: true
      widgets.yaml: |
        - search:
            provider: google
            target: _blank
      services.yaml: |
        - Popular:
          - Matrix:
              href: https://chat.{{ .Values.global.domain }}
              description: Chat client
              icon: element.svg
          - Jellyfin:
              href: https://jellyfin.{{ .Values.global.domain }}
              description: Media system (movies, music, etc.)
              icon: jellyfin.svg
          - Jellyseerr:
              href: https://jellyseerr.{{ .Values.global.domain }}
              description: Request media
              icon: jellyseerr.svg
          - Paperless:
              href: https://paperless.{{ .Values.global.domain }}
              description: Document management system
              icon: paperless.svg
          - OpenCloud:
              href: https://drive.{{ .Values.global.domain }}
              description: File storage and sharing
              icon: open-cloud.svg
        - Management:
          - Transmission:
              href: https://transmission.{{ .Values.global.domain }}
              description: Bittorrent client
              icon: transmission.svg
          - Prowlarr:
              href: https://prowlarr.{{ .Values.global.domain }}
              description: Indexer manager
              icon: prowlarr.svg
          - Radarr:
              href: https://radarr.{{ .Values.global.domain }}
              description: Movie manager
              icon: radarr.svg
          - Sonarr:
              href: https://sonarr.{{ .Values.global.domain }}
              description: TV show manager
              icon: sonarr.svg
          - Kanidm:
              href: https://auth.{{ .Values.global.domain }}
              description: Identity management
              icon: https://auth.{{ .Values.global.domain }}/pkg/img/logo-square.svg
        - Development:
          - Forgejo:
              href: https://git.{{ .Values.global.domain }}
              description: Git forge
              icon: forgejo.svg
          - Woodpecker:
              href: https://ci.{{ .Values.global.domain }}
              description: Continuous integration
              icon: woodpecker-ci.svg
          - ArgoCD:
              href: https://argocd.{{ .Values.global.domain }}
              description: Continuous deployment
              icon: argocd.svg
          - Registry:
              href: https://registry.{{ .Values.global.domain }}
              description: Container registry
              icon: docker.svg
          - Grafana:
              href: https://grafana.{{ .Values.global.domain }}
              description: Observability dashboards
              icon: grafana.svg
        - Utilities:
          - Excalidraw:
              href: https://draw.{{ .Values.global.domain }}
              description: Virtual whiteboard
              icon: excalidraw.svg
          - Speedtest:
              href: https://speedtest.{{ .Values.global.domain }}
              description: Internal network speed test
              icon: openspeedtest.png
      bookmarks.yaml: |
        - Homelab:
          - Documentation:
            - href: https://homelab.khuedoan.com
              icon: google-docs.svg
          - Public homelab repository:
            - href: https://github.com/khuedoan/homelab
              icon: github.svg
        - Managed services:
          - Cloudflare:
            - href: https://dash.cloudflare.com
              icon: cloudflare.svg
          - Terraform Cloud:
            - href: https://app.terraform.io
              icon: terraform.svg
        - Infrastructure:
          {{- with .Values.global.addresses.router }}
          - Router:
            - href: https://{{ . }}
              icon: router.svg
          {{- end }}
          - Proxmox:
            - href: https://proxmox:8006
              icon: proxmox.svg
          - Google Cloud:
            - href: https://console.cloud.google.com
              icon: google-cloud-platform.svg
          - Oracle Cloud:
            - href: https://cloud.oracle.com
              icon: oracle-cloud.svg
rawResources:
  # Under the mesh-wide deny-all (system/istio-system): who may call into this namespace
  authorization-policy:
    forceRename: allow
    manifest:
      apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      spec:
        action: ALLOW
        rules:
          # Pods in this namespace call each other freely
          - from:
              - source:
                  namespaces: ['{{ .Release.Namespace }}']
          # the LAN Gateway
          - from:
              - source:
                  principals: ['cluster.local/ns/istio-system/sa/gateway-istio']
            to:
              - operation:
                  ports: ["3000"]
