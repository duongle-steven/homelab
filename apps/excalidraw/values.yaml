app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/excalidraw/excalidraw
            tag: latest
  service:
    main:
      ports:
        http:
          port: 80
          protocol: HTTP
  route:
    main:
      annotations:
        external-dns.kubernetes.io/cloudflare-proxied: "true"
      hostnames:
        - draw.khuedoan.com
      parentRefs:
        - name: homelab-public
          namespace: gateway
          sectionName: https
