app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/ollama/ollama
            tag: 0.40.3
    ui:
      containers:
        main:
          image:
            repository: ghcr.io/open-webui/open-webui
            tag: v0.12.0
          env:
            OLLAMA_BASE_URL: http://ollama:11434
  service:
    main:
      # Two controllers: name the one this Service selects
      controller: main
      # The UI calls http://ollama:11434
      forceRename: ollama
      ports:
        http:
          port: 11434
          protocol: HTTP
    ui:
      controller: ui
      ports:
        http:
          port: 8080
          protocol: HTTP
  route:
    main:
      hostnames:
        - ollama.khuedoan.com
      parentRefs: &parentRefs
        - name: homelab
          namespace: gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: main
              port: http
    ai:
      hostnames:
        - ai.khuedoan.com
      parentRefs: *parentRefs
      rules:
        - backendRefs:
            - identifier: ui
              port: http
  persistence:
    data:
      # Keep the PVC name ollama-data
      suffix: data
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /root/.ollama
