# Pod Security restricted (system/kyverno): RuntimeDefault seccomp, no privilege escalation
defaultPodOptions:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
controllers:
  main:
    defaultContainerOptionsStrategy: merge
    defaultContainerOptions:
      securityContext:
        allowPrivilegeEscalation: false
    containers:
      main:
        image:
          repository: docker.io/actualbudget/actual-server
          tag: 26.10.0-alpine
        env:
          ACTUAL_OPENID_DISCOVERY_URL: 'https://auth.{{ .Values.global.baseDomain }}/oauth2/openid/actualbudget/.well-known/openid-configuration'
          ACTUAL_OPENID_SERVER_HOSTNAME: 'https://budget.{{ .Values.global.baseDomain }}'
          ACTUAL_OPENID_CLIENT_ID: actualbudget
          ACTUAL_OPENID_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: actualbudget-kanidm-oauth2-credentials
                key: CLIENT_SECRET
          # Only OpenID; members of homelab-budget get an account on first login
          ACTUAL_OPENID_ENFORCE: "true"
          ACTUAL_USER_CREATION_MODE: login
          # The sandbox CA (global.devCA); empty in production
          NODE_EXTRA_CA_CERTS: '{{ if .Values.global.devCA }}/etc/homelab-dev-ca/ca.crt{{ end }}'
        probes:
          # Actual sets up OpenID only at start; if Kanidm (or the sandbox CA) is not ready then, it runs
          # with no login method and anyone could claim the server. Restart until OpenID is configured.
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - sh
                  - -c
                  - wget -qO- http://127.0.0.1:5006/account/login-methods | grep -q '"method":"openid"'
              periodSeconds: 10
              failureThreshold: 30
service:
  main:
    ports:
      http:
        port: 5006
        protocol: HTTP
route:
  main:
    hostnames:
      - budget.{{ .Values.global.baseDomain }}
    parentRefs:
      - name: gateway
        namespace: istio-system
        sectionName: https
persistence:
  data:
    # Snapshotted hourly; off-site only through lab backup push (docs/how-to-guides/backup-and-restore.md)
    labels:
      homelab/backup: manual
    # Keep the PVC name actualbudget-data (make backup)
    suffix: data
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /data
  dev-ca:
    # The sandbox CA from trust-manager; absent in production, so the volume is optional
    type: custom
    volumeSpec:
      configMap:
        name: homelab-dev-ca
        optional: true
    globalMounts:
      - path: /etc/homelab-dev-ca
        readOnly: true
rawResources:
  # Under the mesh-wide deny-all (system/istio-system): who may call into this namespace
  authorization-policy:
    forceRename: allow
    manifest:
      apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      spec:
        action: ALLOW
        rules:
          # Pods in this namespace call each other freely
          - from:
              - source:
                  namespaces: ['{{ .Release.Namespace }}']
          # the LAN Gateway
          - from:
              - source:
                  principals: ['cluster.local/ns/istio-system/sa/gateway-istio']
            to:
              - operation:
                  ports: ["5006"]
  kanidm-client:
    forceRename: actualbudget
    manifest:
      apiVersion: kaniop.rs/v1beta1
      kind: KanidmOAuth2Client
      spec:
        kanidmRef:
          name: kanidm
          namespace: kanidm
        displayname: Actual Budget
        origin: 'https://budget.{{ .Values.global.baseDomain }}'
        redirectUrl:
          - 'https://budget.{{ .Values.global.baseDomain }}/openid/callback'
        disableConsentPrompt: true
        preferShortUsername: true
        strictRedirectUrl: true
        # Actual Budget does not verify ES256 id tokens
        jwtLegacyCryptoEnable: true
        scopeMap:
          - group: homelab-budget
            # Actual maps no groups: do not send it every group the person is in
            scopes: [openid, profile, email]
  # Pod Security restricted (system/kyverno) does not hold for this image: why, in homelab/reason
  policy-exception:
    forceRename: pod-security
    manifest:
      apiVersion: policies.kyverno.io/v1
      kind: PolicyException
      metadata:
        annotations:
          # Its CRD comes from system/kyverno, which may sync later (a fresh cluster): apply the rest and retry this
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
          homelab/reason: "actual-server's image runs as root (no USER)"
      spec:
        policyRefs:
          - {name: require-run-as-nonroot, kind: ValidatingPolicy}
        matchConditions:
          - name: actualbudget
            expression: "object.metadata.namespace == 'actualbudget' && object.metadata.name.startsWith('actualbudget')"
