controllers:
  main:
    containers:
      main:
        image:
          repository: docker.io/actualbudget/actual-server
          tag: 26.10.0-alpine
service:
  main:
    ports:
      http:
        port: 5006
        protocol: HTTP
route:
  main:
    hostnames:
      - budget.{{ .Values.global.domain }}
    parentRefs:
      - name: homelab
        namespace: gateway
        sectionName: https
persistence:
  data:
    # Keep the PVC name actualbudget-data (make backup)
    suffix: data
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /data
