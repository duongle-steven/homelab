# The chart's NetworkPolicies only open its own ports; in Istio's ambient mesh every meshed connection arrives on
# ztunnel's HBONE port instead (the original port travels inside the mTLS tunnel)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbone
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 15008
