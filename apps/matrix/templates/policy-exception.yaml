# Pod Security restricted (system/kyverno) does not hold here: each exception says why in homelab/reason
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: matrix
  namespace: {{ .Release.Namespace }}
  annotations:
    # Its CRD comes from system/kyverno, which may sync later (a fresh cluster): apply the rest and retry this
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    homelab/reason: "production only: dendrite's chart runs as root and its signing-key Job uses unpinned bitnami/kubectl and busybox; revisit in 12b"
spec:
  policyRefs:
    - {name: disallow-privilege-escalation, kind: ValidatingPolicy}
    - {name: require-run-as-nonroot, kind: ValidatingPolicy}
    - {name: restrict-seccomp-strict, kind: ValidatingPolicy}
    - {name: require-pinned-images, kind: ValidatingPolicy}
  matchConditions:
    - name: matrix
      expression: "object.metadata.namespace == '{{ .Release.Namespace }}' && (object.metadata.name.startsWith('matrix-') || object.metadata.name.startsWith('generate-signing-key'))"
