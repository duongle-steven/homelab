# kubectl apply -f dbench-rwo.yaml
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: dbench-rwo
spec:
  storageClassName: standard-rwo
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dbench-rwo
spec:
  template:
    spec:
      containers:
        - name: dbench
          image: zayashv/dbench:latest@sha256:5186d2e2acca33d98b0f50a2fba3463bf0ebe30864c8dbd529f234651c462db4
          imagePullPolicy: Always
          env:
            - name: DBENCH_MOUNTPOINT
              value: /data
            - name: DBENCH_QUICK
              value: "no"
          volumeMounts:
            - name: data
              mountPath: /data
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dbench-rwo
