# Pods of namespace ci as Argo makes them (init and wait are argoexec, main is the step), for TestCISeccompPolicies
apiVersion: v1
kind: Pod
metadata:
  name: build
  namespace: ci
  labels:
    workflows.argoproj.io/workflow: ci-x
    homelab/ci-step: build
spec:
  initContainers:
    - name: init
      image: quay.io/argoproj/argoexec:v4.1.6
  containers:
    - name: wait
      image: quay.io/argoproj/argoexec:v4.1.6
    - name: main
      image: quay.io/buildah/stable:v1.43.5
  hostUsers: false
---
