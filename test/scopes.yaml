# Which sandbox specs a change runs (inputs of the whole cluster, egress rendered into every namespace: full) (lab test scope, docs/how-to-guides/sandbox-tests.md). Paths are globs (**
# spans directories) matched against the files a branch changes; a file no entry knows runs the whole suite, and
# `just cli check` fails until its component is added here. Tests are Ginkgo label filters over the specs' labels in
# test/e2e (on their top-level Describe only); `just test e2e` adds the environment (`&& sandbox`) itself.
skip:
  - .github/**
  - scripts/ci-check
  - scripts/lint
  # Compares renders offline (diff -r of two runs)
  - scripts/render-all
  - docs/**
  - "**/*.md"
  - mkdocs.yml
  - LICENSE.md
  - renovate.json5
  - .github/**
  - .gitignore
  - .dockerignore
  - .yamllint.yaml
  # Read only by just testbed-scan and just dev-scan, which run by hand
  - .cluster-scan-accepted.yaml
  - test/e2e/scan_test.go
  - test/kube-bench-cfg/**
  # Offline tests and their scripts: the basic checks run them
  - test/offline/**
  - test/internal/**/*_test.go
  - scripts/check-*
  - scripts/render-chart
  - scripts/cloudflare-credentials
  - scripts/rotate-state-passphrase
  - scripts/helm-diff
  - scripts/__pycache__/**
  # lab's offline parts (just cli test); its Forgejo deploy runs against the sandbox (the group below)
  - cli/justfile
  - cli/cmd/**
  - cli/internal/scope/**
  - cli/internal/state/**
  - cli/internal/env/**
  - cli/internal/guard/**
  - cli/internal/cli/root.go
  - cli/internal/cli/test*.go
  - cli/internal/cli/infra_state*.go
  - cli/internal/cli/cloudflare*.go
# The fixed set: environments (where a spec may run), alone (runs by itself after the others, Serial), and one family per
# spec (its old test name's prefix) with extras where a group names one spec or a family reaches across (a spec carries
# them only on its top-level container; `just cli check` fails on a label outside this list or one no spec carries)
labels: [sandbox, testbed, production, alone, smoke, argocd, identity, sso, gateway, forgejo, mesh, monitoring, egress,
  secrets, ntfy, logs, security-logs, woodpecker, policy, supply-chain, trivy-operator, public, node-restart,
  node-power-cut, backup-restore, rotation, proof, power, scan, kiali, grafana, zot, actual-budget, paperless,
  opencloud, deploy, cut-every-node, shutdown-startup, node-not-returning, cut-postgres]
always: smoke
# Each runs by itself after the main run, in this order (#78)
alone: [backup-restore, node-power-cut, node-restart, rotation]
full: smoke || identity || sso || gateway || forgejo || mesh || monitoring || egress || secrets || ntfy || logs || woodpecker || policy || supply-chain || trivy-operator || public || node-restart || node-power-cut || backup-restore || rotation
groups:
  - paths:
      - justfile
      - test/justfile
      - test/scopes.yaml
      - test/go.mod
      - test/go.sum
      - test/e2e/*helpers*_test.go
      - flake.nix
      - flake.lock
      - nix/**
      - .envrc
      - Dockerfile
      - system/argocd/**
      - system/argocd-config/**
      - infra/_modules/argocd/**
      - infra/sandbox/argocd/**
      - infra/_modules/k3d/**
      # The API server's audit policy: a change rebuilds the sandbox's cluster
      - infra/_modules/metal/flake/audit-policy.yaml
      # Fills the k3d module's image caches before a build
      - scripts/warm-image-cache
      - infra/sandbox/cluster/**
      - infra/root.hcl
      - scripts/env-values
      - system/egress/**
      # The sandbox's default StorageClass: every volume
      - system/csi-hostpath/**
    tests: full
  - paths: [system/istio-system/**]
    tests: mesh || gateway || egress || identity || node-restart || node-power-cut
  - paths: [system/cert-manager/**]
    tests: gateway || identity || sso
  # Velero, the hourly snapshots and lab backup (OpenBao's snapshot is in the secrets group)
  - paths: [system/velero/**, cli/internal/backup/**, cli/internal/cli/backup*.go, test/e2e/backup_test.go]
    tests: backup-restore
  # The catalog changes what rotates: Rotation, alone after the suite
  - paths: [cli/internal/rotate/**, cli/internal/cli/secrets*.go]
    tests: rotation
  - paths: [system/loki/**]
    tests: logs
  - paths: [system/kiali/**]
    tests: kiali
  - paths: [system/kyverno/**]
    tests: policy || supply-chain
  - paths: [system/trivy-operator/**]
    tests: trivy-operator
  - paths: [system/public-scan/**, system/loki/files/public-scan-rules.yaml, test/e2e/public_scan_test.go]
    tests: public
  - paths: [system/monitoring-system/**]
    tests: monitoring || mesh || ntfy || logs
  - paths:
      - system/secret-store/**
      - platform/openbao/**
      - platform/external-secrets/**
      - platform/generated-secrets/**
      - platform/infra-secrets/**
      - infra/_modules/openbao/**
      - infra/_modules/secrets/**
      - infra/_modules/kept-value/**
      - infra/sandbox/openbao/**
      - infra/sandbox/secrets/**
    # Every component that reads a secret through ESO
    tests: secrets || identity || sso || ntfy || forgejo || logs || gateway || monitoring || woodpecker || backup-restore
  # Forgejo and zot need Kanidm's discovery document at start
  - paths: [platform/kanidm/**, scripts/onboard-user]
    tests: identity || sso || (forgejo && deploy) || (gateway && zot) || woodpecker
  - paths: [platform/grafana/**]
    tests: grafana || logs || monitoring
  - paths: [platform/forgejo/**, platform/cloudnative-pg/**]
    tests: forgejo || woodpecker || backup-restore
  # lab infra forgejo sync and push (ForgejoDeploy); go.mod pins their SDKs
  - paths: [cli/internal/forgejo/**, cli/internal/secrets/**, cli/internal/cli/infra_forgejo*.go, cli/go.mod, cli/go.sum]
    tests: forgejo || woodpecker
  - paths: [platform/zot/**]
    tests: zot || woodpecker
  - paths: [platform/woodpecker/**]
    tests: woodpecker
  - paths: [platform/secrets-rotation/**, scripts/build-lab-image, cli/Dockerfile]
    tests: rotation
  - paths: [apps/actualbudget.yaml]
    tests: actual-budget
  - paths: [apps/paperless.yaml]
    tests: paperless
  - paths: [apps/opencloud.yaml]
    tests: opencloud
  - paths: [apps/ntfy.yaml]
    tests: ntfy
  # Smoke only: apps without their own tests, components the sandbox does not run, and tools for production
  - paths:
      - apps/blog.yaml
      - apps/excalidraw.yaml
      - apps/homepage.yaml
      - apps/jellyfin.yaml
      - apps/matrix/**
      - apps/pairdrop.yaml
      - apps/speedtest.yaml
      - apps/tailscale.yaml
      - apps/wireguard.yaml
      - platform/renovate/**
      - system/cloudflared/**
      - system/external-dns/**
      - system/kured/**
      - system/rook-ceph/**
      - infra/justfile
      - infra/production/**
      - infra/_modules/cloudflare/**
      - infra/_modules/backup/**
      # The nodes (testbed and production; just testbed proves them), but for the API server's audit policy, which
      # the sandbox's k3d node uses too (a group below)
      - infra/_modules/metal/*.tf
      - infra/_modules/metal/flake/*.nix
      - infra/_modules/metal/flake/flake.lock
      - infra/_modules/metal/flake/authorized_keys
      - infra/_modules/metal/flake/profiles/**
      - infra/_modules/testbed-vms/**
      - infra/testbed/**
      - scripts/lab
      - scripts/testbed-guard
      - scripts/testbed-nixie
      - scripts/testbed-wake
      - scripts/mark-proof
      - scripts/testbed-trust
      - test/benchmark/**
      - scripts/argocd-admin-password
      - scripts/get-dns-config
      - scripts/get-status
      - scripts/get-wireguard-config
      - scripts/new-service
    tests: ""
components:
  - system/*/
  - platform/*/
  - apps/*.yaml
  - apps/*/
  - infra/_modules/*/
  - infra/*/*/
  - scripts/*
  - nix/*
