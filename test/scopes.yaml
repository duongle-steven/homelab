# Which sandbox tests a change runs (inputs of the whole cluster, egress rendered into every namespace: full) (lab test scope, docs/how-to-guides/sandbox-tests.md). Paths are globs (**
# spans directories) matched against the files a branch changes; a file no entry knows runs the whole suite, and
# `make -C cli check` fails until its component is added here.
skip:
  - .github/**
  - scripts/ci-check
  - scripts/lint
  - docs/**
  - "**/*.md"
  - mkdocs.yml
  - LICENSE.md
  - renovate.json5
  - .github/**
  - .gitignore
  - .dockerignore
  - .yamllint.yaml
  # Offline tests and their scripts: the basic checks run them
  - test/state_*_test.go
  - test/ci_scripts_test.go
  - test/argocd_revision_test.go
  - test/generated_secrets_test.go
  - test/woodpecker_test.go
  - test/forgejo_render_test.go
  - test/backup_groups_test.go
  - test/velero_test.go
  - test/velero_scripts_test.go
  - test/fixtures/**
  - test/kept_value_test.go
  - test/renovate_test.go
  - test/cni_watchdog_test.go
  - test/apps_test.go
  - scripts/check-*
  - scripts/render-chart
  - scripts/cloudflare-credentials
  - scripts/rotate-state-passphrase
  - scripts/helm-diff
  - scripts/__pycache__/**
  # lab's offline parts (make -C cli test); its Forgejo deploy runs against the sandbox (the group below)
  - cli/Makefile
  - cli/cmd/**
  - cli/internal/scope/**
  - cli/internal/state/**
  - cli/internal/env/**
  - cli/internal/guard/**
  - cli/internal/cli/root.go
  - cli/internal/cli/test*.go
  - cli/internal/cli/infra_state*.go
  - cli/internal/cli/cloudflare*.go
always: Smoke
alone: [NodeRestart, NodePowerCut, BackupRestore, Rotation]
full: Smoke|Identity|SSO|Gateway|Forgejo|Mesh|Monitoring|Egress|Secrets|Ntfy|Logs|Woodpecker|Policy|NodeRestart|NodePowerCut|BackupRestore|Rotation
groups:
  - paths:
      - Makefile
      - test/Makefile
      - test/scopes.yaml
      - test/go.mod
      - test/go.sum
      - test/*helpers*_test.go
      - flake.nix
      - flake.lock
      - nix/**
      - .envrc
      - Dockerfile
      - system/argocd/**
      - system/argocd-config/**
      - infra/_modules/argocd/**
      - infra/sandbox/argocd/**
      - infra/_modules/k3d/**
      # The API server's audit policy: a change rebuilds the sandbox's cluster
      - metal/roles/k3s/files/audit-policy.yaml
      # Fills the k3d module's image caches before a build
      - scripts/warm-image-cache
      - infra/sandbox/cluster/**
      - infra/root.hcl
      - scripts/env-values
      - system/egress/**
      # The sandbox's default StorageClass: every volume
      - system/csi-hostpath/**
    tests: full
  - paths: [system/istio-system/**]
    tests: Mesh|Gateway|Egress|Identity|NodeRestart|NodePowerCut
  - paths: [system/cert-manager/**]
    tests: Gateway|Identity|SSO
  # Velero, the hourly snapshots and lab backup (OpenBao's snapshot is in the secrets group)
  - paths: [system/velero/**, cli/internal/backup/**, cli/internal/cli/backup*.go, test/backup_test.go]
    tests: BackupRestore
  # The catalog changes what rotates: TestRotation, alone after the suite
  - paths: [cli/internal/rotate/**, cli/internal/cli/secrets*.go]
    tests: Rotation
  - paths: [system/loki/**]
    tests: Logs
  - paths: [system/kiali/**]
    tests: SSOKiali|KialiRender
  - paths: [system/kyverno/**]
    tests: Policy
  - paths: [system/monitoring-system/**]
    tests: Monitoring|Mesh|Ntfy|Logs
  - paths:
      - system/secret-store/**
      - platform/openbao/**
      - platform/external-secrets/**
      - platform/generated-secrets/**
      - platform/infra-secrets/**
      - infra/_modules/openbao/**
      - infra/_modules/secrets/**
      - infra/_modules/kept-value/**
      - infra/sandbox/openbao/**
      - infra/sandbox/secrets/**
    # Every component that reads a secret through ESO
    tests: Secrets|Identity|SSO|Ntfy|Forgejo|Logs|Gateway|Monitoring|Woodpecker|BackupRestore
  # Forgejo and zot need Kanidm's discovery document at start
  - paths: [platform/kanidm/**, scripts/onboard-user]
    tests: Identity|SSO|ForgejoDeploy|GatewayZotLargePush|Woodpecker
  - paths: [platform/grafana/**]
    tests: SSOGrafana|Logs|Monitoring
  - paths: [platform/forgejo/**, platform/cloudnative-pg/**]
    tests: Forgejo|SSOForgejo|GatewayForgejoSSH|Woodpecker|BackupRestore
  # lab infra forgejo sync and push (TestForgejoDeploy); go.mod pins their SDKs
  - paths: [cli/internal/forgejo/**, cli/internal/secrets/**, cli/internal/cli/infra_forgejo*.go, cli/go.mod, cli/go.sum]
    tests: Forgejo|Woodpecker
  - paths: [platform/zot/**]
    tests: SSOZot|GatewayZotLargePush|Woodpecker
  - paths: [platform/woodpecker/**]
    tests: Woodpecker
  - paths: [platform/secrets-rotation/**, scripts/build-lab-image, cli/Dockerfile]
    tests: Rotation
  - paths: [apps/actualbudget.yaml]
    tests: SSOActualBudget
  - paths: [apps/paperless.yaml]
    tests: SSOPaperless
  - paths: [apps/opencloud.yaml]
    tests: SSOOpenCloud
  - paths: [apps/ntfy.yaml]
    tests: Ntfy
  # Smoke only: apps without their own tests, components the sandbox does not run, and tools for production
  - paths:
      - apps/blog.yaml
      - apps/excalidraw.yaml
      - apps/homepage.yaml
      - apps/jellyfin.yaml
      - apps/matrix/**
      - apps/ollama.yaml
      - apps/pairdrop.yaml
      - apps/speedtest.yaml
      - apps/tailscale.yaml
      - apps/wireguard.yaml
      - platform/renovate/**
      - system/cloudflared/**
      - system/external-dns/**
      - system/kured/**
      - system/rook-ceph/**
      - infra/Makefile
      - infra/production/**
      - infra/_modules/cloudflare/**
      - infra/_modules/backup/**
      # Production's nodes, but for the API server's audit policy, which the sandbox's k3d node uses too (a group below)
      - metal/*
      - metal/group_vars/**
      - metal/inventories/**
      - metal/roles/automatic_upgrade/**
      - metal/roles/prerequisites/**
      - metal/roles/pxe_server/**
      - metal/roles/wake/**
      - metal/roles/k3s/defaults/**
      - metal/roles/k3s/tasks/**
      - metal/roles/k3s/templates/**
      - metal/roles/k3s/files/bin/**
      - test/benchmark/**
      - scripts/argocd-admin-password
      - scripts/get-dns-config
      - scripts/get-status
      - scripts/get-wireguard-config
      - scripts/new-service
      - scripts/pxe-logs
    tests: ""
components:
  - system/*/
  - platform/*/
  - apps/*.yaml
  - apps/*/
  - infra/_modules/*/
  - infra/*/*/
  - scripts/*
  - nix/*
