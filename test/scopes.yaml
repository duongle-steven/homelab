# Which sandbox tests a change runs (inputs of the whole cluster, egress rendered into every namespace: full) (lab test scope, docs/how-to-guides/sandbox-tests.md). Paths are globs (**
# spans directories) matched against the files a branch changes; a file no entry knows runs the whole suite, and
# `make -C cli check` fails until its component is added here.
skip:
  - .github/**
  - scripts/ci-check
  - scripts/lint
  - scripts/sandbox-scope
  - scripts/sandbox-last-passed
  - docs/**
  - "**/*.md"
  - mkdocs.yml
  - LICENSE.md
  - renovate.json5
  - .github/**
  - .woodpecker/**
  - .gitignore
  - .dockerignore
  - .yamllint.yaml
  # Offline tests and their scripts: the basic checks run them
  - test/state_*_test.go
  - test/ci_scripts_test.go
  - test/argocd_revision_test.go
  - test/generated_secrets_test.go
  - test/kept_value_test.go
  - test/renovate_test.go
  - test/cni_watchdog_test.go
  - test/apps_test.go
  - scripts/check-*
  - scripts/render-chart
  - scripts/cloudflare-credentials
  - scripts/rotate-state-passphrase
  - scripts/helm-diff
  - scripts/__pycache__/**
  # lab's offline parts (make -C cli test); its Forgejo deploy runs against the sandbox (the group below)
  - cli/Makefile
  - cli/cmd/**
  - cli/internal/scope/**
  - cli/internal/state/**
  - cli/internal/env/**
  - cli/internal/guard/**
  - cli/internal/cli/root.go
  - cli/internal/cli/test*.go
  - cli/internal/cli/infra_state*.go
  - cli/internal/cli/cloudflare*.go
always: Smoke
alone: [NodeRestart]
full: Smoke|Identity|SSO|Gateway|Forgejo|Mesh|Monitoring|Egress|Secrets|Ntfy|Logs|NodeRestart
groups:
  - paths:
      - Makefile
      - test/Makefile
      - test/scopes.yaml
      - test/go.mod
      - test/go.sum
      - test/*helpers*_test.go
      - flake.nix
      - flake.lock
      - nix/**
      - .envrc
      - Dockerfile
      - system/argocd/**
      - system/argocd-config/**
      - infra/_modules/argocd/**
      - infra/sandbox/argocd/**
      - infra/_modules/k3d/**
      - infra/sandbox/cluster/**
      - infra/root.hcl
      - scripts/env-values
      - system/egress/**
    tests: full
  - paths: [system/istio-system/**]
    tests: Mesh|Gateway|Egress|Identity|NodeRestart
  - paths: [system/cert-manager/**]
    tests: Gateway|Identity|SSO
  - paths: [system/loki/**]
    tests: Logs
  - paths: [system/monitoring-system/**]
    tests: Monitoring|Mesh|Ntfy|Logs
  - paths:
      - system/secret-store/**
      - platform/openbao/**
      - platform/external-secrets/**
      - platform/generated-secrets/**
      - platform/infra-secrets/**
      - infra/_modules/openbao/**
      - infra/_modules/secrets/**
      - infra/_modules/kept-value/**
      - infra/sandbox/openbao/**
      - infra/sandbox/secrets/**
    # Every component that reads a secret through ESO
    tests: Secrets|Identity|SSO|Ntfy|Forgejo|Logs|Gateway|Monitoring
  # Forgejo and zot need Kanidm's discovery document at start
  - paths: [platform/kanidm/**, scripts/onboard-user]
    tests: Identity|SSO|ForgejoDeploy|GatewayZotLargePush
  - paths: [platform/grafana/**]
    tests: SSOGrafana|Logs|Monitoring
  - paths: [platform/forgejo/**]
    tests: Forgejo|SSOForgejo|GatewayForgejoSSH
  # lab infra forgejo sync and push (TestForgejoDeploy); go.mod pins their SDKs
  - paths: [cli/internal/forgejo/**, cli/internal/secrets/**, cli/internal/cli/infra_forgejo*.go, cli/go.mod, cli/go.sum]
    tests: Forgejo
  - paths: [platform/zot/**]
    tests: SSOZot|GatewayZotLargePush
  - paths: [apps/actualbudget.yaml]
    tests: SSOActualBudget
  - paths: [apps/paperless.yaml]
    tests: SSOPaperless
  - paths: [apps/opencloud.yaml]
    tests: SSOOpenCloud
  - paths: [apps/ntfy.yaml]
    tests: Ntfy
  # Smoke only: apps without their own tests, components the sandbox does not run, and tools for production
  - paths:
      - apps/blog.yaml
      - apps/excalidraw.yaml
      - apps/homepage.yaml
      - apps/jellyfin.yaml
      - apps/matrix/**
      - apps/ollama.yaml
      - apps/pairdrop.yaml
      - apps/speedtest.yaml
      - apps/tailscale.yaml
      - apps/wireguard.yaml
      - platform/cloudnative-pg/**
      - platform/renovate/**
      - platform/woodpecker/**
      - system/cloudflared/**
      - system/external-dns/**
      - system/kured/**
      - system/rook-ceph/**
      - system/volsync-system/**
      - infra/Makefile
      - infra/production/**
      - infra/_modules/cloudflare/**
      - metal/**
      - test/benchmark/**
      - scripts/argocd-admin-password
      - scripts/get-dns-config
      - scripts/get-status
      - scripts/get-wireguard-config
      - scripts/new-service
      - scripts/pxe-logs
    tests: ""
components:
  - system/*/
  - platform/*/
  - apps/*.yaml
  - apps/*/
  - infra/_modules/*/
  - infra/*/*/
  - scripts/*
  - nix/*
