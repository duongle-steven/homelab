# Which sandbox specs a change runs (inputs of the whole cluster, egress rendered into every namespace: full) (lab test scope, docs/how-to-guides/sandbox-tests.md). Paths are globs (**
# spans directories) matched against the files a branch changes; a file no entry knows runs the whole suite, and
# `just cli check` fails until its component is added here. Tests are Ginkgo label filters over the specs' labels in
# test/e2e (on their top-level Describe only); `just test e2e` adds the environment (`&& sandbox`) itself.
skip:
  - .github/**
  - scripts/ci-check
  - scripts/lint
  # Compares renders offline (diff -r of two runs)
  - scripts/render-all
  # just dev's check for a stopped sandbox (test/offline/preflight_test.go)
  - scripts/sandbox-stopped
  - docs/**
  - "**/*.md"
  - mkdocs.yml
  - LICENSE.md
  - renovate.json5
  - .github/**
  - .gitignore
  - .dockerignore
  - .yamllint.yaml
  # Read only by just testbed-scan and just dev-scan, which run by hand
  - .cluster-scan-accepted.yaml
  - test/e2e/scan_test.go
  - test/kube-bench-cfg/**
  # Generated by lab catalog generate, read only by Backstage (platform/backstage's specs cover it)
  - catalog/**
  - catalog-info.yaml
  # Offline tests and their scripts: the basic checks run them
  - test/offline/**
  - test/internal/**/*_test.go
  - scripts/check-*
  - scripts/render-chart
  - scripts/cloudflare-credentials
  - scripts/rotate-state-passphrase
  - scripts/helm-diff
  - scripts/__pycache__/**
  # lab's offline parts (just cli test); its Forgejo deploy runs against the sandbox (the group below)
  - cli/justfile
  - cli/cmd/**
  - cli/internal/scope/**
  - cli/internal/state/**
  - cli/internal/env/**
  - cli/internal/guard/**
  - cli/internal/cli/root.go
  - cli/internal/cli/test*.go
  - cli/internal/cli/infra_state*.go
  - cli/internal/cli/cloudflare*.go
# The fixed set: environments (where a spec may run), alone (runs by itself after the others, Serial), and one family per
# spec (its old test name's prefix) with extras where a group names one spec or a family reaches across (a spec carries
# them only on its top-level container; `just cli check` fails on a label outside this list or one no spec carries)
labels:
  - sandbox
  - testbed
  - production
  - alone
  - smoke
  - argocd
  - identity
  - sso
  - gateway
  - forgejo
  - mesh
  - monitoring
  - egress
  - secrets
  - ntfy
  - logs
  - security-logs
  - traces
  - ci
  - matrix
  - seccomp
  - policy
  - supply-chain
  - trivy-operator
  - falco
  - public
  - node-restart
  - node-power-cut
  - backup-restore
  - rotation
  - proof
  - power
  - scan
  - hardware-proof
  - kiali
  - backstage
  - delivery
  - kargo
  - grafana
  - zot
  - actual-budget
  - paperless
  - opencloud
  - deploy
  - cut-every-node
  - shutdown-startup
  - node-not-returning
  - cut-postgres
always: smoke
# Each runs by itself after the main run, in this order (#78)
alone: [backup-restore, node-power-cut, node-restart, rotation]
full: smoke || argocd || identity || sso || gateway || forgejo || mesh || monitoring || egress || secrets || ntfy || logs || traces || ci || backstage || delivery || matrix || seccomp || policy || supply-chain || trivy-operator || falco || public || node-restart || node-power-cut || backup-restore || rotation
# What every sandbox runs, and the groups of components it deploys only when a run needs them
# (docs/superpowers/specs/2026-11-20-sandbox-groups-design.md): a group goes in when a selected spec carries one of
# its labels, when the branch changes one of its components, or when a deployed group needs it. Every label a sandbox
# spec carries is the core's or a group's (lab test scope --check); --full deploys every group
core:
  components:
    - system/crds
    - system/argocd-config
    - system/istio-system
    - system/cert-manager
    - system/csi-hostpath
    - system/egress
    - system/secret-store
    - platform/external-secrets
    - platform/openbao
    - platform/generated-secrets
    - platform/infra-secrets
    - platform/kanidm
    # A small static page: the egress, Gateway, mesh, policy and Trivy specs' sample workload
    - apps/excalidraw.yaml
  # sso's specs also carry their app's label
  labels: [smoke, argocd, identity, sso, gateway, egress, secrets, node-restart, node-power-cut, scan]
deployGroups:
  # MeshMetrics and MeshPrometheusTargetsUp read Prometheus
  metrics:
    components: [system/monitoring-system]
    labels: [monitoring, mesh]
  observability:
    components: [system/loki, system/tempo, system/opentelemetry, system/kiali, platform/grafana]
    needs: [metrics]
    # Rotation checks Grafana after rotating its admin password; the secrets specs read Grafana's Secrets
    labels: [logs, security-logs, traces, kiali, grafana, rotation, secrets]
  # TestSupplyChain checks Kyverno's verify-lab-image against an image in zot
  policy:
    components: [system/kyverno]
    labels: [policy, supply-chain]
  # Falco's and the public scan's alerts are Loki's ruler's
  security:
    components: [system/trivy-operator, system/falco, system/public-scan]
    needs: [observability]
    labels: [trivy-operator, falco, public]
  # Rotation restarts the readers of every scheduled entry: Forgejo's and ntfy's among them
  backup:
    components: [system/velero, platform/secrets-rotation]
    needs: [git, ntfy]
    labels: [backup-restore, rotation]
  # NodePowerCut checks Forgejo's data after the cut; SecretsGeneratedOnlyInOpenBao reads its Secrets
  git:
    components: [platform/cloudnative-pg, platform/forgejo]
    labels: [forgejo, deploy, node-power-cut, secrets]
  ci:
    components: [platform/zot, platform/argo-workflows, platform/argo-events, platform/ci]
    needs: [git]
    # Rotation rotates zot's ci password; SecretsGeneratedOnlyInOpenBao reads the CI's Secrets
    labels: [ci, zot, seccomp, supply-chain, rotation, secrets]
  backstage:
    components: [platform/backstage]
    needs: [ci]
    labels: [backstage]
  # The app road: Argo Rollouts' analysis reads Prometheus, Kargo's verify checks the CI's signature, AppDelivery
  # creates its repository from Backstage's template
  delivery:
    components: [system/argo-rollouts, platform/kargo, test/fixtures/apps/delivery-test.yaml]
    needs: [ci, backstage, metrics]
    labels: [delivery, kargo]
  # Alertmanager's delivery to ntfy is what its specs check; ntfy is a public route (GatewayPublicAllowList) and
  # NodePowerCut checks its data after the cut
  ntfy:
    components: [apps/ntfy.yaml]
    needs: [metrics]
    labels: [ntfy, public, node-power-cut]
  matrix:
    components: [apps/matrix.yaml]
    labels: [matrix]
  actualbudget:
    components: [apps/actualbudget.yaml]
    labels: [actual-budget]
  paperless:
    components: [apps/paperless.yaml]
    labels: [paperless]
  opencloud:
    components: [apps/opencloud.yaml]
    labels: [opencloud]
  homepage:
    components: [apps/homepage.yaml]
  pairdrop:
    components: [apps/pairdrop.yaml]
  speedtest:
    components: [apps/speedtest.yaml]
groups:
  # Every component's CRDs: what every spec stands on
  - paths: [system/crds/**, scripts/vendor-crds]
    tests: full
  - paths:
      - justfile
      - test/justfile
      - test/scopes.yaml
      - test/go.mod
      - test/go.sum
      - test/e2e/*helpers*_test.go
      # The suite's entry, and what it waits on before every run (Argo CD settled)
      - test/e2e/e2e_suite_test.go
      - test/internal/argocd/*.go
      - flake.nix
      - flake.lock
      - nix/**
      - .envrc
      - Dockerfile
      - system/argocd/**
      - system/argocd-config/**
      - infra/_modules/argocd/**
      - infra/sandbox/argocd/**
      - infra/_modules/k3d/**
      # The API server's audit policy: a change rebuilds the sandbox's cluster
      - infra/_modules/metal/flake/audit-policy.yaml
      # The Localhost seccomp profiles: a change rebuilds it too
      - infra/_modules/metal/flake/seccomp/**
      # Fills the k3d module's image caches before a build
      - scripts/warm-image-cache
      - infra/sandbox/cluster/**
      - infra/root.hcl
      - scripts/env-values
      - system/egress/**
      # The sandbox's default StorageClass: every volume
      - system/csi-hostpath/**
    tests: full
  - paths: [system/istio-system/**]
    tests: mesh || gateway || egress || identity || node-restart || node-power-cut
  - paths: [system/cert-manager/**]
    tests: gateway || identity || sso
  # Velero, the hourly snapshots and lab backup (OpenBao's snapshot is in the secrets group)
  - paths: [system/velero/**, cli/internal/backup/**, cli/internal/cli/backup*.go, test/e2e/backup_test.go]
    tests: backup-restore
  # The catalog changes what rotates: Rotation, alone after the suite
  - paths: [cli/internal/rotate/**, cli/internal/cli/secrets*.go]
    tests: rotation
  - paths: [system/loki/**]
    tests: logs
  - paths: [system/opentelemetry/**, system/tempo/**, test/e2e/traces_test.go]
    tests: logs || traces
  # Backstage (always in the sandbox; its image built by every just dev)
  - paths: [backstage/**, platform/backstage/**, scripts/build-backstage-image, test/e2e/backstage_test.go]
    tests: backstage
  # App delivery: Argo Rollouts and Kargo, driven end to end by AppDelivery
  - paths: [system/argo-rollouts/**, test/e2e/argo_rollouts_test.go, test/e2e/app_delivery_test.go, test/fixtures/apps/**, platform/ci/templates/signature-analysis.yaml]
    tests: delivery
  - paths: [platform/kargo/**, test/e2e/sso_kargo_test.go]
    tests: kargo || delivery
  - paths: [system/kiali/**]
    tests: kiali
  - paths: [system/kyverno/**]
    tests: policy || supply-chain
  - paths: [system/trivy-operator/**]
    tests: trivy-operator
  - paths: [system/falco/**, system/loki/files/falco-rules.yaml, test/e2e/falco_test.go]
    tests: falco
  - paths: [system/public-scan/**, system/loki/files/public-scan-rules.yaml, test/e2e/public_scan_test.go]
    tests: public
  - paths: [system/monitoring-system/**]
    tests: monitoring || mesh || ntfy || logs
  - paths:
      - system/secret-store/**
      - platform/openbao/**
      - platform/external-secrets/**
      - platform/generated-secrets/**
      - platform/infra-secrets/**
      - infra/_modules/openbao/**
      - infra/_modules/secrets/**
      - infra/_modules/kept-value/**
      - infra/sandbox/openbao/**
      - infra/sandbox/secrets/**
    # Every component that reads a secret through ESO
    tests: secrets || identity || sso || ntfy || forgejo || logs || gateway || monitoring || ci || backup-restore
  # Forgejo and zot need Kanidm's discovery document at start
  - paths: [platform/kanidm/**, scripts/onboard-user]
    tests: identity || sso || (forgejo && deploy) || (gateway && zot) || ci
  - paths: [platform/grafana/**]
    tests: grafana || logs || monitoring
  - paths: [platform/forgejo/**, platform/cloudnative-pg/**]
    tests: forgejo || ci || backup-restore
  # lab infra forgejo sync and push (ForgejoDeploy); go.mod pins their SDKs
  - paths: [cli/internal/forgejo/**, cli/internal/secrets/**, cli/internal/cli/infra_forgejo*.go, cli/go.mod, cli/go.sum]
    tests: forgejo || ci
  - paths: [platform/zot/**]
    tests: zot || ci
  # Step 10f: the golden path, its events, its controller and its UI's sign-in
  - paths: [platform/argo-workflows/**, platform/argo-events/**, platform/ci/**]
    tests: ci
  - paths: [platform/secrets-rotation/**, scripts/build-lab-image, cli/Dockerfile]
    tests: rotation
  - paths: [apps/actualbudget.yaml]
    tests: actual-budget
  - paths: [apps/matrix.yaml]
    tests: matrix
  - paths: [apps/paperless.yaml]
    tests: paperless
  - paths: [apps/opencloud.yaml]
    tests: opencloud
  - paths: [apps/ntfy.yaml]
    tests: ntfy
  # Smoke only: apps without their own tests, components the sandbox does not run, and tools for production
  - paths:
      - apps/blog.yaml
      - apps/excalidraw.yaml
      - apps/homepage.yaml
      - apps/jellyfin.yaml
      - apps/pairdrop.yaml
      - apps/speedtest.yaml
      - apps/tailscale.yaml
      - apps/wireguard.yaml
      - platform/renovate/**
      - system/cloudflared/**
      - system/external-dns/**
      - system/rook-ceph/**
      - infra/justfile
      - infra/production/**
      - infra/_modules/cloudflare/**
      - infra/_modules/backup/**
      # The nodes (testbed and production; just testbed proves them), but for the API server's audit policy and the
      # seccomp profiles, which the sandbox's k3d node uses too (a group above)
      - infra/_modules/metal/*.tf
      - infra/_modules/metal/flake/*.nix
      - infra/_modules/metal/flake/flake.lock
      - infra/_modules/metal/flake/authorized_keys
      - infra/_modules/metal/flake/profiles/**
      - infra/_modules/testbed-vms/**
      - infra/testbed/**
      - scripts/lab
      - scripts/testbed-guard
      - scripts/testbed-nixie
      - scripts/ssh-key-loaded
      - scripts/testbed-leftovers
      - scripts/metal-nixie
      - scripts/node-fio
      - scripts/node-fio-remote
      - scripts/testbed-wake
      - scripts/mark-proof
      - scripts/testbed-trust
      - test/benchmark/**
      - scripts/argocd-admin-password
      - scripts/get-dns-config
      - scripts/get-status
      - scripts/get-wireguard-config
      - scripts/new-service
    tests: ""
components:
  - system/*/
  - platform/*/
  - apps/*.yaml
  - apps/*/
  - infra/_modules/*/
  - infra/*/*/
  - scripts/*
  - nix/*
