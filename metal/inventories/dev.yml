all:
  vars:
    cilium_k8s_service_host: homelab-dev-control-plane
    cilium_k8s_service_port: 6443
    load_balancer_ip_pool:
      - 172.30.255.200/29
    # Pods would otherwise resolve sandbox hostnames to their own loopback
    coredns_rewrite_rule: 'rewrite name regex (.*)\.127-0-0-1\.nip\.io ingress-nginx-controller.ingress-nginx.svc.cluster.local answer auto'
# The kind node is not managed over SSH, so the metal plays have no hosts
metal:
  children:
    masters:
      hosts: {}
    workers:
      hosts: {}
