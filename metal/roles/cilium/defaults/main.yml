cilium_repo_url: https://helm.cilium.io
cilium_version: 1.20.2
cilium_namespace: kube-system
cilium_values:
  operator:
    replicas: 1
  kubeProxyReplacement: true
  l2announcements:
    enabled: true
  k8sServiceHost: "{{ cilium_k8s_service_host }}"
  k8sServicePort: "{{ cilium_k8s_service_port }}"
  hubble:
    relay:
      enabled: true
    ui:
      enabled: true
