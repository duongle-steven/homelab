k3s_version: v1.37.1+k3s1
k3s_config_file: /etc/rancher/k3s/config.yaml
k3s_token_file: /etc/rancher/node/password
k3s_service_file: /etc/systemd/system/k3s.service
k3s_data_dir: /var/lib/rancher/k3s
k3s_kubeconfig_file: /etc/rancher/k3s/k3s.yaml
# Keep in sync with gateway_api_version in infra/_modules/k3d/main.tf (sandbox)
gateway_api_version: v1.6.3
# k3s's own networking (Flannel, kube-proxy, ServiceLB, network policy), like upstream nixos;
# Istio serves the Gateways, Rook Ceph the storage
k3s_server_config:
  tls-san:
    - "{{ control_plane_endpoint }}"
  disable:
    - local-storage
    - traefik
    # k3s's packaged Gateway API CRDs (an older release); roles/k3s installs the latest
    - gateway-api-crd
  disable-helm-controller: true
  secrets-encryption: true
  # Control plane metrics for kube-prometheus-stack
  etcd-expose-metrics: true
  kube-controller-manager-arg:
    - bind-address=0.0.0.0
  kube-scheduler-arg:
    - bind-address=0.0.0.0
  kube-proxy-arg:
    - metrics-bind-address=0.0.0.0
