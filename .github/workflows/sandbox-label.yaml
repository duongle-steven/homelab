# On request: a pull request into anything but master labelled sandbox runs what make dev would run for it (its base
# to its head). A new commit does not rerun it (remove the label and add it again), except on Renovate's own labelled
# pull requests (its bot, platform/renovate's gitAuthor), which nobody tests by hand. Not required by any ruleset.
name: sandbox-label

on:
  pull_request:
    branches-ignore: [master]
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  # Only another sandbox label, or Renovate's new commit, replaces a running check: other labels and other people's
  # commits get their own (skipped) group
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'synchronize'
    && (github.event.pull_request.user.login == 'duongle-lab-renovate[bot]' && 'sandbox' || github.run_id)
    || github.event.label.name }}
  cancel-in-progress: true

jobs:
  sandbox-label:
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'sandbox'
      || github.event.action == 'synchronize' && github.event.pull_request.user.login == 'duongle-lab-renovate[bot]'
      && contains(github.event.pull_request.labels.*.name, 'sandbox')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the scope diffs against the base
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31.11.2
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: false  # only runs on dev save (sandbox.yaml, checks.yaml)
      - uses: ./.github/actions/sandbox
        with:
          make-args: base=${{ github.event.pull_request.base.sha }}
