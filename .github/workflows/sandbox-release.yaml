# A release: every pull request into master runs the whole suite in a fresh sandbox, and the ruleset
# protect-master-sandbox requires this job's check "sandbox". Labels never trigger it (a label event would replace a
# running check with a skipped one, which counts as passing); a pull request retargeted to master gets it from
# sandbox-retarget.yaml. No other job may be named sandbox.
name: sandbox-release

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # A new commit replaces the running check
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31.11.2
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: false  # only runs on dev save (sandbox.yaml, checks.yaml)
      - uses: ./.github/actions/sandbox
        with:
          make-args: scope=full
