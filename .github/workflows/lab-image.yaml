# lab's image for the scheduled rotation (platform/secrets-rotation), from master when cli/ changes: one short build
# per release, tagged with the commit; platform/secrets-rotation/values.yaml pins it by digest, set by hand after
# the release (docs/how-to-guides/secrets-rotation.md). Signed keyless (this workflow's GitHub OIDC identity, no key
# kept) with its SBOM attested: production's Kyverno checks both (system/kyverno, docs/how-to-guides/supply-chain.md)
name: lab-image

on:
  push:
    branches: [master]
    paths: [cli/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write  # cosign's keyless signature: Sigstore's certificate for this workflow's identity

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lab-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: build
        with:
          context: cli
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/homelab-lab:${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/homelab-lab@${{ steps.build.outputs.digest }}
          syft-version: v1.55.0
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: sign and attest the SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/homelab-lab@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"
