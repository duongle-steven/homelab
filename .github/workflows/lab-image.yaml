# lab's image for the scheduled rotation (platform/secrets-rotation), from master when cli/ changes: one short build
# per release, tagged with the commit; platform/secrets-rotation/values.yaml pins it by digest, set by hand after
# the release (docs/how-to-guides/secrets-rotation.md)
name: lab-image

on:
  push:
    branches: [master]
    paths: [cli/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lab-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: cli
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/homelab-lab:${{ github.sha }}
