ignore: |
  templates/
  mkdocs.yml
  .direnv/
  site/
  .terragrunt-cache/
  # Upstream's manifests, vendored unchanged (csi-driver-host-path)
  system/csi-hostpath/files/
  # kube-bench's benchmark, vendored unchanged from its main branch
  test/kube-bench-cfg/

extends: default

rules:
  document-start: disable
  line-length: disable
  # GitHub Actions' "on:" key
  truthy:
    check-keys: false
