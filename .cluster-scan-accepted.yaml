  resources:
    - ids: [C-0012, C-0259]
      resources:
        - argocd/ConfigMap/argocd-cm
        - forgejo/Deployment/forgejo
        - woodpecker/StatefulSet/woodpecker-agent
        - istio-system/ConfigMap/istio-cni-config
        - monitoring-system/ConfigMap/prometheus-monitoring-system-kube-pro-prometheus-rulefiles-0
        - openbao/ConfigMap/openbao-config
        - trivy-operator/ConfigMap/trivy-operator-config
      reason: >-
        C-0012 matches key names only. Read 2026-11-05: argocd-cm's application.instanceLabelKey is a label name and its oidc clientSecret a $reference; forgejo's env is GITEA_ADMIN_PASSWORD_MODE (a mode, the password comes from a Secret); woodpecker-agent's is WOODPECKER_BACKEND_K8S_ALLOW_NATIVE_SECRETS (a boolean); istio-cni-config's REPAIR_BROKEN_POD_LABEL_KEY is a label; Prometheus's rule file only talks about secrets; openbao-config's current_key is a file:// reference and its key id no key; trivy-operator-config's keys are switches and an empty list
    - ids: [C-0002, C-0015, C-0035, C-0063, C-0065, C-0185, C-0186, C-0187, C-0188, C-0191, C-0278, C-0279, C-0280, C-0281, C-0282]
      resources:
        - /ClusterRoleBinding/cluster-admin
        - /ClusterRoleBinding/system:controller:*
        - /ClusterRoleBinding/system:kube-controller-manager
        - /ClusterRoleBinding/kube-apiserver-kubelet-admin
        - kube-system/RoleBinding/system:controller:*
      reason: >-
        Kubernetes' and k3s's own bindings
    - ids: [C-0262]
      resources:
        - /ClusterRoleBinding/system:public-info-viewer
      reason: >-
        Kubernetes's default: anyone may read /healthz, /livez, /readyz and /version, nothing else
    - ids: [C-0002, C-0015, C-0035, C-0063, C-0065, C-0186, C-0187, C-0188, C-0191, C-0267, C-0272, C-0278, C-0279, C-0280, C-0281, C-0282]
      resources:
        - /ClusterRoleBinding/argocd-application-controller
        - argocd/RoleBinding/argocd-application-controller
        - argocd/StatefulSet/argocd-application-controller
      reason: >-
        Argo CD applies every component, so its controller holds everything, like the upstream chart; a person reaches it only through Kanidm and its RBAC
    - ids: [C-0002, C-0015, C-0186, C-0267, C-0279, C-0281]
      resources:
        - /ClusterRoleBinding/argocd-server
        - /ClusterRoleBinding/argocd-notifications-controller
        - argocd/RoleBinding/argocd-*
        - argocd/Deployment/argocd-*
      reason: >-
        Argo CD's other parts, as the upstream chart gives them: its server lists and deletes what the UI shows, the others read their own namespace's Secrets
    - ids: [C-0002, C-0015, C-0186, C-0188, C-0267, C-0279, C-0281, C-0282]
      resources:
        - /ClusterRoleBinding/cert-manager-*
        - cert-manager/RoleBinding/cert-manager-*
        - cert-manager/RoleBinding/trust-manager
        - cert-manager/Deployment/cert-manager*
        - cert-manager/Deployment/trust-manager
        - /ClusterRoleBinding/external-secrets-*
        - external-secrets/Deployment/external-secrets*
        - /ClusterRoleBinding/cloudnative-pg
        - cloudnative-pg/Deployment/cloudnative-pg
        - /ClusterRoleBinding/kanidm-kaniop
        - kanidm/RoleBinding/kanidm-kaniop-*
        - kanidm/Deployment/kanidm-kaniop
        - /ClusterRoleBinding/monitoring-system-kube-pro-operator
        - monitoring-system/Deployment/monitoring-system-kube-pro-operator
        - /ClusterRoleBinding/istiod-clusterrole-istio-system
        - /ClusterRoleBinding/istio-reader-clusterrole-istio-system
        - istio-system/RoleBinding/istiod
        - istio-system/Deployment/istiod
        - /ClusterRoleBinding/kyverno:admission-controller
        - kyverno/RoleBinding/kyverno:*
        - kyverno/Deployment/kyverno-*
        - /ClusterRoleBinding/trust-manager
        - /ClusterRoleBinding/trivy-operator
        - trivy-operator/RoleBinding/trivy-operator
        - trivy-operator/Deployment/trivy-operator
      reason: >-
        An operator's work is to read and write Secrets or create pods in other namespaces, as its upstream chart binds it: cert-manager, ESO (it reads every Secret, which is why no internet token lives there: step 6d-2), CloudNativePG, kaniop, the Prometheus Operator, Istio, Kyverno, trust-manager and the Trivy Operator
    - ids: [C-0015, C-0186, C-0267]
      resources:
        - forgejo/RoleBinding/forgejo-db
        - forgejo/Pod/forgejo-db-*
      reason: >-
        CloudNativePG's instance reads its own namespace's Secrets
    - ids: [C-0278]
      resources:
        - /ClusterRoleBinding/csi-hostpathplugin-provisioner-cluster-role
        - /ClusterRoleBinding/csi-provisioner-role
      reason: >-
        Provisioning volumes is its work; sandbox only (system/csi-hostpath)
    - ids: [C-0063]
      resources:
        - istio-system/RoleBinding/kiali-portforward
      reason: >-
        Kiali's read-only role lets it open port-forwards to Istio's pods, as it needs for its debug views; admins only
    - ids: [C-0188, C-0267]
      resources:
        - woodpecker/RoleBinding/woodpecker-agent
        - woodpecker/StatefulSet/woodpecker-agent
      reason: >-
        Woodpecker's agent creates a step's pods in its own namespace, which is how it runs pipelines; those pods are unprivileged (step 10e)
    - ids: [C-0002]
      resources:
        - ntfy/RoleBinding/secrets-rotation
      reason: >-
        Rotation restarts ntfy's readers through exec, in its namespace only (step 11b)
    - ids: [C-0016, C-0045, C-0048, C-0057]
      resources:
        - csi-hostpath/StatefulSet/csi-hostpathplugin
      reason: >-
        csi-driver-host-path is privileged with a host path by its design; sandbox only (system/csi-hostpath)
    - ids: [C-0016, C-0045, C-0046, C-0048, C-0057]
      resources:
        - istio-system/DaemonSet/istio-cni-node
        - istio-system/DaemonSet/ztunnel
      reason: >-
        istio-cni and ztunnel set up each pod's network from the node: the mesh's design
    - ids: [C-0016, C-0045, C-0048]
      resources:
        - loki/DaemonSet/loki-alloy
      reason: >-
        Alloy reads pod and audit logs read-only; only its own /var/lib/alloy is writable, for its read positions (step 9)
    - ids: [C-0016, C-0038, C-0041, C-0048, C-0275]
      resources:
        - monitoring-system/DaemonSet/monitoring-system-prometheus-node-exporter
      reason: >-
        node-exporter reads the node's host network, PID space and root: what it measures
    - ids: [C-0016, C-0044, C-0046]
      resources:
        - kube-system/DaemonSet/svclb-*
      reason: >-
        ServiceLB's pod needs NET_ADMIN and a host port to serve the Gateway on the node; sandbox only (it is off on the nodes)
    - ids: [C-0016]
      resources:
        - kanidm/StatefulSet/kanidm-default
      reason: >-
        kaniop creates the StatefulSet and sets no container securityContext; its PolicyException says why (platform/kanidm)
    - ids: [C-0016, C-0256]
      resources:
        - zot/StatefulSet/zot
      reason: >-
        zot's PolicyException says why it lacks the setting (platform/zot), and the registry is meant to be on the Gateway
    - ids: [C-0256]
      resources:
        - istio-system/Deployment/gateway-istio
      reason: >-
        The LAN Gateway is what is meant to face outside (Istio serves it)
    - ids: [C-0278]
      resources:
        - /ClusterRoleBinding/velero-server
      reason: >-
        Velero's own ClusterRole (system/velero/templates/rbac.yaml, step 15d, instead of cluster-admin): a restore
        creates claims, never volumes (the CSI provisioner makes them); TestBackupRestore proves it needs no more
    - ids: [C-0002, C-0015, C-0035, C-0063, C-0065, C-0186, C-0187, C-0188, C-0191, C-0278, C-0279, C-0280, C-0281, C-0282]
      resources:
        - velero/RoleBinding/velero-server
      reason: >-
        The chart's Role, everything in Velero's own namespace only: its data mover's pods, its credentials and its
        kinds live there
    - ids: [C-0267, C-0272]
      resources:
        - velero/Deployment/velero
        - velero/DaemonSet/node-agent
        - velero/Job/*-kopia-maintain-job-*
      reason: >-
        Velero's workloads hold the roles above: they must create pods and volumes to move data
    - ids: [C-0307]
      resources:
        - kyverno/Job/kyverno-migrate-resources
      reason: >-
        The chart's post-upgrade hook, which Argo CD runs after a sync: it completes, then its ServiceAccount, a hook
        too, is deleted, and the finished Job stays
