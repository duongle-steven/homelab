# Sandbox cluster: one k3s server with k3s's own networking (Flannel, kube-proxy, ServiceLB, network policy),
# like production; Istio serves the Gateways (system/istio-system). No host port mapping: under WSL mirrored
# networking Windows cannot reach ports Docker publishes, so the proxy in main.tf forwards localhost instead.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: homelab-dev
servers: 1
agents: 0
# A fixed Docker network: infra/sandbox/cluster/config.json names its router and prefix (system/egress opens the
# API server on the node network)
subnet: 172.28.0.0/16
image: rancher/k3s:v1.37.1-k3s1
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: [server:*]
      # k3s 1.37 packages Gateway API v1.6.1 CRDs; ours (main.tf) are the latest release
      - arg: --disable=gateway-api-crd
        nodeFilters: [server:*]
      # Volumes come from csi-driver-host-path (system/csi-hostpath), which has CSI snapshots like Ceph in production;
      # a claim made before it runs waits for its default StorageClass
      - arg: --disable=local-storage
        nodeFilters: [server:*]
      # Embedded etcd, like production
      - arg: --cluster-init
        nodeFilters: [server:*]
      # Control plane metrics like production (system/monitoring-system scrapes them by node discovery)
      - arg: --etcd-expose-metrics
        nodeFilters: [server:*]
      - arg: --kube-controller-manager-arg=bind-address=0.0.0.0
        nodeFilters: [server:*]
      - arg: --kube-scheduler-arg=bind-address=0.0.0.0
        nodeFilters: [server:*]
      - arg: --kube-proxy-arg=metrics-bind-address=0.0.0.0
        nodeFilters: [server:*]
      # The API server's audit log (metal/roles/k3s/files/audit-policy.yaml, mounted by main.tf), which Alloy sends to
      # Loki (system/loki); the server rotates it, Loki keeps it
      - arg: --kube-apiserver-arg=audit-policy-file=/etc/rancher/k3s/audit-policy.yaml
        nodeFilters: [server:*]
      - arg: --kube-apiserver-arg=audit-log-path=/var/log/kubernetes/audit/audit.log
        nodeFilters: [server:*]
      - arg: --kube-apiserver-arg=audit-log-maxsize=100
        nodeFilters: [server:*]
      - arg: --kube-apiserver-arg=audit-log-maxbackup=3
        nodeFilters: [server:*]
      # An event over 100KiB (a large CRD's body) keeps who and what without its bodies: Loki refuses a line over 256KB
      - arg: --kube-apiserver-arg=audit-log-truncate-enabled=true
        nodeFilters: [server:*]
      - arg: --kube-apiserver-arg=audit-log-truncate-max-event-size=102400
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
