openbao:
  injector:
    enabled: false
  ui:
    enabled: false
  server:
    image:
      tag: 2.7.1
    # The chart's OnDelete would leave the running pod on the old image and config after a sync
    updateStrategyType: RollingUpdate
    dataStorage:
      size: 1Gi
      # Not copied as files: its hourly raft snapshot (openbao-snapshots) is the consistent copy
      # (docs/how-to-guides/backup-and-restore.md)
      labels:
        homelab/backup: none
    # OpenTofu's unit infra/<env>/openbao writes this Secret; the pod waits for it
    volumes:
      - name: unseal
        secret:
          secretName: openbao-unseal
    volumeMounts:
      - name: unseal
        mountPath: /openbao/unseal
        readOnly: true
    standalone:
      enabled: true
      # The chart passes this through Helm's tpl: OpenBao's own template (policy apps) is wrapped in {{` `}}.
      # Self-initialisation runs once, on an empty storage; changing it later needs the admin role
      # (docs/concepts/secrets-management.md). HOSTNAME is replaced by the pod name at start.
      config: |
        ui = false
        disable_mlock = true

        # Plain HTTP: ztunnel's mTLS carries every connection inside the mesh
        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable     = true
        }

        storage "raft" {
          path    = "/openbao/data"
          node_id = "HOSTNAME"
        }

        seal "static" {
          current_key_id = "homelab-1"
          current_key    = "file:///openbao/unseal/key"
        }

        initialize "mounts" {
          request "kv" {
            operation = "update"
            path      = "sys/mounts/secret"
            data = {
              type    = "kv"
              options = { version = "2" }
            }
          }
          request "kubernetes" {
            operation = "update"
            path      = "sys/auth/kubernetes"
            data      = { type = "kubernetes" }
          }
          request "kubernetes-config" {
            operation = "update"
            path      = "auth/kubernetes/config"
            data      = { kubernetes_host = "https://kubernetes.default.svc" }
          }
          # Its accessor names the namespace in policy apps
          request "kubernetes-read" {
            operation = "read"
            path      = "sys/auth/kubernetes"
          }
        }

        initialize "policies" {
          # A namespace's default service account reads its own branch, secret/<namespace>/
          request "apps" {
            operation = "update"
            path      = "sys/policies/acl/apps"
            data = {
              policy = {
                eval_type   = "string"
                eval_source = "template"
                template    = "{{`path \"secret/data/{{ \"{{\" }}identity.entity.aliases.{{ (index .responses.mounts \"kubernetes-read\").data.accessor }}.metadata.service_account_namespace{{ \"}}\" }}/*\" { capabilities = [\"read\"] }`}}"
              }
            }
          }
          # platform/generated-secrets pushes generated secrets, only to secret/<namespace>/generated/: it never reaches what
          # others write (OpenTofu, step 8b). External Secrets reads a path and its metadata before it writes them, so
          # the writer reads too; IfNotExists keeps existing values. No delete
          request "writer" {
            operation = "update"
            path      = "sys/policies/acl/writer"
            data = {
              policy = "path \"secret/data/+/generated/*\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/+/generated/*\" { capabilities = [\"create\", \"read\", \"update\"] }"
            }
          }
          # OpenTofu's secrets (platform/infra-secrets): every branch except what platform/generated-secrets generates.
          # The allow uses + too: OpenBao picks the highest-priority matching path, and secret/data/* would outrank
          # the longer deny (fewer + segments)
          request "infra" {
            operation = "update"
            path      = "sys/policies/acl/infra"
            data = {
              policy = "path \"secret/data/+/*\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/+/*\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/data/+/generated/*\" { capabilities = [\"deny\"] }\npath \"secret/metadata/+/generated/*\" { capabilities = [\"deny\"] }"
            }
          }
          # The hourly raft snapshot (templates/snapshot.yaml): reads the snapshot, nothing else
          request "snapshot" {
            operation = "update"
            path      = "sys/policies/acl/snapshot"
            data = {
              policy = "path \"sys/storage/raft/snapshot\" { capabilities = [\"read\"] }"
            }
          }
          # The scheduled rotation (platform/secrets-rotation): the values of the catalog's entries with a period
          # (cli/internal/rotate/catalog.yaml; lab secrets check compares them) and their creation time, their rotation
          # records and pending values, and every record's metadata (an interrupted rotation by command is reported).
          # Never Forgejo's admin password: Forgejo's tokens rotate from the workstation (it reaches ops/homelab)
          request "rotator" {
            operation = "update"
            path      = "sys/policies/acl/rotator"
            data = {
              policy = "path \"secret/data/woodpecker/generated/agent\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/woodpecker/generated/agent\" { capabilities = [\"read\"] }\npath \"secret/data/woodpecker/admin-token\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/woodpecker/admin-token\" { capabilities = [\"read\"] }\npath \"secret/data/zot/generated/ci\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/zot/generated/ci\" { capabilities = [\"read\"] }\npath \"secret/data/ntfy/generated/alerts-token\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/ntfy/generated/alerts-token\" { capabilities = [\"read\"] }\npath \"secret/data/monitoring-system/generated/ntfy\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/monitoring-system/generated/ntfy\" { capabilities = [\"read\"] }\npath \"secret/data/ntfy/generated/alerts-password\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/ntfy/generated/alerts-password\" { capabilities = [\"read\"] }\npath \"secret/metadata/rotation/*\" { capabilities = [\"read\"] }\npath \"secret/data/rotation/woodpecker.agent\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/rotation/woodpecker.agent\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/data/rotation/woodpecker.admin-token\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/rotation/woodpecker.admin-token\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/data/rotation/registry.ci\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/rotation/registry.ci\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/data/rotation/ntfy.alerts-token\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/rotation/ntfy.alerts-token\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/data/rotation/ntfy.alerts-password\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"secret/metadata/rotation/ntfy.alerts-password\" { capabilities = [\"create\", \"read\", \"update\"] }"
            }
          }
          # Emergency access: no root token exists
          request "admin" {
            operation = "update"
            path      = "sys/policies/acl/admin"
            data = {
              policy = "path \"*\" { capabilities = [\"create\", \"read\", \"update\", \"patch\", \"delete\", \"list\", \"sudo\"] }"
            }
          }
        }

        # Every role accepts only tokens issued for OpenBao (audience openbao), never ones the API server accepts
        initialize "roles" {
          request "apps" {
            operation = "update"
            path      = "auth/kubernetes/role/apps"
            data = {
              bound_service_account_names      = ["default"]
              bound_service_account_namespaces = ["*"]
              token_policies                   = ["apps"]
              audience                         = "openbao"
              token_ttl                        = "10m"
            }
          }
          request "writer" {
            operation = "update"
            path      = "auth/kubernetes/role/writer"
            data = {
              bound_service_account_names      = ["default"]
              bound_service_account_namespaces = ["generated-secrets"]
              token_policies                   = ["writer"]
              audience                         = "openbao"
              token_ttl                        = "10m"
            }
          }
          request "infra" {
            operation = "update"
            path      = "auth/kubernetes/role/infra"
            data = {
              bound_service_account_names      = ["openbao-infra"]
              bound_service_account_namespaces = ["infra-secrets"]
              token_policies                   = ["infra"]
              audience                         = "openbao"
              token_ttl                        = "10m"
            }
          }
          request "snapshot" {
            operation = "update"
            path      = "auth/kubernetes/role/snapshot"
            data = {
              bound_service_account_names      = ["openbao-snapshot"]
              bound_service_account_namespaces = ["openbao"]
              token_policies                   = ["snapshot"]
              audience                         = "openbao"
              token_ttl                        = "5m"
            }
          }
          request "rotator" {
            operation = "update"
            path      = "auth/kubernetes/role/rotator"
            data = {
              bound_service_account_names      = ["secrets-rotation"]
              bound_service_account_namespaces = ["secrets-rotation"]
              token_policies                   = ["rotator"]
              audience                         = "openbao"
              token_ttl                        = "1h"
            }
          }
          request "admin" {
            operation = "update"
            path      = "auth/kubernetes/role/admin"
            data = {
              bound_service_account_names      = ["openbao-admin"]
              bound_service_account_namespaces = ["openbao"]
              token_policies                   = ["admin"]
              audience                         = "openbao"
              token_ttl                        = "1h"
            }
          }
        }
# The hourly raft snapshot into its own volume, the one Velero copies off-site (templates/snapshot.yaml)
snapshot:
  schedule: "55 * * * *"
  # The server's image (openbao.server.image.tag), for its bao CLI
  image: quay.io/openbao/openbao:2.7.1
