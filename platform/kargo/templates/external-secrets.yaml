# Kargo's shared credentials (values.yaml's sharedResources: this namespace), matched by repository URL prefix.
# Forgejo's ops/releases as user kargo (lab infra forgejo sync writes the token)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-forgejo
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: http://forgejo-http.forgejo:3000/ops/releases
        username: {{ `"{{ .username }}"` }}
        password: {{ `"{{ .token }}"` }}
  data:
    - secretKey: username
      remoteRef:
        key: kargo/forgejo-token
        property: username
    - secretKey: token
      remoteRef:
        key: kargo/forgejo-token
        property: token
---
# zot as its read-only user puller (platform/generated-secrets' registry.puller)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-zot
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      data:
        # Every repository of our zot: Kargo matches a credential's repoURL exactly unless it is a regex
        repoURL: '^registry\.{{ .Values.global.baseDomain | replace "." "\\." }}/'
        repoURLIsRegex: "true"
        username: puller
        password: {{ `"{{ .password }}"` }}
  data:
    - secretKey: password
      remoteRef:
        key: kargo/generated/zot-puller
        property: password
