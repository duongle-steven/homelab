# Outside the mesh (the API server calls it): only its webhook port
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kargo-webhooks-server
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kargo
      app.kubernetes.io/component: kubernetes-webhooks-server
  policyTypes:
    - Ingress
  ingress:
    # From anywhere: the API server calls from the nodes' addresses
    - ports:
        - protocol: TCP
          port: 9443
