gitea:
  gatewayAPI:
    core:
      httpRoute:
        hostnames:
          - git.127-0-0-1.nip.io
  gitea:
    config:
      server:
        ROOT_URL: https://git.127-0-0-1.nip.io
      # Small single-pod setup: SQLite and in-memory cache, session and queue
      database:
        DB_TYPE: sqlite3
      cache:
        ADAPTER: memory
      session:
        PROVIDER: memory
      queue:
        TYPE: level
  # One pod at a time: the new pod cannot open SQLite and the queue while the old one holds them
  strategy:
    type: Recreate
    # null removes the chart default; Kubernetes rejects rollingUpdate with Recreate
    rollingUpdate: null
  postgresql-ha:
    enabled: false
  valkey-cluster:
    enabled: false
# The config job migrates upstream's repositories from GitHub, including mirrors owned by a user
# the sandbox does not have
configJob:
  enabled: false
