# The chart's tcpRoute is still v1alpha2
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: gitea-ssh
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: ssh
  rules:
    - backendRefs:
        - name: gitea-ssh
          port: 22
