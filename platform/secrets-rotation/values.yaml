# The daily scheduled rotation (lab secrets rotate --scheduled, docs/how-to-guides/secrets-rotation.md): the catalog's
# entries with a period, never manual or OpenTofu ones
# lab's image, pinned by digest: GitHub Actions builds it from master (.github/workflows/lab-image.yaml). Empty until
# the first release builds it: the CronJob stays suspended meanwhile (CLAUDE.md, before the first production deploy)
image: ""
# The environment lab rotates (catalog entries of another one are left alone)
env: production
# 03:00 in global.timezone: an hour after Velero's daily backup, which the rotation wants from the last 24 hours
schedule: "0 3 * * *"
# What the scheduled entries' readers are, by namespace: the rotation may patch only these ExternalSecrets (refresh) and
# workloads (rolling restart), exec into the pods of `exec`, and list the pods of `idle` (an entry's idle wait). lab
# secrets check compares this with the catalog (cli/internal/rotate/catalog.yaml)
readers:
  monitoring-system:
    externalSecrets: [ntfy]
  ntfy:
    externalSecrets: [ntfy-auth]
    deployments: [ntfy]
    # ntfy denies callers outside the mesh: the new token is checked from its own pod
    exec: true
  # registry.ci: the golden path's push (platform/ci); its idle wait lists the steps' pods
  ci:
    externalSecrets: [registry]
    idle: true
  zot:
    externalSecrets: [zot-auth]
    statefulsets: [zot]
