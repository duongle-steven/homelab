# What the scheduled rotation may touch, and nothing else: its locks here, OpenBao through the API server's proxy
# (role rotator decides the paths) and Velero's backups (the backup check). Its access to each reader's namespace
# (refresh, rolling restart, wait) is that namespace's own: system/secret-store's rotationReaders
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-rotation
  namespace: {{ .Release.Namespace }}
{{- define "secrets-rotation.binding" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-rotation
  namespace: {{ .namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secrets-rotation
subjects:
  - kind: ServiceAccount
    name: secrets-rotation
    namespace: {{ .from }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-rotation
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, delete]
{{- include "secrets-rotation.binding" (dict "namespace" .Release.Namespace "from" .Release.Namespace) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-rotation
  namespace: openbao
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["http:openbao:8200"]
    verbs: [get, create, update]
{{- include "secrets-rotation.binding" (dict "namespace" "openbao" "from" .Release.Namespace) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-rotation
  namespace: velero
rules:
  - apiGroups: [velero.io]
    resources: [backups]
    verbs: [get, list]
{{- include "secrets-rotation.binding" (dict "namespace" "velero" "from" .Release.Namespace) }}
---
# Which readers' namespaces exist (lab leaves the others out of a rotation): the only cluster-wide read
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-rotation-namespaces
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-rotation-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-rotation-namespaces
subjects:
  - kind: ServiceAccount
    name: secrets-rotation
    namespace: {{ .Release.Namespace }}

