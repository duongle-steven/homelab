# Pod Security restricted (system/kyverno) does not hold here: each exception says why in homelab/reason
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: woodpecker
  namespace: {{ .Release.Namespace }}
  annotations:
    # Its CRD comes from system/kyverno, which may sync later (a fresh cluster): apply the rest and retry this
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    homelab/reason: "Woodpecker's server and agent images run as root (no USER); its step pods run in user namespaces"
spec:
  policyRefs:
    - {name: require-run-as-nonroot, kind: ValidatingPolicy}
  matchConditions:
    - name: woodpecker
      expression: "object.metadata.namespace == '{{ .Release.Namespace }}' && (object.metadata.name.startsWith('woodpecker-server') || object.metadata.name.startsWith('woodpecker-agent'))"
