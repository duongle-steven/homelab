apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-secret
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  data:
    - secretKey: WOODPECKER_FORGEJO_CLIENT
      remoteRef:
        key: woodpecker/forgejo
        property: client_id
    - secretKey: WOODPECKER_FORGEJO_SECRET
      remoteRef:
        key: woodpecker/forgejo
        property: client_secret
    - secretKey: WOODPECKER_AGENT_SECRET
      remoteRef:
        key: woodpecker/generated/agent
        property: secret
---
# The agents read only the agent secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-agent
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  data:
    - secretKey: WOODPECKER_AGENT_SECRET
      remoteRef:
        key: woodpecker/generated/agent
        property: secret
