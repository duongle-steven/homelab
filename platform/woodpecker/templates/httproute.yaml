# The woodpecker chart has no Gateway API support
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: woodpecker-server
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - {{ .Values.route.hostname }}
  rules:
    - backendRefs:
        - name: woodpecker-server
          port: 80
