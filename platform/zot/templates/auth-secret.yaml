apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-auth
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: zot-auth
    template:
      engineVersion: v2
      data:
        htpasswd: "{{ `{{ htpasswd \"ci\" .ci_password \"bcrypt\" }}` }}"
  data:
    - secretKey: ci_password
      remoteRef:
        key: registry.ci
        property: password
