apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-auth
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: zot-auth
    template:
      engineVersion: v2
      data:
        htpasswd: "{{ `{{ htpasswd \"ci\" .ci_password \"bcrypt\" }}` }}"
  data:
    - secretKey: ci_password
      remoteRef:
        key: zot/ci
        property: password
