zot:
  httproute:
    hostnames:
      - registry.127-0-0-1.nip.io
  config:
    http:
      externalUrl: https://registry.127-0-0-1.nip.io
      auth:
        openid:
          providers:
            oidc:
              issuer: https://dex.127-0-0-1.nip.io
  # Trust the sandbox CA for calls to Dex
  env:
    - name: SSL_CERT_DIR
      value: /etc/ssl/certs:/etc/homelab-dev-ca
  extraVolumes:
    - name: dev-ca
      configMap:
        name: homelab-dev-ca
        optional: true
  extraVolumeMounts:
    - name: dev-ca
      mountPath: /etc/homelab-dev-ca
      readOnly: true
