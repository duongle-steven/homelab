# Host label: <host>.<global.baseDomain>
host: registry
zot:
  # templates/httproute.yaml: the chart's route does not template its host names
  httproute:
    enabled: false
  persistence: true
  pvc:
    create: true
    storage: 10Gi
  # zot reads config.json from the ConfigMap templates/config.yaml renders from config: below
  mountConfig: true
  configFiles:
    config.json: null
  externalSecrets:
    - secretName: zot-auth
      mountPath: /secret/zot-auth
# zot's config.json, templated (templates/config.yaml)
config:
  distSpecVersion: "1.1.1"
  storage:
    rootDirectory: /var/lib/registry
  http:
    address: 0.0.0.0
    port: "5000"
    externalUrl: https://{{ .Values.host }}.{{ .Values.global.baseDomain }}
    auth:
      # Machine account for CI
      htpasswd:
        path: /secret/zot-auth/htpasswd
      # People log in to the UI through Kanidm and create API keys for docker/crane
      apikey: true
      openid:
        providers:
          oidc:
            name: Kanidm
            issuer: https://auth.{{ .Values.global.baseDomain }}/oauth2/openid/zot
            # Public client: no secret, zot uses PKCE
            clientid: zot
            scopes:
              - openid
              - profile
              - email
              - groups
            claimMapping:
              username: preferred_username
              groups: homelab_groups
    accessControl:
      repositories:
        "**":
          policies:
            - groups: [homelab-admins]
              actions: [read, create, update, delete]
            - groups: [homelab-editors]
              actions: [read, create, update]
            - groups: [homelab-users]
              actions: [read]
            - users: [ci]
              actions: [read, create, update]
          defaultPolicy: []
  log:
    level: info
  extensions:
    search:
      enable: true
    ui:
      enable: true
