dex:
  config:
    issuer: https://dex.127-0-0-1.nip.io
    connectors:
      - type: oidc
        id: kanidm
        name: Kanidm
        config:
          clientID: $KANIDM_CLIENT_ID
          clientSecret: $KANIDM_CLIENT_SECRET
          redirectURI: https://dex.127-0-0-1.nip.io/callback
          issuer: https://auth.127-0-0-1.nip.io/oauth2/openid/dex
          pkceChallenge: S256
          insecureEnableGroups: true
          getUserInfo: true
          overrideClaimMapping: true
          claimMapping:
            groups: homelab_groups
          # The sandbox CA, distributed by trust-manager
          rootCAs:
            - /etc/dex/dev-ca/ca.crt
          scopes:
            - openid
            - profile
            - email
            - groups
    staticClients:
      - id: grafana-sso
        name: Grafana
        redirectURIs:
          - 'https://grafana.127-0-0-1.nip.io/login/generic_oauth'
        secretEnv: GRAFANA_SSO_CLIENT_SECRET
      - id: argocd
        name: Argo CD
        redirectURIs:
          - 'https://argocd.127-0-0-1.nip.io/auth/callback'
        secretEnv: ARGOCD_CLIENT_SECRET
      - id: zot
        name: Registry
        redirectURIs:
          - 'https://registry.127-0-0-1.nip.io/zot/auth/callback/oidc'
        secretEnv: ZOT_CLIENT_SECRET
      - id: smoke
        name: Smoke test
        redirectURIs:
          - 'https://smoke.127-0-0-1.nip.io/callback'
        secretEnv: SMOKE_CLIENT_SECRET
  volumes:
    - name: dev-ca
      configMap:
        name: homelab-dev-ca
        optional: true
  volumeMounts:
    - name: dev-ca
      mountPath: /etc/dex/dev-ca
      readOnly: true
  httpRoute:
    hostnames:
      - dex.127-0-0-1.nip.io
kanidmClient:
  dexHost: dex.127-0-0-1.nip.io
smokeClient: true
