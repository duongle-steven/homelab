dex:
  config:
    issuer: https://dex.khuedoan.com
    storage:
      type: kubernetes
      config:
        inCluster: true
    oauth2:
      skipApprovalScreen: true
    connectors:
      - type: oidc
        id: kanidm
        name: Kanidm
        config:
          clientID: $KANIDM_CLIENT_ID
          clientSecret: $KANIDM_CLIENT_SECRET
          redirectURI: https://dex.khuedoan.com/callback
          issuer: https://auth.khuedoan.com/oauth2/openid/dex
          pkceChallenge: S256
          insecureEnableGroups: true
          getUserInfo: true
          overrideClaimMapping: true
          claimMapping:
            groups: homelab_groups
          scopes:
            - openid
            - profile
            - email
            - groups
    staticClients:
      - id: grafana-sso
        name: Grafana
        redirectURIs:
          - 'https://grafana.khuedoan.com/login/generic_oauth'
        secretEnv: GRAFANA_SSO_CLIENT_SECRET
      - id: argocd
        name: Argo CD
        redirectURIs:
          - 'https://argocd.khuedoan.com/auth/callback'
        secretEnv: ARGOCD_CLIENT_SECRET
      - id: zot
        name: Registry
        redirectURIs:
          - 'https://registry.khuedoan.com/zot/auth/callback/oidc'
        secretEnv: ZOT_CLIENT_SECRET
  envFrom:
    - secretRef:
        name: dex-secrets
    # Created by kaniop from templates/kanidm-client.yaml
    - secretRef:
        name: dex-kanidm-oauth2-credentials
  httpRoute:
    enabled: true
    parentRefs:
      - name: homelab
        namespace: gateway
        sectionName: https
    hostnames:
      - dex.khuedoan.com
kanidmClient:
  dexHost: dex.khuedoan.com
# Sandbox-only client used by the identity tests
smokeClient: false
