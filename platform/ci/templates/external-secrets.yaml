{{- /* The CI's secrets, from OpenBao (docs/how-to-guides/ci.md, cli/internal/rotate/catalog.yaml) */ -}}
{{- range $s := list
  (dict "name" "webhook" "key" "ci/generated/webhook" "property" "token" "as" "token")
  (dict "name" "forgejo" "key" "ci/forgejo-token" "property" "token" "as" "token")
  (dict "name" "registry" "key" "ci/generated/registry" "property" "password" "as" "password") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: {{ $s.name }}
    {{- if eq $s.name "registry" }}
    # zot's machine account (platform/zot's htpasswd user ci)
    template:
      engineVersion: v2
      data:
        username: ci
        password: "{{ `{{ .password }}` }}"
    {{- end }}
  data:
    - secretKey: {{ $s.as }}
      remoteRef:
        key: {{ $s.key }}
        property: {{ $s.property }}
{{- end }}
