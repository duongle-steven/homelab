# The CI's secrets, from OpenBao (docs/how-to-guides/ci.md, cli/internal/rotate/catalog.yaml)
# Org ci's webhook secret, which the EventSource checks (Authorization: Bearer)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webhook
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: webhook
  data:
    - secretKey: token
      remoteRef:
        key: ci/generated/webhook
        property: token
---
# ci-bot's Forgejo token: clones and commit statuses (lab infra forgejo sync)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: forgejo
  data:
    - secretKey: token
      remoteRef:
        key: ci/forgejo-token
        property: token
---
# zot's machine account ci (platform/zot's htpasswd user ci), which pushes the golden path's images
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: registry
    template:
      engineVersion: v2
      data:
        username: ci
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: ci/generated/registry
        property: password
