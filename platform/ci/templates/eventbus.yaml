apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
spec:
  jetstream:
    version: {{ .Values.eventBus.version | quote }}
    replicas: {{ .Values.eventBus.replicas }}
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerTemplate:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
    reloaderContainerTemplate:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
    metricsContainerTemplate:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
