# Renovate on GitHub as our App duongle-lab-renovate (docs/how-to-guides/renovate.md); production only. The IDs are
# not secrets: ESO's GithubAccessToken generator needs them as literals.
githubApp:
  appID: "5406416"
  installationID: "173635875"
renovate:
  image:
    tag: 44.172.0
  cronjob:
    schedule: '0 5 * * *'
    # The chart cannot read global.timezone (like kured): keep it equal to config.json's timezone
    timeZone: Asia/Ho_Chi_Minh
    concurrencyPolicy: Forbid
  renovate:
    config: |
      {
        "platform": "github",
        "autodiscover": true,
        "autodiscoverFilter": ["duongle-steven/*"],
        "onboarding": false,
        "requireConfig": "required",
        "gitAuthor": "duongle-lab-renovate[bot] <345657674+duongle-lab-renovate[bot]@users.noreply.github.com>"
      }
  existingSecret: renovate-secret
