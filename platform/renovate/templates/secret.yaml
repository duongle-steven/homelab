apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.renovate.existingSecret }}
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        RENOVATE_TOKEN: {{` "{{ .token }}" `}}
        # The chart does not template renovate.config: the endpoint comes from the environment (global.baseDomain)
        RENOVATE_ENDPOINT: https://git.{{ .Values.global.baseDomain }}/api/v1
  data:
    - secretKey: token
      remoteRef:
        key: renovate/forgejo
        property: token
