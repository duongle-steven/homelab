# The App's private key (OpenTofu → infra-secrets → OpenBao renovate/github-app), mounted only by the CronJob's
# initContainer github-token, which mints the run's installation token (values.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: renovate-github-app
  data:
    - secretKey: private-key
      remoteRef:
        key: renovate/github-app
        property: private-key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-github-token
  namespace: {{ .Release.Namespace }}
data:
  github-token.js: |
    {{- .Files.Get "files/github-token.js" | nindent 4 }}
---
# Renovate's pod needs no Kubernetes API: no service account token in it
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
