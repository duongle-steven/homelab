# Backstage's PostgreSQL, one instance, never backed up: the catalog and search rebuild from their sources, but losing
# it also loses the scaffolder's history, people's settings and the locations templates registered (re-register them:
# docs/how-to-guides/backstage.md). A lost volume does not heal a one-instance Cluster: delete the Cluster and Argo CD
# recreates it. CloudNativePG generates the Secret backstage-db-app (owner backstage)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: backstage-db
  namespace: {{ .Release.Namespace }}
  annotations:
    # Before Backstage, which waits for backstage-db-app (as forgejo-db)
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  imageName: {{ .Values.database.image }}
  bootstrap:
    initdb:
      database: backstage
      owner: backstage
  storage:
    size: {{ .Values.database.size }}
  # Rebuilt from git and Kanidm: never backed up
  inheritedMetadata:
    labels:
      homelab/backup: none
---
# The CloudNativePG operator stays out of the ambient mesh (the API server calls its webhooks), but it polls each
# instance's status port in plaintext; strict mTLS would refuse it
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: backstage-db-status
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: backstage-db
  mtls:
    mode: STRICT
  portLevelMtls:
    "8000":
      mode: PERMISSIVE
---
# The CloudNativePG operator (outside the mesh, so no identity) polls the instance's status port, which the
# PeerAuthentication above leaves plaintext: deny-all would refuse it (as platform/forgejo's allow-cnpg-status)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-cnpg-status
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  action: ALLOW
  selector:
    matchLabels:
      cnpg.io/cluster: backstage-db
  rules:
    - to:
        - operation:
            ports: ["8000"]
