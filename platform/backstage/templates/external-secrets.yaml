# Backstage's secrets from OpenBao (platform/generated-secrets; the Forgejo token from lab infra forgejo sync), one
# ExternalSecret each so a rotation refreshes only its own (cli/internal/rotate/catalog.yaml)
{{- range $name, $s := dict
  "backstage-session" (dict "key" "backstage/generated/session-secret" "property" "secret")
  "backstage-backend" (dict "key" "backstage/generated/backend-secret" "property" "secret")
  "backstage-argocd" (dict "key" "backstage/generated/argocd-password" "property" "password")
  "backstage-forgejo" (dict "key" "backstage/forgejo-token" "property" "token") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: {{ $name }}
  data:
    - secretKey: {{ $s.property }}
      remoteRef:
        key: {{ $s.key }}
        property: {{ $s.property }}
{{- end }}
