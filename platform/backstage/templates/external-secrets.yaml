# Backstage's secrets from OpenBao (platform/generated-secrets; the Forgejo token from lab infra forgejo sync), one
# ExternalSecret each so a rotation refreshes only its own (cli/internal/rotate/catalog.yaml)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-session
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: backstage-session
  data:
    - secretKey: secret
      remoteRef:
        key: backstage/generated/session-secret
        property: secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-argocd
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: backstage-argocd
  data:
    - secretKey: password
      remoteRef:
        key: backstage/generated/argocd-password
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-forgejo
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: backstage-forgejo
  data:
    - secretKey: token
      remoteRef:
        key: backstage/forgejo-token
        property: token
