# Environment-specific variables the subchart's list cannot take (Helm replaces lists): in the sandbox, Node trusts its
# local CA (homelab-dev-ca, mounted by values-dev.yaml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-env
  namespace: {{ .Release.Namespace }}
data:
  {{- if .Values.devCA }}
  NODE_EXTRA_CA_CERTS: /etc/homelab-dev-ca/ca.crt
  {{- end }}
