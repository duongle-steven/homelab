# Backstage's directory reader: a Kanidm service account whose read-only API token binds to Kanidm's LDAPS
# (LDAP_BIND_DN dn=token); kaniop keeps the token in Secret backstage-ldap-token (rotation: kanidm.backstage-ldap)
apiVersion: kaniop.rs/v1beta1
kind: KanidmServiceAccount
metadata:
  name: backstage-ldap
  namespace: {{ .Release.Namespace }}
spec:
  kanidmRef:
    name: kanidm
    namespace: kanidm
  apiTokens:
    - label: backstage-ldap
      purpose: readonly
      secretName: backstage-ldap-token
