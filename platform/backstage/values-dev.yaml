# Built from the checkout by just dev (scripts/build-backstage-image) and imported on the node: no registry
backstage:
  backstage:
    image:
      registry: ""
      repository: homelab-backstage
      tag: dev
      digest: ""
      pullPolicy: Never
    resources:
      requests: {cpu: 50m, memory: 384Mi}
      limits: {memory: 768Mi}
    # The sandbox's CA (trust-manager's ConfigMap homelab-dev-ca): Kanidm, Forgejo and Argo CD through the Gateway
    extraVolumes:
      - name: dev-ca
        configMap: {name: homelab-dev-ca, optional: true}
    extraVolumeMounts:
      - {name: dev-ca, mountPath: /etc/homelab-dev-ca, readOnly: true}
devCA: true
database:
  size: 1Gi
