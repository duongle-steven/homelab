kanidm:
  domain: auth.127-0-0-1.nip.io
  # The sandbox CA, distributed by trust-manager; Cilium accepts only a ConfigMap here
  backendCA: homelab-dev-ca
groupMembers:
  homelab-admins: [dev-admin]
  homelab-editors: [dev-editor]
  homelab-users: [dev-viewer]
  homelab-budget: [dev-admin, dev-viewer]
  homelab-documents: [dev-admin, dev-editor]
# Restated (lists are replaced): the sandbox client smoke lives in kanidm
oauth2ClientNamespaces: [argocd, grafana, zot, actualbudget, paperless, forgejo, kanidm]
smokeClient: true
testAccounts:
  - dev-admin
  - dev-editor
  - dev-viewer
  - dev-outsider
