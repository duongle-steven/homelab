kaniop: {}
kanidm:
  # Host label: Kanidm serves auth.<global.baseDomain>
  host: auth
  image: docker.io/kanidm/server:1.11.2
  storage: 1Gi
  # ConfigMap (key ca.crt) that signs Kanidm's certificate; empty trusts the system CAs (Let's Encrypt)
  backendCA: ""
# Only the sandbox sets members: KanidmGroup.members replaces the whole membership,
# and people are added with scripts/onboard-user.
groupMembers: {}
# Sandbox-only test accounts (no personal data)
testAccounts: []
# Namespaces whose KanidmOAuth2Clients kaniop reconciles
oauth2ClientNamespaces: [argocd, grafana, zot, actualbudget, paperless, forgejo, opencloud, kiali]
# Sandbox-only client for the identity tests (templates/smoke-client.yaml)
smokeClient: false
