apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
  namespace: {{ .Release.Namespace }}
spec:
  domain: {{ .Values.kanidm.domain }}
  image: {{ .Values.kanidm.image }}
  replicaGroups:
    - name: default
      replicas: 1
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.kanidm.storage }}
  # Kanidm serves TLS itself (templates/certificate.yaml); the Gateway re-encrypts to it
  tlsSecretName: kanidm-tls
  gateway:
    parentRefs:
      - name: homelab
        namespace: gateway
        sectionName: https
    backendTlsPolicy:
      validation:
        hostname: {{ .Values.kanidm.domain }}
        {{- with .Values.kanidm.backendCA }}
        caCertificateRefs:
          - group: ""
            kind: ConfigMap
            name: {{ . }}
        {{- else }}
        wellKnownCaCertificates: System
        {{- end }}
  # Dex owns its OAuth2 client in its own namespace
  oauth2ClientNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: dex
