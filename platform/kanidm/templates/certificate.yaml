apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kanidm
  namespace: {{ .Release.Namespace }}
spec:
  secretName: kanidm-tls
  dnsNames:
    - {{ .Values.kanidm.host }}.{{ .Values.global.baseDomain }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
