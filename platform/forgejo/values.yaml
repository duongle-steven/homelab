# Host label: <host>.<global.baseDomain>
host: git
database:
  # CloudNativePG cluster forgejo-db (templates/database.yaml); the sandbox uses SQLite
  cnpg:
    enabled: true
    instances: 3
    image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
    size: 10Gi
forgejo:
  fullnameOverride: forgejo
  image:
    # The chart defaults, pinned
    registry: code.forgejo.org
    repository: forgejo/forgejo
    # The chart defaults to the LTS release; the rootless image gets the -rootless suffix
    tag: 16.0.6
  # The chart's test pod uses an unpinned busybox
  test:
    enabled: false
  # One pod: SQLite (sandbox), the repositories volume and the in-memory session cannot be shared
  strategy:
    type: Recreate
    # null removes the chart default; Kubernetes rejects rollingUpdate with Recreate
    rollingUpdate: null
  persistence:
    claimName: forgejo-data
    # Backed up off-site daily (docs/how-to-guides/backup-and-restore.md)
    labels:
      homelab/backup: daily
    size: 10Gi
  httpRoute:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: istio-system
        sectionName: https
    hostnames:
      - git.{{ .Values.global.baseDomain }}
  deployment:
    # Also set in the init container that registers the login source (gitea.oauth below)
    env:
      - name: CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: forgejo-kanidm-oauth2-credentials
            key: CLIENT_SECRET
      - name: HOMELAB_DOMAIN
        valueFrom:
          configMapKeyRef:
            name: forgejo-environment
            key: domain
  # `gitea:` is the Forgejo chart's own key for the app's settings
  gitea:
    admin:
      existingSecret: forgejo-admin
      email: forgejo@local.domain
    oauth:
      - name: Kanidm
        provider: openidConnect
        key: forgejo
        # Expanded by the init script's shell from deployment.env (the chart does not template these)
        secret: ${CLIENT_SECRET}
        autoDiscoverUrl: https://auth.${HOMELAB_DOMAIN}/oauth2/openid/forgejo/.well-known/openid-configuration
        scopes: openid,profile,email,groups
        # Short group names from the client's claimMap (templates/kanidm-client.yaml)
        groupClaimName: homelab_groups
        adminGroup: homelab-admins
        # Woodpecker's org ci (lab infra forgejo sync creates it and team developers): admins own it (org secrets),
        # editors run pipelines; leaving the Kanidm group drops the membership at the next login
        groupTeamMap: '{"homelab-admins": {"ci": ["Owners"]}, "homelab-editors": {"ci": ["developers"]}}'
        groupTeamMapRemoval: true
    config:
      # DOMAIN, ROOT_URL and SSH_DOMAIN: templates/environment.yaml (additionalConfigSources)
      server:
        LANDING_PAGE: explore
        OFFLINE_MODE: true
      service:
        # Accounts come only from Kanidm
        ALLOW_ONLY_EXTERNAL_REGISTRATION: true
        SHOW_REGISTRATION_BUTTON: false
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true
        USERNAME: preferred_username
        ACCOUNT_LINKING: disabled
      repository:
        DISABLED_REPO_UNITS: repo.wiki,repo.projects,repo.packages
        DISABLE_STARS: true
        DEFAULT_BRANCH: master
      service.explore:
        DISABLE_USERS_PAGE: true
      actions:
        ENABLED: false
      webhook:
        ALLOWED_HOST_LIST: private
      database:
        DB_TYPE: postgres
        HOST: forgejo-db-rw:5432
        NAME: forgejo
        USER: forgejo
      cache:
        ADAPTER: memory
      session:
        PROVIDER: memory
      queue:
        TYPE: level
    # FORGEJO__<section>__<key> sets an app.ini setting from an env variable
    additionalConfigSources:
      - configMap:
          name: forgejo-app-ini-server
    additionalConfigFromEnvs:
      - name: FORGEJO__DATABASE__PASSWD
        valueFrom:
          secretKeyRef:
            name: forgejo-db-app
            key: password
