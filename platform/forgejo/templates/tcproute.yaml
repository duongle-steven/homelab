# The chart's tcpRoute is still v1alpha2
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: forgejo-ssh
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: gateway
      namespace: istio-system
      sectionName: ssh
  rules:
    - backendRefs:
        - name: forgejo-ssh
          port: 22
