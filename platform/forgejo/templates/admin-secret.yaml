apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.forgejo.gitea.admin.existingSecret }}
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        username: forgejo_admin
        password: {{` "{{ .password }}" `}}
  data:
    - secretKey: password
      remoteRef:
        key: forgejo/generated/admin
        property: password
