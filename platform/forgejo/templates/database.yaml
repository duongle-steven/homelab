{{- with .Values.database.cnpg }}
{{- if .enabled }}
# CloudNativePG generates the Secret forgejo-db-app (password for the owner forgejo)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Before Forgejo: on a fresh install CloudNativePG's webhook may not answer yet, and a sync that applied the
    # Deployment anyway would wait forever for it to become healthy without forgejo-db-app. An earlier wave fails
    # alone and is retried
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: {{ .instances }}
  imageName: {{ .image }}
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
  storage:
    size: {{ .size }}
  # Its volumes are backed up off-site daily, from the same run as forgejo-data (docs/how-to-guides/backup-and-restore.md)
  inheritedMetadata:
    labels:
      homelab/backup: daily
---
# The CloudNativePG operator stays out of the ambient mesh (the API server calls its webhooks), but it polls each
# instance's status port in plaintext; strict mTLS would refuse it
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: forgejo-db-status
  namespace: {{ $.Release.Namespace }}
  annotations:
    # With forgejo-db, which waits for it to become healthy
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: forgejo-db
  mtls:
    mode: STRICT
  portLevelMtls:
    "8000":
      mode: PERMISSIVE
{{- end }}
{{- end }}
