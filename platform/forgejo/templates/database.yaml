{{- with .Values.database.cnpg }}
{{- if .enabled }}
# CloudNativePG generates the Secret forgejo-db-app (password for the owner forgejo)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: {{ $.Release.Namespace }}
spec:
  instances: {{ .instances }}
  imageName: {{ .image }}
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
  storage:
    size: {{ .size }}
---
# The CloudNativePG operator stays out of the ambient mesh (the API server calls its webhooks), but it polls each
# instance's status port in plaintext; strict mTLS would refuse it
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: forgejo-db-status
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: forgejo-db
  mtls:
    mode: STRICT
  portLevelMtls:
    "8000":
      mode: PERMISSIVE
{{- end }}
{{- end }}
