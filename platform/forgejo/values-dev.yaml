database:
  # One instance: PostgreSQL as production, proven by the backup and Forgejo tests
  cnpg:
    instances: 1
    size: 1Gi
forgejo:
  persistence:
    size: 1Gi
  deployment:
    # Restated (lists are replaced), plus the sandbox CA for calls to Kanidm
    env:
      - name: CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: forgejo-kanidm-oauth2-credentials
            key: CLIENT_SECRET
      - name: HOMELAB_DOMAIN
        valueFrom:
          configMapKeyRef:
            name: forgejo-environment
            key: domain
      - name: SSL_CERT_DIR
        value: /etc/ssl/certs:/etc/homelab-dev-ca
  extraVolumes:
    - name: dev-ca
      # Not optional: the pod waits until trust-manager has copied the CA here
      configMap:
        name: homelab-dev-ca
  extraContainerVolumeMounts: &devCAMounts
    - name: dev-ca
      mountPath: /etc/homelab-dev-ca
      readOnly: true
  extraInitVolumeMounts: *devCAMounts
