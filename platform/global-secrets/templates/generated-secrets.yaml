{{- range concat .Values.secrets .Values.extraSecrets }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  length: {{ .length | default 32 }}
  digits: 6
  symbols: {{ if .special }}6{{ else }}0{{ end }}
  allowRepeat: true
  noUpper: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  # Generate once, even when ESO reconciles again: the PushSecret keeps OpenBao's first value (IfNotExists), so a
  # regenerated value would differ from the one every consumer reads (see secrets-management docs)
  refreshPolicy: CreatedOnce
  target:
    name: {{ .name }}
    template:
      data:
        {{ .key }}: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .name }}
{{- end }}
