{{- range concat .Values.secrets .Values.extraSecrets }}
{{- $entry := . }}
{{- if .destinations }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  # An existing value is never replaced; the hourly check pushes a missing one again (an OpenBao that lost its data)
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-writer
  selector:
    secret:
      name: {{ .name }}
  data:
    {{- range .destinations }}
    - match:
        secretKey: {{ $entry.key }}
        remoteRef:
          remoteKey: {{ . }}
          property: {{ $entry.key }}
    {{- end }}
{{- end }}
{{- end }}
