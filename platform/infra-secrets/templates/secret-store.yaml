# Writes OpenTofu's secrets into OpenBao: role infra reaches every branch except <namespace>/generated/
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-infra
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: infra
          # OpenBao's roles accept only this audience
          serviceAccountRef:
            name: openbao-infra
            audiences: [openbao]
