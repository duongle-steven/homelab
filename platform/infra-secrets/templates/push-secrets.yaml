{{- range .Values.secrets }}
{{- $entry := . }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .path | replace "/" "." }}
  namespace: {{ $.Release.Namespace }}
spec:
  # OpenTofu is the source: a changed value replaces OpenBao's, a lost one is pushed again within the hour
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-infra
  selector:
    secret:
      name: {{ .path | replace "/" "." }}
  data:
    {{- range .properties }}
    - match:
        secretKey: {{ . }}
        remoteRef:
          remoteKey: {{ $entry.path }}
          property: {{ . }}
    {{- end }}
{{- end }}
