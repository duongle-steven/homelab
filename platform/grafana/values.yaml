# Host label: <host>.<global.baseDomain>
host: grafana
grafana:
  admin:
    existingSecret: grafana-admin
  route:
    main:
      enabled: true
      parentRefs:
        - name: gateway
          namespace: istio-system
          sectionName: https
      hostnames:
        - grafana.{{ .Values.global.baseDomain }}
  # templates/rbac.yaml: only ConfigMaps, only here and in monitoring-system
  rbac:
    namespaced: true
    namespaces: [monitoring-system]
    useExistingRole: grafana-sidecar
  sidecar:
    # The chart's 2.14.1 bundles certifi's leaked emSign root (GHSA-6q48-6c7w-9gw2), fixed in 2.14.3: drop this once the
    # chart's default is newer
    image:
      tag: 2.14.3
    dashboards:
      enabled: true
      searchNamespace: monitoring-system
      resource: configmap
    datasources:
      enabled: true
      searchNamespace: monitoring-system
      resource: configmap
  # CLIENT_ID and CLIENT_SECRET of the Kanidm client (templates/kanidm-client.yaml)
  envFromSecret: grafana-kanidm-oauth2-credentials
  grafana.ini:
    server:
      root_url: https://grafana.{{ .Values.global.baseDomain }}
    # Traces to the gateway Collector (system/opentelemetry); plain inside the mesh, which encrypts it
    tracing.opentelemetry:
      propagation: w3c
    tracing.opentelemetry.otlp:
      address: gateway-collector.opentelemetry:4317
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      name: Kanidm
      client_id: grafana
      client_secret: $__env{CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://auth.{{ .Values.global.baseDomain }}/ui/oauth2
      token_url: https://auth.{{ .Values.global.baseDomain }}/oauth2/token
      api_url: https://auth.{{ .Values.global.baseDomain }}/oauth2/openid/grafana/userinfo
      use_pkce: true
      role_attribute_path: "contains(homelab_groups[*], 'homelab-admins') && 'GrafanaAdmin' || contains(homelab_groups[*], 'homelab-editors') && 'Editor' || contains(homelab_groups[*], 'homelab-users') && 'Viewer'"
      role_attribute_strict: true
      allow_assign_grafana_admin: true
      login_attribute_path: preferred_username
