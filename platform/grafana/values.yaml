grafana:
  admin:
    existingSecret: grafana-admin
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - &host grafana.khuedoan.com
    tls:
      - secretName: grafana-general-tls
        hosts:
          - *host
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring-system
    datasources:
      enabled: true
      searchNamespace: monitoring-system
  envFromSecret: grafana-secrets
  grafana.ini:
    server:
      root_url: https://grafana.khuedoan.com
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      name: Dex
      client_id: grafana-sso
      client_secret: $__env{GRAFANA_SSO_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://dex.khuedoan.com/auth
      token_url: https://dex.khuedoan.com/token
      api_url: https://dex.khuedoan.com/userinfo
      role_attribute_path: "contains(groups[*], 'homelab-admins') && 'Admin' || contains(groups[*], 'homelab-editors') && 'Editor' || contains(groups[*], 'homelab-users') && 'Viewer'"
      role_attribute_strict: true
      allow_assign_grafana_admin: true
      login_attribute_path: preferred_username
