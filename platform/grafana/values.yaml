# Host label: <host>.<global.baseDomain>
host: grafana
grafana:
  admin:
    existingSecret: grafana-admin
  route:
    main:
      enabled: true
      parentRefs:
        - name: gateway
          namespace: istio-system
          sectionName: https
      hostnames:
        - grafana.{{ .Values.global.baseDomain }}
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring-system
    datasources:
      enabled: true
      searchNamespace: monitoring-system
  # CLIENT_ID and CLIENT_SECRET of the Kanidm client (templates/kanidm-client.yaml)
  envFromSecret: grafana-kanidm-oauth2-credentials
  grafana.ini:
    server:
      root_url: https://grafana.{{ .Values.global.baseDomain }}
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      name: Kanidm
      client_id: grafana
      client_secret: $__env{CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://auth.{{ .Values.global.baseDomain }}/ui/oauth2
      token_url: https://auth.{{ .Values.global.baseDomain }}/oauth2/token
      api_url: https://auth.{{ .Values.global.baseDomain }}/oauth2/openid/grafana/userinfo
      use_pkce: true
      role_attribute_path: "contains(homelab_groups[*], 'homelab-admins') && 'GrafanaAdmin' || contains(homelab_groups[*], 'homelab-editors') && 'Editor' || contains(homelab_groups[*], 'homelab-users') && 'Viewer'"
      role_attribute_strict: true
      allow_assign_grafana_admin: true
      login_attribute_path: preferred_username
