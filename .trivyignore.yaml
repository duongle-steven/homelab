    expired_at: 2027-01-31
  - id: CVE-2026-33186
    statement: >-
      grpc-go v1.72.2's authz path validation (fixed in 1.79.3) in quay.io/argoproj/argo-events v1.9.11, the latest: it
      serves no gRPC with grpc/authz policies (platform/ci runs a webhook EventSource and a Sensor). Bump with Argo Events
    expired_at: 2027-01-31
  - id: CVE-2026-111497
    statement: >-
      brotli-libs 1.2.0 (fixed in 1.2.1) in excalidraw/excalidraw (the latest digest, unchanged since 2026-05) only for
      freetype and libcurl, which its nginx serving static files never loads. Bump when its image is rebuilt
    expired_at: 2026-12-31
  - id: CVE-2025-68121
    statement: >-
      Go's crypto/tls in argoproj/argocd v3.5.5's git-lfs and kustomize binaries (v3.5.9 still has them): a
      client-side TLS session resumption flaw, reached only on the repo server's fetches from GitHub and Forgejo behind
      default-deny egress. Bump when Argo CD rebuilds them
    expired_at: 2026-12-31
  - id: CVE-2026-31789
    statement: >-
      OpenSSL 3.3.3 in excalidraw/excalidraw (the latest digest): the overflow needs a 32-bit platform; the nodes are
      amd64
    expired_at: 2026-12-31
  - id: CVE-2026-6653
    statement: >-
      libxml2 in ghcr.io/cloudnative-pg/postgresql 18.6 (Debian has no fix yet): a denial of service through crafted
      XML; Forgejo never sends XML to PostgreSQL's xml functions, and only Forgejo reaches it
    expired_at: 2026-12-31
